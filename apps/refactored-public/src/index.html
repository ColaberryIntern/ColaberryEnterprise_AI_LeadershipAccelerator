<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Refactored.ai has moved to Colaberry Enterprise</title>
    <meta name="description" content="Refactored.ai is now part of the Colaberry Enterprise AI Leadership Accelerator." />
    <link rel="canonical" href="https://enterprise.colaberry.ai/" />
    <meta name="robots" content="noindex, follow" />

    <!--
      THIS PAGE SHOULD NEVER BE SEEN IN PRODUCTION.

      nginx/refactored.conf returns 301 for every path on this hostname, so nothing on
      disk is ever served. This file exists for three reasons, none of them "the site":

        1. `packages/app-build` throws without a src/ directory, and the nginx image build
           runs this app's build unconditionally.
        2. backend/src/__tests__/brandPageCategories.test.ts walks the apps that have both
           a brand.config.js and a src/, and requires at least three of them. Deleting the
           directory outright would fail that guard for an unrelated reason.
        3. If it ever DOES render, the redirect is missing — so it says so plainly.

      NO META REFRESH, DELIBERATELY. Bouncing the visitor automatically would hide exactly
      the misconfiguration this page is evidence of. A server-side 301 is the mechanism; a
      page that quietly imitates one turns a broken deploy into a silent one.
    -->
    <style>
      :root {
        --ground: #f7fafc;
        --surface: #ffffff;
        --ink: #16222c;
        --ink-muted: #4e6172;
        --accent: #1f76b4;
        --accent-ink: #ffffff;
        --line: #d5e0e8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ground: #0c141b;
          --surface: #14202a;
          --ink: #e8f0f6;
          --ink-muted: #9fb3c2;
          --accent: #5ca7da;
          --accent-ink: #06202f;
          --line: #263743;
        }
      }
      :root[data-theme="dark"] {
        --ground: #0c141b;
        --surface: #14202a;
        --ink: #e8f0f6;
        --ink-muted: #9fb3c2;
        --accent: #5ca7da;
        --accent-ink: #06202f;
        --line: #263743;
      }

      * { box-sizing: border-box; }

      body {
        background: var(--ground);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 6vw;
      }

      main {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2.5rem 2.25rem;
        max-width: 34rem;
      }

      h1 {
        font-size: clamp(1.5rem, 4vw, 2rem);
        line-height: 1.2;
        letter-spacing: -0.02em;
        text-wrap: balance;
        margin: 0 0 0.9rem;
      }

      p { color: var(--ink-muted); margin: 0 0 1.6rem; max-width: 48ch; }

      a.cta {
        display: inline-block;
        background: var(--accent);
        color: var(--accent-ink);
        text-decoration: none;
        font-weight: 600;
        padding: 0.8rem 1.4rem;
        border-radius: 4px;
        min-height: 44px;
      }
      a.cta:hover { filter: brightness(1.08); }
      a.cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Refactored.ai is now Colaberry Enterprise</h1>
      <p>
        The Refactored platform has moved. Everything it offered — the learning paths, the
        projects and the programs — now lives in the Colaberry Enterprise AI Leadership
        Accelerator.
      </p>
      <a class="cta" href="https://enterprise.colaberry.ai/">Go to Colaberry Enterprise</a>
    </main>

    <script src="/assets/track-v2.js" data-site="{{brand.sourceSlug}}" data-api="{{brand.platformApiBase}}" defer></script>
  </body>
</html>
