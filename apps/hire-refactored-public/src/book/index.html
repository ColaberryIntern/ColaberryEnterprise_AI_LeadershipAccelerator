<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book an interview &middot; Hire &middot; Refactored.ai</title>
  <!-- ALWAYS noindex: a booking link is private to the employer it was sent to and is never a search result. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/assets/tokens.css" />
  <link rel="stylesheet" href="/assets/hire.css" />
  <link rel="stylesheet" href="/assets/portfolio.css" />
  <link rel="stylesheet" href="/assets/schedule.css" />
  <link rel="stylesheet" href="/assets/booking.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <noscript><style>#booting{display:none}</style></noscript>
</head>
<body data-api="{{brand.platformApiBase}}" data-site="hire-refactored" data-view="book">
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="wrap bar">
      <a class="logo" href="/" aria-label="Hire &middot; Refactored.ai home">
        <svg class="mark" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M6 9l3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 15h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Refactored<span class="faint">.ai</span><span class="sub">hire</span>
      </a>
    </div>
  </header>

  <main id="main" tabindex="-1" class="wrap sched book">
    <div class="label">Book an interview</div>
    <section class="card panel" id="panel" aria-label="Booking" aria-live="polite">
      <p class="lede" id="booting">Loading open times...</p>
      <noscript>
        <p class="lede">Picking a time needs JavaScript. Reply to the email this link came in and we will book a time with you.</p>
      </noscript>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>Refactored.ai &middot; Hire: interviews are held in the Refactored interview room.</span>
    </div>
  </footer>
  <script src="/assets/common.js" defer></script>
  <script src="/assets/booking-model.js" defer></script>
  <script src="/assets/booking.js" defer></script>
</body>
</html>
