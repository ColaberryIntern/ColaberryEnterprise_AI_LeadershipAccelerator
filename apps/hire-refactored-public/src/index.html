<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hire · Refactored.ai: forward-deployed engineers, proven in production</title>
  <meta name="description" content="Forward-deployed and frontier AI engineers. Nobody is listed until a project they built is verified and published as a case study." />
  <link rel="canonical" href="{{brand.publicUrl}}/" />
  <meta property="og:title" content="Hire · Refactored.ai" />
  <meta property="og:description" content="Engineers who have already deployed AI into real work. Every listing is a published case study." />
  <meta property="og:image" content="{{brand.publicUrl}}/assets/og-default.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/assets/tokens.css" />
  <link rel="stylesheet" href="/assets/hire.css" />
  <link rel="stylesheet" href="/assets/motion.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
</head>
<body data-api="{{brand.platformApiBase}}" data-site="hire-refactored" data-view="directory">
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="wrap bar">
      <a class="logo" href="/" aria-label="Hire · Refactored.ai home">
        <svg class="mark" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M6 9l3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 15h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Refactored<span class="faint">.ai</span><span class="sub">hire</span>
      </a>
      <span class="spacer"></span>
      <nav class="nav" aria-label="Main">
        <a href="/#talent" class="hide-sm" data-scroll="talent">Talent</a>
        <a href="/#how" class="hide-sm" data-scroll="how">How listing works</a>
        <a href="/#published" class="hide-sm" data-scroll="published">Case studies</a>
        <button type="button" class="link" id="themeBtn" aria-label="Toggle light or dark theme">◐</button>
        <button type="button" class="btn btn-star" id="shortBtn">★ <span class="lbl">Shortlist</span> <span class="shortcount" id="shortCount">0</span></button>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- While the directory loads: neutral placeholder cards, never a message. Shipping
         "Nobody is listed yet" here flashed that FALSE sentence for 2-3 seconds on every visit
         (Ali, 2026-11-11). directory-page.js replaces this with the real page, with "Nobody is
         listed yet" only when the API says so, or with "could not be reached" when it fails. -->
    <section class="block" id="directory-loading" aria-busy="true">
      <div class="wrap">
        <h1 class="sr-only">Loading listed talent</h1>
        <div class="grid loading-grid" aria-hidden="true">
          <div class="tcard skel"></div><div class="tcard skel"></div><div class="tcard skel"></div>
        </div>
        <noscript><div class="empty"><p>This directory needs JavaScript to load the listed engineers.</p></div></noscript>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>Refactored.ai · Hire: talent is listed only after a shipped project is published as a case study.</span>
    </div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/common.js" defer></script>
  <script src="/assets/page.js" defer></script>
  <script src="/assets/directory.js" defer></script>
  <script src="/assets/directory-page.js" defer></script>
  <script src="/assets/motion.js" defer></script>
  <script src="/assets/launch.js" defer></script>
  <script src="/assets/track-v2.js" data-site="{{brand.sourceSlug}}" data-api="{{brand.platformApiBase}}" defer></script>
</body>
</html>
