<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case study · Hire · Refactored.ai</title>
  <!-- The record shell itself is never indexed; case-study.js sets the canonical to
       {{brand.publicUrl}}/case-studies/<slug> once the record is known. -->
  <meta name="robots" content="noindex, nofollow" id="robots" />
  <link rel="canonical" href="{{brand.publicUrl}}/" id="canonical" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/assets/tokens.css" />
  <link rel="stylesheet" href="/assets/hire.css" />
  <link rel="stylesheet" href="/assets/case-studies.css" />
  <link rel="stylesheet" href="/assets/case-study-visual-story.css" />
  <link rel="stylesheet" href="/assets/case-study.css" />
  <link rel="stylesheet" href="/assets/motion.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
</head>
<body data-api="{{brand.platformApiBase}}" data-site="hire-refactored" data-view="case-study">
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="wrap bar">
      <a class="logo" href="/" aria-label="Hire · Refactored.ai home">
        <svg class="mark" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M6 9l3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 15h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Refactored<span class="faint">.ai</span><span class="sub">hire</span>
      </a>
      <span class="spacer"></span>
      <nav class="nav" aria-label="Main">
        <a href="/#talent" class="hide-sm">Talent</a>
        <a href="/#published" class="hide-sm">Case studies</a>
        <button type="button" class="link" id="themeBtn" aria-label="Toggle light or dark theme">◐</button>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- Not-found state, shipped in the HTML. A slug that is unknown, withdrawn, or
         published only to another surface reads exactly the same. -->
    <div class="wrap" id="case-missing" style="padding:80px 24px">
      <div class="empty">
        <h1 class="mono">This case study isn't published here</h1>
        <p>It may have been withdrawn, or it has not been published to Hire yet.</p>
        <p><a class="btn btn-ghost" href="/">← Back to all talent</a></p>
      </div>
    </div>
    <!-- The frame is shipped hidden: case-study-record.js draws the body into #cs-record
         (it needs the element to exist when it runs), and case-study-page.js reveals the
         frame only once the record is known to be published on Hire. -->
    <div id="hire-hero-host"></div>
    <div class="wrap" id="case-frame" hidden>
      <div id="outcomes-host"></div>
      <div class="cs-body">
        <article class="cs-record" id="cs-record" aria-labelledby="cs-title"></article>
        <div id="hire-card-host"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>Refactored.ai · Hire: every claim on a case study traces to the published record.</span>
    </div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/common.js" defer></script>
  <script src="/assets/page.js" defer></script>
  <script src="/assets/case-study.js" defer></script>
  <script src="/assets/case-study-page.js" defer></script>
  <script src="/assets/motion.js" defer></script>
  <script src="/assets/launch.js" defer></script>
  <!-- The shared record renderer and its visual story band, in their required order. -->
  <script src="/assets/case-study-visual-model.js" defer></script>
  <script src="/assets/case-study-visual-graph.js" defer></script>
  <script src="/assets/case-study-visual-story.js" defer></script>
  <script src="/assets/case-study-record.js" data-api="{{brand.platformApiBase}}"
          data-surface="hire" data-index="/" defer></script>
  <script src="/assets/track-v2.js" data-site="{{brand.sourceSlug}}" data-api="{{brand.platformApiBase}}" defer></script>
</body>
</html>
