<style>
/* Layout idea: an operations console read top to bottom as an analysis: status, where the time went, what needs a person, then the evidence. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e9eeec; --ink:#14201d; --muted:#5a6a65; --line:#dbe3e0;
  --accent:#0f6b5c; --accent-soft:#dff0eb; --on-accent:#ffffff;
  --good:#0aac23; --good-ink:#006c10; --good-soft:#e3f5e6;
  --warn:#fbb315; --warn-ink:#7a5200; --warn-soft:#fdf1d3;
  --crit:#dc3c3d; --crit-ink:#a82224; --crit-soft:#fbe4e4;
  --s1:#257de0; --s1-light:#9dc8f7;
  --t0:#84b9f3; --t1:#338ced; --t2:#1b64be; --t3:#0e3d7e;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101614; --surface:#182220; --sunk:#131b19; --ink:#e8efec; --muted:#9aaaa5; --line:#2a3734;
    --accent:#56c7b1; --accent-soft:#1b3731; --on-accent:#06231d;
    --good:#0aac23; --good-ink:#5fd873; --good-soft:#143220;
    --warn:#fbb315; --warn-ink:#fbc54e; --warn-soft:#3a2f12;
    --crit:#eb6263; --crit-ink:#f39293; --crit-soft:#3d1c1d;
    --s1:#338ced; --s1-light:#1b64be;
    --t0:#9dc8f7; --t1:#519ced; --t2:#257de0; --t3:#1757ac;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101614; --surface:#182220; --sunk:#131b19; --ink:#e8efec; --muted:#9aaaa5; --line:#2a3734;
  --accent:#56c7b1; --accent-soft:#1b3731; --on-accent:#06231d;
  --good:#0aac23; --good-ink:#5fd873; --good-soft:#143220;
  --warn:#fbb315; --warn-ink:#fbc54e; --warn-soft:#3a2f12;
  --crit:#eb6263; --crit-ink:#f39293; --crit-soft:#3d1c1d;
  --s1:#338ced; --s1-light:#1b64be;
  --t0:#9dc8f7; --t1:#519ced; --t2:#257de0; --t3:#1757ac;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.15;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700;font-family:var(--body)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.demo{background:var(--ink);color:var(--bg);font-size:13px;padding:7px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo b{letter-spacing:.08em}
.demo .sp{flex:1}
.demo button{background:transparent;border:1px solid currentColor;border-radius:6px;padding:2px 10px;color:inherit;font-size:12.5px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 16px var(--display)}
.brand strong{font:700 18px var(--display)}
.brand .asof{margin-left:auto;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:hover{color:var(--ink)}
.badge{background:var(--warn-soft);color:var(--warn-ink);border-radius:10px;padding:0 7px;font-size:12px;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:22px 16px 64px;display:flex;flex-direction:column;gap:18px}
.lede{color:var(--muted);max-width:65ch;margin-top:4px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card > header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card > header .sub{color:var(--muted);font-size:13px}
.card > header .more{margin-left:auto;font-size:13px}
.tile{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px}
.tile:hover{border-color:var(--muted)}
.tile.warn{border-left-color:var(--warn)} .tile.good{border-left-color:var(--good)} .tile.crit{border-left-color:var(--crit)}
.tile .v{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.tile .v small{font:500 13px var(--body);color:var(--muted);margin-left:4px}
.tile .l{font-weight:600;margin-top:6px}
.tile .h{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:1px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.crit{background:var(--crit-soft);color:var(--crit-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:4px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scroll{overflow-x:auto}
/* timeline */
.tl svg{display:block;min-width:760px;width:100%;height:auto}
.tl text{font-family:var(--body);fill:var(--muted);font-size:12px}
.tl .rowt{fill:var(--ink);font-weight:600;font-size:13px}
.tl .hit{cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
/* stepper */
.steps{display:flex;gap:0;overflow-x:auto;padding:4px 0 2px}
.step{flex:1 0 118px;position:relative;padding:22px 8px 0 0;font-size:13px}
.step::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
.step:last-child::before{display:none}
.step::after{content:"";position:absolute;top:1px;left:0;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.step.done::after{background:var(--accent);border-color:var(--accent)}
.step.done::before{background:var(--accent)}
.step.current::after{border-color:var(--warn);background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.step.failed::after{border-color:var(--crit);background:var(--crit)}
.step.pending{color:var(--muted)}
.step .gapt{position:absolute;top:-9px;left:22px;font-size:11.5px;color:var(--muted);background:var(--surface);padding:0 4px}
.step b{display:block;font-weight:600}
/* bars */
.rows{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:13.5px}
@media (max-width:640px){.brow{grid-template-columns:minmax(0,1fr)}}
.track{position:relative;height:18px;background:var(--sunk);border-radius:4px}
.seg{position:absolute;top:0;bottom:0;border-radius:0 4px 4px 0}
.seg.base{background:var(--s1);border-radius:4px 0 0 4px}
.seg.add{background:var(--s1-light);border-left:2px solid var(--surface)}
.seg.add.over{background:repeating-linear-gradient(135deg,var(--crit) 0 4px,transparent 4px 7px);outline:1px solid var(--crit);outline-offset:-1px}
.lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.fun{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 10px;align-items:center;font-size:13px}
.fun .fb{height:16px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.fun .fr{display:flex;align-items:center;gap:8px}
.meter{display:flex;align-items:center;gap:8px;font-size:13px}
.meter .track{flex:1;height:8px;min-width:70px}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--s1)}
.meter .fill.over{background:var(--crit)}
/* decision cards */
.dec{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.dec.closed{border-left-color:var(--line)}
.dec .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dec .hd h3{margin-right:auto}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;font-size:13px}
.facts dt{color:var(--muted);font-size:12px}
.facts dd{margin:0;font-weight:500}
.msg{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:13.5px;border-left:3px solid var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* feed */
.feed{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:64px 14px minmax(0,1fr);gap:0 10px;padding:0 0 14px;position:relative}
.ev .t{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;text-align:right}
.ev .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);margin-top:5px;z-index:1}
.ev.human .dot{background:var(--accent);border-color:var(--accent)}
.ev.failed .dot{border-color:var(--crit);background:var(--crit)}
.ev.hold .dot{border-color:var(--warn);background:var(--warn)}
.ev::before{content:"";position:absolute;left:78px;top:14px;bottom:-4px;width:2px;background:var(--line)}
.ev:last-child::before{display:none}
.ev .a{font-weight:500}
.ev .r{font-size:13px;color:var(--muted);max-width:70ch}
.ev .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted);align-items:center}
.tag{border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer} tr.link:hover td{background:var(--sunk)}
.stack{display:flex;height:26px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface)}
.stack span{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;min-width:26px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px;max-width:320px;display:none;line-height:1.4}
#tip b{display:block}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:min(520px,calc(100% - 32px));display:none;z-index:60}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;max-width:75ch}
.back{font-size:13px;text-decoration:none}
@media (prefers-reduced-motion:no-preference){.tile,.btn,.chip{transition:border-color .15s}}
</style>
</head>

 var h='<div><a class="back" href="#gaps">← All gaps</a><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px"><h1>'+esc(g.name)+"</h1>"+gpill(g)+'</div><p class="lede">'+esc(win(g))+" on Nov 25, 2026 · "+esc(g.cov)+"</p></div>";
 h+='<section class="card"><dl class="facts"><div><dt>Call-out received</dt><dd>'+ft(g.recv)+" CST by "+esc(g.src.replace("call-out ",""))+"</dd></div><div><dt>Intake reference</dt><dd class=\"mono\">"+g.intake+'</dd></div><div><dt>Call-out reason</dt><dd>Removed on intake · never stored or shared</dd></div><div><dt>Coverage time</dt><dd>'+meter(g.elapsed,30,"min","Coverage time")+"</dd></div><div><dt>Dana’s active time</dt><dd>"+meter(g.dana,10,"min","Dana’s active time")+"</dd></div></dl></section>";
 h+='<section class="card"><header><h2>Path so far</h2><span class="sub">Minutes between steps</span></header>'+steps(id)+"</section>";
 var mine=S.decs.filter(function(d){return d.gap===id;});
 if(mine.length)h+='<section class="card"><header><h2>Decisions on this gap</h2></header><div class="rows" style="gap:12px">'+mine.map(decCard).join("")+"</div></section>";
 h+='<div class="grid two"><section class="card"><header><h2>Ranked candidates</h2><span class="sub">Weekly hours if they take this shift</span></header>'+candChart(id)+(id==="lark"?'<p class="note" style="margin-top:12px">Fairness: Rosalie accepted coverage more often in the preceding four weeks (Oct 28 to Nov 25), so Ianto and Sela moved ahead of her. All three received the same first wave. Tessa Wrenlow was excluded before dispatch because her approved leave covers the full shift.</p>':"")+"</section>";
 h+='<section class="card"><header><h2>Offer funnel</h2></header>'+funnel(id)+'<p class="muted" style="font-size:13px;margin:6px 0 14px">'+esc(funnelNote(id))+'</p><h3 style="margin-bottom:8px">Messages sent</h3><div class="rows">'+MSGS[id].map(function(m){return '<div><div style="font-size:13px"><span class="mono muted">'+m[0]+"</span> · <b>"+esc(m[2])+'</b> <span class="tag">'+m[1]+'</span></div><div class="msg" style="margin-top:4px;font-size:13px">'+esc(m[3])+"</div></div>";}).join("")+"</div></section></div>";
 var evs=events().filter(function(e){return e.gap===id;});
 h+='<section class="card"><header><h2>Decision trace</h2><span class="sub">'+evs.length+" entries, newest first</span></header><div class=\"feed\">"+evs.map(evRow).join("")+"</div></section>";
 return h;
}
function vDecisions(){
 var f=S.decFilter,list=S.decs.filter(function(d){return f==="all"||d.kind===f;});
 var h='<div><h1>Decisions</h1><p class="lede">Review overtime, agency drafts and availability flags before the agents can release them. Approval makes a reviewed draft ready to send. The gap stays uncovered until someone accepts.</p></div>';
 h+='<div class="chips" role="group" aria-label="Filter decisions">'+[["all","All"],["agency","Agency messages"],["overtime","Overtime"],["exception","Exceptions"]].map(function(c){var n=S.decs.filter(function(d){return (c[0]==="all"||d.kind===c[0])&&d.status==="pending";}).length;return '<button class="chip" aria-pressed="'+(f===c[0])+'" data-decf="'+c[0]+'">'+c[1]+" · "+n+" waiting</button>";}).join("")+"</div>";
 h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))">'+list.map(decCard).join("")+"</div>";
 return h;
}
function vHyg(){
 var MAX=48;
 var h='<div><h1>Hygienists</h1><p class="lede">See approved leave, current hours, and office eligibility. Hours are for the week of Nov 23, 2026.</p></div>';
 h+='<section class="card"><header><h2>Hours already worked this week</h2><span class="sub">Line marks 40 hr</span></header><div class="rows">'+HYG_ORDER.map(function(id){var p=HYG[id],offers=S.cands.filter(function(k){return k.h===id;});
  return '<div class="brow"><div><b>'+esc(p.name)+"</b><div>"+(p.avail==="leave"?pill("On approved leave","warn"):pill("Available for offers","good"))+'</div></div><div class="track" data-tip="'+esc("<b>"+p.name+"</b>"+p.hrs+" hr worked, week of Nov 23")+'"><span class="seg base" style="left:0;width:'+(p.hrs/MAX*100)+'%;border-radius:4px"></span><span class="lim" style="left:'+(40/MAX*100)+'%"></span></div><div class="num"><b>'+p.hrs+' hr</b><div class="muted" style="font-size:12px">'+(offers.length?offers.map(function(k){return GAPS[k.gap].name.split(" ")[0]+": "+OSTAT[k.status][0].toLowerCase();}).join(" · "):id==="tess"?"Leave Nov 25, 12:00 AM to Nov 26, 12:00 AM":"No offers today")+"</div></div></div>";}).join("")+"</div></section>";
 h+='<section class="card"><header><h2>Office eligibility</h2><span class="sub">Estimated commute in minutes · all licenses valid through Jun 30, 2027</span></header><div class="scroll"><table><thead><tr><th>Hygienist</th>'+["bramble","moss","lark"].map(function(o){return "<th>"+esc(GAPS[o].name)+"</th>";}).join("")+"</tr></thead><tbody>"+HYG_ORDER.map(function(id){var m={};ELIG[id].forEach(function(e){m[e[0]]=e[1];});return "<tr><td><b>"+esc(HYG[id].name)+"</b></td>"+["bramble","moss","lark"].map(function(o){return '<td class="num">'+(m[o]!=null?m[o]+" min"+(id==="astrid"?'<div class="muted" style="font-size:12px">'+esc((S.cands.filter(function(k){return k.id==="larkastrid";})[0].check||"").replace("Provisional · ","")||"")+"</div>":""):'<span class="muted">–</span>')+"</td>";}).join("")+"</tr>";}).join("")+"</tbody></table></div></section>";
 return h;
}
function vActivity(){
 var all=events(),list=all.filter(function(e){return (S.actGap==="all"||e.gap===S.actGap)&&(S.actWho==="all"||(S.actWho==="human"?e.human:S.actWho==="hold"?e.hold:!e.human));});
 var h='<div><h1>Activity log</h1><p class="lede">Follow the decisions behind each shift. Open a linked gap to see its texts, replies, and updates.</p></div>';
 h+='<div class="chips" role="group" aria-label="Filter by gap">'+[["all","All gaps"]].concat(GAP_ORDER.map(function(i){return [i,GAPS[i].name];})).map(function(c){return '<button class="chip" aria-pressed="'+(S.actGap===c[0])+'" data-actg="'+c[0]+'">'+esc(c[1])+"</button>";}).join("")+'<span style="width:10px"></span>'+[["all","Everyone"],["agent","Agents"],["human","Dana"],["hold","Held for Dana"]].map(function(c){return '<button class="chip" aria-pressed="'+(S.actWho===c[0])+'" data-actw="'+c[0]+'">'+c[1]+"</button>";}).join("")+"</div>";
 h+='<section class="card"><header><span class="sub">'+list.length+" of "+all.length+" entries, newest first</span></header><div class=\"feed\">"+(list.map(evRow).join("")||'<p class="muted">No entries match these filters.</p>')+"</div></section>";
 return h;
}
function vWho(){
 var all=events(),agents={},tiers={A0:0,A1:0,A2:0,A3:0},reqs={},sides={};
 all.forEach(function(e){tiers[e.tier]++;(e.reqs||[]).forEach(function(r){reqs[r]=(reqs[r]||0)+1;});if(e.side)sides[e.side.replace(/ (page|alert to Dana|front desk notice)$/,"")]=1;if(e.human)return;var a=agents[e.aid]||(agents[e.aid]={id:e.aid,name:e.agent,n:0,hold:0,tiers:{},gaps:{},last:e.action,fail:0});a.n++;if(e.hold)a.hold++;if(e.status==="failed")a.fail++;a.tiers[e.tier]=1;if(e.gap)a.gaps[e.gap]=1;});
 var list=Object.keys(agents).sort().map(function(k){return agents[k];});
 var nh=all.filter(function(e){return e.human;}).length,tc={A0:"var(--t0)",A1:"var(--t1)",A2:"var(--t2)",A3:"var(--t3)"};
 var h='<div><h1>Who does what</h1><p class="lede">See which tasks the agents handle and where a person decides. Built from the '+all.length+" entries in the activity log.</p></div>";
 h+='<div class="grid tiles"><div class="tile"><div class="v">'+list.length+'</div><div class="l">Agents active</div><div class="h">'+(all.length-nh)+' logged actions</div></div><div class="tile"><div class="v">'+nh+'</div><div class="l">Actions by Dana</div><div class="h">2 min of active time before 7:34</div></div><div class="tile warn"><div class="v">'+pending().length+'</div><div class="l">Held for a person</div><div class="h">Agents cannot release these</div></div><div class="tile crit"><div class="v">1</div><div class="l">Failed delivery</div><div class="h">Slack notice, delivered on retry</div></div></div>';
 h+='<section class="card"><header><h2>Actions by autonomy tier</h2><span class="sub">Tier labels as recorded on each log entry</span></header><div class="stack" role="img" aria-label="Actions by autonomy tier">'+["A0","A1","A2","A3"].map(function(t){return tiers[t]?'<span style="flex:'+tiers[t]+";background:"+tc[t]+(t==="A0"?";color:#0e2540":"")+'" data-tip="<b>'+t+"</b>"+tiers[t]+' actions">'+tiers[t]+"</span>":"";}).join("")+'</div><div class="legend">'+["A0","A1","A2","A3"].map(function(t){return '<span><i style="width:12px;height:12px;border-radius:3px;background:'+tc[t]+'"></i>'+t+" · "+tiers[t]+(t==="A0"?" (Dana)":t==="A2"?" (each held for approval)":"")+"</span>";}).join("")+"</div></section>";
 h+='<div class="grid two"><section class="card"><header><h2>Done by agents</h2></header><div class="scroll"><table><thead><tr><th>Agent</th><th>Actions</th><th>Tier</th><th>Gaps</th><th>Most recent</th></tr></thead><tbody>'+list.map(function(a){return "<tr><td><b>"+esc(a.name)+'</b><div class="mono muted">'+a.id+'</div></td><td class="num">'+a.n+(a.hold?"<div>"+pill(a.hold+" held","warn")+"</div>":"")+(a.fail?"<div>"+pill(a.fail+" failed","crit")+"</div>":"")+"</td><td>"+Object.keys(a.tiers).sort().join(", ")+"</td><td>"+(Object.keys(a.gaps).map(function(g){return GAPS[g].name.split(" ")[0];}).join(", ")||"–")+'</td><td style="min-width:220px">'+esc(a.last)+"</td></tr>";}).join("")+"</tbody></table></div></section>";
 h+='<section class="card"><header><h2>Decided by people</h2></header><div class="rows">'+S.decs.map(function(d){return '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><a href="#decisions" style="font-weight:500;margin-right:auto">'+esc(d.subject)+"</a>"+(d.status==="pending"?pill("Waiting on Dana","warn"):pill(d.result,d.status==="approved"?"good":""))+"</div>";}).join("")+'</div><h3 style="margin:18px 0 8px">Connections used</h3><div class="chips">'+Object.keys(sides).concat(["Agency email (drafts only)"]).map(function(s){return '<span class="tag" style="font-size:12.5px;padding:2px 8px">'+esc(s)+" · simulated</span>";}).join("")+'</div><h3 style="margin:18px 0 8px">Requirements cited in the log</h3><div class="chips">'+Object.keys(reqs).map(Number).sort(function(a,b){return a-b;}).map(function(r){return '<span class="tag num" style="font-size:12px;padding:2px 7px">REQ-'+("00"+r).slice(-3)+" × "+reqs[r]+"</span>";}).join("")+'</div><h3 style="margin:18px 0 8px">About this demo</h3><p class="muted" style="font-size:13px">Every person, time and number on these screens is made up. Project ShiftFill · plan version 1 · ee3ebe18fdb2 · sample seed 3997089304 · built 2026-11-25.</p></section></div>';
 return h;
}
/* ---------- shell ---------- */
var TABS=[["today","Today"],["gaps","Gaps"],["decisions","Decisions"],["hygienists","Hygienists"],["activity","Activity log"],["who-does-what","Who does what"]];
function route(){var h=(location.hash||"#today").slice(1);if(h.indexOf("gap-")===0&&GAPS[h.slice(4)])return {tab:"gaps",gap:h.slice(4)};for(var i=0;i<TABS.length;i++)if(TABS[i][0]===h)return {tab:h};return {tab:"today"};}
function render(keep){
 var r=route(),n=pending().length;
 document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<a href="#'+t[0]+'"'+(r.tab===t[0]?' aria-current="page"':"")+">"+t[1]+(t[0]==="decisions"&&n?'<span class="badge">'+n+"</span>":"")+"</a>";}).join("");
 var v=r.gap?vGap(r.gap):{today:vToday,gaps:vGaps,decisions:vDecisions,hygienists:vHyg,activity:vActivity,"who-does-what":vWho}[r.tab]();
 document.getElementById("app").innerHTML=v;
 if(!keep)window.scrollTo(0,0);
}
var toastT;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(function(){t.style.display="none";},4200);}
function decide(id,ans){
 var d=S.decs.filter(function(x){return x.id===id;})[0];if(!d||d.status!=="pending")return;
 var a=d[ans];d.status=ans==="yes"?"approved":"declined";d.result=a.result;
 if(d.cand){var c=S.cands.filter(function(k){return k.id===d.cand;})[0];if(a.release)c.release=a.release;if(a.cancel)c.status="canceled";if(a.check)c.check=a.check;}
 S.extra.unshift({id:"dana-"+id,t:NOW,gap:d.gap,agent:"Dana",aid:"dana",tier:"A0",risk:"low",status:"succeeded",hold:false,action:a.log,reason:"Decision recorded in this demo session.",side:"",reqs:[],human:true});
 EV.forEach(function(e){if((id==="fable"&&e.id==="mossfable")||(id==="juniper"&&e.id==="mossjuniper")||(id==="overtimedev"&&e.id==="larkovertime")||(id==="larkflag"&&e.id==="larkexception"))e._held=e.hold,e.hold=false;});
 render(true);toast(a.toast);
}
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-dec],[data-decf],[data-actg],[data-actw],[data-go],#reset");if(!t)return;
 if(t.id==="reset"){EV.forEach(function(e){if(e._held){e.hold=true;delete e._held;}});reset();render(true);toast("Demo reset to 7:34 AM.");return;}
 if(t.dataset.dec)return decide(t.dataset.dec,t.dataset.ans);
 if(t.dataset.decf){S.decFilter=t.dataset.decf;return render(true);}
 if(t.dataset.actg){S.actGap=t.dataset.actg;return render(true);}
 if(t.dataset.actw){S.actWho=t.dataset.actw;return render(true);}
 if(t.dataset.go&&!ev.target.closest("a"))location.hash=t.dataset.go;
});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.dataset&&ev.target.dataset.go)location.hash=ev.target.dataset.go;});
var tip=document.getElementById("tip");
function showTip(el,xx,yy){tip.innerHTML=el.getAttribute("data-tip");tip.style.display="block";var w=tip.offsetWidth,hh=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(xx+14,window.innerWidth-w-8))+"px";tip.style.top=(yy+hh+24>window.innerHeight?yy-hh-12:yy+16)+"px";}
document.addEventListener("mousemove",function(ev){var el=ev.target.closest&&ev.target.closest("[data-tip]");if(el)showTip(el,ev.clientX,ev.clientY);else tip.style.display="none";});
document.addEventListener("focusin",function(ev){var el=ev.target.closest&&ev.target.closest("[data-tip]");if(el){var b=el.getBoundingClientRect();showTip(el,b.left,b.bottom);}});
document.addEventListener("focusout",function(){tip.style.display="none";});
window.addEventListener("hashchange",function(){render();});
render();
})();
</script>
