<style>/* Refactored.ai tokens: copied from apps/refactored-public/src/assets/design/tokens (upstream aleemcolaberry/Refactored.ai-Design-System) */
:root{--bg:#0C141B;--bg-elevated:#14202A;--bg-sunk:#0A1016;--fg:#E8F0F6;--fg-muted:#9FB3C2;--fg-faint:#6E8496;--accent:#5CA7DA;--accent-contrast:#06202F;--accent-soft:#123246;--line:#263743;--line-strong:#354B5C;--success:#5FD59B;--success-soft:#10331F;--warning:#E0AE55;--warning-soft:#362708;--danger:#F08B8B;--danger-soft:#3A1717;

--s3xs:.25rem;--s2xs:.5rem;--sxs:.75rem;--ss:1rem;--sm:1.5rem;--sl:2.25rem;--radius:4px;--tap:44px;color-scheme:dark}
:root[data-theme="light"]{--bg:#F7FAFC;--bg-elevated:#FFFFFF;--bg-sunk:#EDF3F8;--fg:#16222C;--fg-muted:#4E6172;--fg-faint:#7B8D9C;--accent:#1F76B4;--accent-contrast:#FFFFFF;--accent-soft:#DDEEF9;--line:#D5E0E8;--line-strong:#B9CAD8;--success:#1B7A4B;--success-soft:#DCF2E6;--warning:#9A6407;--warning-soft:#FBEED2;--danger:#A82C2C;--danger-soft:#F8E0E0;--accent-hover:color-mix(in srgb,var(--accent) 88%,#000);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:var(--step-0)/1.55 var(--font-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}

.label{font:500 .7rem var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-faint)}
.muted{color:var(--fg-muted)}.faint{color:var(--fg-faint)}.small{font-size:.86rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:38px;padding:.45rem .95rem;border:1px solid transparent;border-radius:var(--radius);font-weight:600;font-size:.92rem;background:none;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-contrast)}.btn-primary:hover{background:var(--accent-hover)}

.p-ok{color:var(--success);background:var(--success-soft)}.p-warn{color:var(--warning);background:var(--warning-soft)}.p-bad{color:var(--danger);background:var(--danger-soft)}.p-info{color:var(--accent);background:var(--accent-soft)}.p-mute{color:var(--fg-faint)}
/* shell */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:var(--ss);height:58px;padding:0 var(--ss);background:var(--bg);border-bottom:1px solid var(--line)}

.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.rail .n{margin-left:auto;font:600 .7rem var(--font-mono);color:var(--accent-contrast);background:var(--accent);border-radius:999px;padding:0 .45rem}
.main{padding:var(--sm) var(--sl) var(--sl);min-width:0}

.ph .tx{flex:1;min-width:260px}.ph h1{margin:.3rem 0 .25rem}
/* surfaces: flat, bordered */
.card{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);padding:var(--ss) var(--sm)}
.card.acc{border-left:3px solid var(--accent)}.card.warn{border-left:3px solid var(--warning)}.card.ok{border-left:3px solid var(--success)}
.card h3{margin-bottom:.6rem}
.g{display:grid;gap:var(--ss)}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--ss);align-items:start}

.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font:500 .68rem var(--font-mono);letter-spacing:.11em;text-transform:uppercase;color:var(--fg-faint);padding:.55rem .5rem;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.tbl td{padding:.65rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--bg-sunk)}.tbl tr.sel td{background:var(--accent-soft)}
.tbl .num{font-family:var(--font-mono);text-align:right;white-space:nowrap}
.li{display:flex;gap:.75rem;align-items:flex-start;padding:.7rem 0;border-top:1px solid var(--line)}.li:first-of-type{border-top:0}
.li .grow{flex:1;min-width:0}.li b{display:block}
.tl{border-left:1px solid var(--line-strong);margin:.3rem 0 0 .4rem;padding-left:1rem}
.tl div{position:relative;padding:.35rem 0;font-size:.88rem}
.tl div:before{content:"";position:absolute;left:-1.33rem;top:.75rem;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--line-strong)}
.tl div.done:before{background:var(--success);border-color:var(--success)}.tl div.now:before{background:var(--accent);border-color:var(--accent)}
.tl code{color:var(--fg-faint);font-size:.75rem;margin-right:.4rem}
.bar{height:6px;background:var(--bg-sunk);border:1px solid var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.meter{display:grid;grid-template-columns:150px 1fr 54px;gap:.6rem;align-items:center;font-size:.86rem;padding:.25rem 0}.meter b{font-family:var(--font-mono);text-align:right}
.score{font:600 2.6rem var(--font-mono);line-height:1}.score small{font-size:.8rem;color:var(--fg-faint);margin-left:.2rem}
.sc-ok{color:var(--success)}.sc-warn{color:var(--warning)}.sc-bad{color:var(--danger)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:var(--ss);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:.6rem .9rem;color:var(--fg-muted);font-size:.9rem;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.8rem}
.field input,.field select,.field textarea{background:var(--bg-sunk);border:1px solid var(--line-strong);border-radius:var(--radius);padding:.55rem .7rem;min-height:40px}
.field textarea{min-height:120px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:none;padding:.45rem .9rem;color:var(--fg-muted);font-weight:600;font-size:.88rem}.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.calc{background:var(--bg-sunk);border:1px solid var(--line);border-radius:var(--radius);padding:var(--ss)}
.calc .ln{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0;font-size:.9rem}.calc .ln b{font-family:var(--font-mono)}
.calc .tot{border-top:1px solid var(--line-strong);margin-top:.4rem;padding-top:.6rem;font-size:1rem}.calc .tot b{color:var(--accent);font-size:1.25rem}
.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--accent-soft);padding:.7rem .9rem;border-radius:var(--radius);font-size:.88rem}

.step .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 .85rem var(--font-mono);border:1px solid var(--line-strong)}
.step.done .k{background:var(--success);border-color:var(--success);color:var(--bg)}
.vid{aspect-ratio:16/9;background:var(--bg-sunk);border:1px solid var(--line);border-radius:var(--radius);display:grid;place-items:center;position:relative;overflow:hidden}

.vid .sc{position:absolute;left:6px;top:6px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--ss)}

.lib .it:hover{border-color:var(--accent)}.lib .it .b{padding:.6rem .75rem .75rem}.lib .it b{display:block;font-size:.92rem;line-height:1.3}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:var(--ss)}
.chips button{border:1px solid var(--line-strong);background:none;border-radius:var(--radius);padding:.35rem .7rem;font-size:.85rem;color:var(--fg-muted)}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chips small{font-family:var(--font-mono);opacity:.7;margin-left:.3rem}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem}
.slots .d{font:500 .74rem var(--font-mono);color:var(--fg-faint);text-align:center;text-transform:uppercase;letter-spacing:.08em}
.slots button{border:1px solid var(--line-strong);background:none;border-radius:var(--radius);padding:.45rem 0;font:500 .82rem var(--font-mono)}
.slots button[aria-pressed="true"]{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}
.slots button:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(5,10,14,.6);z-index:50;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg-elevated);border-left:1px solid var(--line-strong);z-index:51;overflow:auto;padding:var(--sm);transform:translateX(100%);transition:transform .18s ease}
.drawer.on{transform:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--bg-elevated);border:1px solid var(--line-strong);border-radius:var(--radius);z-index:52;padding:var(--sm);display:none}
.modal.on{display:block}
.x{float:right;border:1px solid var(--line-strong);background:none;border-radius:var(--radius);width:34px;height:34px}
.room{position:fixed;inset:0;z-index:60;background:var(--bg-sunk);display:none;grid-template-rows:56px 1fr 72px}
.room.on{display:grid}
.room .rt{display:flex;align-items:center;gap:1rem;padding:0 1rem;border-bottom:1px solid var(--line)}
.room .stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:1rem;padding:1rem;min-height:0}
.room .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;min-height:0}
.room .tile{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);display:grid;place-items:center;position:relative}
.room .tile.spk{border-color:var(--accent)}
.room .tile .nm{position:absolute;left:8px;bottom:8px;font:500 .8rem var(--font-mono);background:var(--bg);border:1px solid var(--line);padding:.1rem .45rem;border-radius:3px}
.room .side{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;overflow:auto}
.room .rb{display:flex;align-items:center;justify-content:center;gap:.6rem;border-top:1px solid var(--line)}
.rec{display:inline-flex;align-items:center;gap:.4rem;font:600 .74rem var(--font-mono);color:var(--danger);letter-spacing:.08em}.rec i{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rec i{animation:none}.drawer{transition:none}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:.4rem;align-items:center}
#toast div{background:var(--fg);color:var(--bg);padding:.55rem .9rem;border-radius:var(--radius);font-size:.88rem;font-weight:600}
.proto{position:fixed;right:12px;bottom:12px;z-index:20;font:500 .7rem var(--font-mono);color:var(--fg-faint);background:var(--bg);border:1px solid var(--line);padding:.3rem .55rem;border-radius:var(--radius)}
@media (max-width:1100px){.split,.g3,.g4,.room .stage{grid-template-columns:minmax(0,1fr)}.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.shell{grid-template-columns:minmax(0,1fr)}.rail{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:.4rem}.rail .label{display:none}.rail button{width:auto;white-space:nowrap}.main{padding:var(--ss)}.prod,.who span{display:none}.top{gap:.6rem}.tbl{display:block;overflow-x:auto}.slots{grid-template-columns:repeat(3,minmax(0,1fr))}.room .tiles{grid-template-columns:minmax(0,1fr)}}

.card .g .btn{white-space:normal;text-align:center}
.room .meter{grid-template-columns:100px 1fr 76px}
.logo .wm{display:inline}
@media (max-width:820px){.aud{flex:1;min-width:0;overflow-x:auto}.aud button{padding:.4rem .55rem}.who{display:none}.logo .wm{display:none}.proto{display:none}}
/* ===== dash.css · one-page dashboard, sheets, the line ===== */
body.locked{overflow:hidden}
.top{gap:.9rem}
.jump{display:flex;align-items:center;gap:.6rem;flex:1;max-width:420px;margin-left:auto;min-height:38px;padding:0 .75rem;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--bg-sunk);color:var(--fg-faint);font-size:.9rem;text-align:left}
.jump:hover{border-color:var(--accent);color:var(--fg-muted)}
.jump kbd{margin-left:auto;font:500 .75rem var(--font-mono);border:1px solid var(--line-strong);border-radius:3px;padding:0 .35rem;color:var(--fg-muted)}
.aud{margin-left:0}
.aud-l{font-size:.78rem;color:var(--fg-faint)}
.main{max-width:1240px;margin:0 auto;padding:0 var(--sl) var(--sl)}
/* hero: words first, one action */
.hero{padding:clamp(2rem,5vw,3.6rem) 0 1.6rem;max-width:62ch}
.hero .date{color:var(--fg-faint);font-size:.9rem;margin-bottom:.9rem}
.hero h1{font-size:clamp(2rem,4.2vw,3rem);letter-spacing:-.035em;margin-bottom:.9rem}
.hero .next{font-size:clamp(1.1rem,1.6vw,1.3rem);line-height:1.5;color:var(--fg-muted);margin-bottom:1.4rem}
.hero .next b{color:var(--fg);font-weight:600}
.hero .btn{min-height:44px;padding:.6rem 1.15rem;font-size:.95rem}
/* the line: the one memorable thing */
.line-wrap{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:2.2rem 0 1.8rem;margin-bottom:2.2rem}
.line{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));position:relative}
.line:before,.line:after{content:"";position:absolute;left:9px;right:calc(100% / var(--n) - 9px);top:1.6rem;height:2px;background:var(--line-strong)}
.line:after{right:auto;width:calc((100% - 100% / var(--n)) * var(--f, 1));background:var(--accent);transform-origin:left;animation:draw 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes draw{from{transform:scaleX(0)}}
.stop{position:relative;min-width:0}
.stop button{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;width:100%;text-align:left;border:0;background:none;padding:0 1.2rem 0 0;border-radius:var(--radius)}
.stop .here-tag{position:absolute;top:-1.55rem;left:-.2rem;font:600 .72rem var(--font-sans);color:var(--accent)}
.stop .dot{width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--line-strong);margin:calc(1.6rem - 8px) 0 .9rem;position:relative;z-index:1;transition:transform .15s}
.stop.done .dot{background:var(--accent);border-color:var(--accent)}
.stop.here .dot{background:var(--bg);border:5px solid var(--accent);box-shadow:0 0 0 6px var(--accent-soft)}
.stop .nm{font-size:.95rem;color:var(--fg-muted)}
.stop .big{font:600 clamp(1.9rem,3.2vw,2.6rem)/1.05 var(--font-mono);letter-spacing:-.03em;color:var(--fg)}
.stop.ahead .big{color:var(--fg-muted)}
.stop .sub{font-size:.84rem;color:var(--fg-faint);max-width:24ch}
.stop button:hover .dot{transform:scale(1.18)}.stop button:hover .nm{color:var(--accent)}
.avs{display:flex;margin-top:.5rem}.av.sm{width:28px;height:28px;font-size:.66rem;margin-right:-6px;border:2px solid var(--bg)}
/* below the line */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(1.5rem,4vw,3.5rem);align-items:start}
.week .day{display:grid;grid-template-columns:132px minmax(0,1fr);gap:1rem;padding:1.1rem 0;border-top:1px solid var(--line)}
.week .day:first-child{border-top:0;padding-top:0}
.week .dl b{display:block;font:600 1.05rem var(--font-mono);letter-spacing:-.02em}.week .dl span{font-size:.82rem;color:var(--fg-faint)}
.week .day.today .dl b{color:var(--accent)}
.week ul{list-style:none;margin:0;padding:0}
.week li{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:.9rem;align-items:center;padding:.6rem .7rem;border-radius:var(--radius);margin:0 -.7rem}
.week li+li{border-top:1px dashed var(--line)}
.week li.key{background:var(--accent-soft);border-top-color:transparent}
.week li.key+li{border-top-color:transparent}
