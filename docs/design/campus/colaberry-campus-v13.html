/* =====================================================================
   WEATHER + TIME OF DAY: the campus follows each person's local weather and clock.
   Production: coarse location (profile city or IP city on the server, never stored precisely) → Open-Meteo (no key).
   Prototype: Open-Meteo for a city guessed from your time zone, "Use my exact location" asks the browser.
   ===================================================================== */
const WX={ready:false,city:'Dallas',lat:32.78,lon:-96.80,temp:null,code:0,isDay:true,sunrise:null,sunset:null,cond:'clear',tod:'day',hour:null,preview:null};
const TZCITY={'America/Chicago':['Dallas',32.78,-96.80],'America/New_York':['New York',40.71,-74.01],'America/Denver':['Denver',39.74,-104.99],'America/Los_Angeles':['Los Angeles',34.05,-118.24],'America/Phoenix':['Phoenix',33.45,-112.07],'Europe/London':['London',51.51,-0.13],'Asia/Kolkata':['Bengaluru',12.97,77.59],'Asia/Kathmandu':['Kathmandu',27.71,85.32],'Africa/Lagos':['Lagos',6.52,3.38],'Africa/Addis_Ababa':['Addis Ababa',9.03,38.74]};
const COND={clear:['☀️','Clear','🌙'],partly:['⛅','Partly cloudy','☁️'],cloudy:['☁️','Cloudy','☁️'],fog:['🌫️','Foggy','🌫️'],rain:['🌧️','Rain','🌧️'],snow:['🌨️','Snow','🌨️'],storm:['⛈️','Thunderstorms','⛈️']};
function codeToCond(c){return c===0?'clear':c<=2?'partly':c===3?'cloudy':c<=48?'fog':c<=67||(c>=80&&c<=82)?'rain':c<=77||c===85||c===86?'snow':c>=95?'storm':'cloudy'}
function todFrom(now){const h=now.getHours()+now.getMinutes()/60;let sr=6.75,ss=18.6;
  if(WX.sunrise&&WX.sunset){const a=new Date(WX.sunrise),b=new Date(WX.sunset);sr=a.getHours()+a.getMinutes()/60;ss=b.getHours()+b.getMinutes()/60}
  return h<sr-.75||h>ss+.75?'night':h<sr+.75?'dawn':h>ss-.75?'dusk':'day'}
async function wxLoad(lat,lon,city){
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;const g=TZCITY[tz];
  if(lat==null&&g){[WX.city,WX.lat,WX.lon]=g}else if(lat!=null){WX.lat=lat;WX.lon=lon;WX.city=city||'Your location'}
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${WX.lat}&longitude=${WX.lon}&current=temperature_2m,weather_code,is_day&daily=sunrise,sunset&temperature_unit=fahrenheit&timezone=auto&forecast_days=1`);
    const j=await r.json();WX.temp=Math.round(j.current.temperature_2m);WX.code=j.current.weather_code;WX.cond=codeToCond(WX.code);WX.isDay=!!j.current.is_day;WX.sunrise=j.daily.sunrise[0];WX.sunset=j.daily.sunset[0];WX.live=true}
  catch(e){WX.live=false;WX.temp=WX.temp??72}
  WX.ready=true;wxApply()}
function wxState(){const now=new Date();const tod=WX.preview?.tod||todFrom(now);const cond=WX.preview?.cond||WX.cond;const temp=WX.preview?.temp??WX.temp;
  return {tod,cond,temp,night:tod==='night',hour:WX.preview?.tod?({dawn:6,day:13,dusk:19,night:23})[tod]:now.getHours()}}
function wxLead(){const w=wxState();const c=COND[w.cond][1].toLowerCase();
  return w.cond==='rain'||w.cond==='storm'?`It’s ${c==='thunderstorms'?'storming':'raining'} in ${WX.city}, a good day to stay in and build.`:w.cond==='snow'?`Snow in ${WX.city} today. Stay warm.`:w.night?`Working late? The moon’s out over ${WX.city}.`:`It’s ${w.temp}° and ${c} in ${WX.city}.`}
function moonPhase(d=new Date()){const lp=2551443,nm=new Date(1970,0,7,20,35,0);return ((d-nm)/1000%lp)/lp}
const SKY={day:['linear-gradient(#5aa9e6,#bfe3ff)','#7fae5f','#a9b8c6'],dawn:['linear-gradient(#f6a46b,#ffd8a8 55%,#fff1d6)','#8aa36a','#b69c9a'],dusk:['linear-gradient(#3a2d6b,#c4567a 55%,#ffb070)','#5a6b4a','#4a4058'],night:['linear-gradient(#0b1230,#1b2752 70%,#2a3463)','#1f2a24','#232a40']};

function viewFrom(id){const b=byId[id];if(!b)return[];const all=[...B.filter(o=>o.id!==id),...LANDMARKS];
  return all.map(o=>{const dx=o.x-b.x,dy=o.y-b.y;return{o,dx,dy,d:Math.hypot(dx,dy),a:Math.atan2(dy,dx)}}).filter(v=>v.dx>20&&Math.abs(v.a)<1.1&&v.d<620).sort((x,y)=>x.d-y.d).slice(0,3)}
function miniBldg(o,lit){const W=100,H=Math.round(100*o.h/o.w),c=o.color,win=lit?'#ffd36e':'#bcd3dc';let r='';
  const wall=o.roof==='office'||o.roof==='pavilion'?'#dfe9f0':o.roof==='arcade'?'#2b1a3d':'#fbf6ee';
  if(o.roof==='pediment'||o.roof==='gable'||o.roof==='tower')r=`<polygon points="-6,0 ${W+6},0 ${W/2},${-Math.min(40,W*.3)}" fill="${c}"/>`;
  else if(o.roof==='dome')r=`<path d="M${W*.15} 0A${W*.35} ${W*.35} 0 0 1 ${W*.85} 0Z" fill="${c}"/>`;
  else if(o.roof==='arcade')r=`<rect x="-4" y="-16" width="${W+8}" height="16" rx="4" fill="#14091f" stroke="#ff4fa3" stroke-width="3"/>`;
  else if(o.roof==='amphi')return `<svg viewBox="-60 -50 220 70" width="__W__"><path d="M-50 15A100 60 0 0 1 150 15" stroke="${c}" stroke-width="16" fill="none"/><path d="M-25 15A75 44 0 0 1 125 15" stroke="${shade(c,-20)}" stroke-width="14" fill="none"/><rect x="25" y="-2" width="50" height="17" fill="#fbf6ee"/></svg>`;
  else r=`<rect x="-3" y="-8" width="${W+6}" height="9" fill="${c}"/>`;
  let wins='';const cols=Math.max(2,Math.round(W/22)),rows=Math.max(1,Math.round((H-20)/22));
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++)wins+=`<rect x="${8+j*(W-16)/cols}" y="${8+i*((H-14)/rows)}" width="${(W-16)/cols-5}" height="${(H-14)/rows-6}" rx="1" fill="${win}" opacity="${lit&&(i+j)%3===0?.35:1}"/>`;
  return `<svg viewBox="-8 -44 116 ${H+48}" width="__W__"><rect width="${W}" height="${H}" fill="${wall}" stroke="rgba(0,0,0,.15)"/>${wins}${r}</svg>`}
function miniLandmark(k,lit){if(k==='pond')return `<svg viewBox="0 0 120 30" width="__W__"><ellipse cx="60" cy="18" rx="58" ry="12" fill="#8fc4cc"/><ellipse cx="60" cy="16" rx="50" ry="8" fill="#b8e0e6"/></svg>`;
  if(k==='fountain')return `<svg viewBox="0 0 80 50" width="__W__"><ellipse cx="40" cy="42" rx="38" ry="8" fill="#e2d2b6"/><ellipse cx="40" cy="40" rx="30" ry="5" fill="#9fcbd2"/><path d="M40 38V10M40 12q-12 6-16 22M40 12q12 6 16 22" stroke="#c8e6ea" stroke-width="3" fill="none"/></svg>`;
  if(k==='board')return `<svg viewBox="0 0 70 60" width="__W__"><rect x="10" y="20" width="4" height="40" fill="#6e4a32"/><rect x="56" y="20" width="4" height="40" fill="#6e4a32"/><rect x="4" y="8" width="62" height="30" fill="#c69c6d" stroke="#8a5e40" stroke-width="3"/><rect x="12" y="14" width="12" height="10" fill="#fffdf6"/><rect x="30" y="16" width="12" height="10" fill="#fff6c9"/><rect x="48" y="13" width="12" height="10" fill="#e6f3f1"/></svg>`;
  return `<svg viewBox="0 0 80 60" width="__W__"><rect x="12" y="16" width="8" height="44" fill="#3a2f26"/><rect x="60" y="16" width="8" height="44" fill="#3a2f26"/><path d="M12 18Q40 0 68 18" stroke="#2a221b" stroke-width="4" fill="none"/></svg>`}
function windowView(lit){const v=viewFrom(S.room);if(!v.length)return{html:'',names:[]};
  const html=v.map(x=>{const frac=Math.max(-1,Math.min(1,x.a/1.1)),left=50+frac*38,sz=Math.max(22,Math.min(58,9000/(x.d+60)));

    return `<span data-view="${o.id}" style="position:absolute;left:${left-sz/2}%;bottom:${Math.max(6,22-sz/3)}%;width:${sz}%;filter:${lit?'brightness(.7)':'none'}">${svg.replace('width="'+sz+'%"','width="100%"')}</span>`}).join('');
  return{html:`<span class="view">${html}</span>`,names:v.filter(x=>!x.o.kind).map(x=>x.o.name).concat(v.filter(x=>x.o.kind).map(x=>x.o.name))}}

function windowHTML(high){const w=wxState();let [sky,hill,bldg]=SKY[w.tod];
  if(['cloudy','rain','storm','fog','snow'].includes(w.cond)&&!w.night)sky=w.cond==='snow'?'linear-gradient(#b9c3cf,#e6ebf0)':'linear-gradient(#7d8995,#b7c0c8)';
  if(w.night&&['cloudy','rain','storm'].includes(w.cond))sky='linear-gradient(#0b0f1c,#1c2333)';
  const lit=w.night||w.tod==='dusk'?'repeating-linear-gradient(transparent 0 6px,rgba(255,214,120,.85) 6px 9px,transparent 9px 14px)':'none';
  let x='';
  if(w.night){for(let i=0;i<22;i++)x+=`<span class="star" style="left:${(i*37)%100}%;top:${(i*23)%55}%;animation-delay:${i%5*.6}s;opacity:${w.cond==='clear'||w.cond==='partly'?1:0}"></span>`;
    if(w.cond==='clear'||w.cond==='partly'){const ph=moonPhase(),sh=ph<.5?`radial-gradient(circle at ${100-ph*200}% 50%,transparent 48%,rgba(11,18,48,.88) 52%)`:`radial-gradient(circle at ${(ph-.5)*200}% 50%,transparent 48%,rgba(11,18,48,.88) 52%)`;
      x+=`<span class="orb moon" style="left:68%;top:12%;--moonshade:${sh}"></span>`}}

  if(w.cond==='rain'||w.cond==='storm'){x+=`<span class="rain">${Array.from({length:26},(_,i)=>`<i style="left:${(i*41)%100}%;animation-delay:-${(i*.13)%0.7}s;animation-duration:${.55+(i%4)*.08}s"></i>`).join('')}</span><span class="drops"></span>`}

function wxApply(){const w=wxState();WX.hour=WX.preview?.tod?w.hour:null;

/* =====================================================================

   Owner rule: every return to the campus eases back to baseView.
   ===================================================================== */
const VW=()=>innerWidth, VH=()=>innerHeight;
function insets(){if(isMobile())return{l:0,t:70,r:0,b:Math.min(innerHeight*.4,360)+16};
  const p=$('panel').getBoundingClientRect();return{l:p.right+12,t:76,r:document.body.classList.contains('card-open')?$('card').getBoundingClientRect().width+24:12,b:12}}
function baseView(){const i=insets(),aw=VW()-i.l-i.r,ah=VH()-i.t-i.b;const s=Math.min(aw/990,ah/700,1.7);
  const sx=i.l+aw/2, sy=i.t+ah/2;return{w:VW()/s,cx:520+(VW()/2-sx)/s,cy:410+(VH()/2-sy)/s}}
function focusView(b){const s=Math.min(2.4,VW()/520);return{w:VW()/s,cx:b.x,cy:b.y-30}}
S.cam={cx:500,cy:600,w:VW()/2.2};S.camT=baseView();
let camEase=.06;
function writeCam(){const c=S.cam,h=c.w*VH()/VW();svg.setAttribute('viewBox',`${c.cx-c.w/2} ${c.cy-h/2} ${c.w} ${h}`)}
function camLoop(){
  if(S.follow){const s=Math.min(1.9,VW()/620);S.camT={w:VW()/s,cx:S.pos.x,cy:S.pos.y-20}}
  const e=reduce?1:camEase;for(const k of['cx','cy','w'])S.cam[k]+=(S.camT[k]-S.cam[k])*e;writeCam();requestAnimationFrame(camLoop)}
function recenter(){camEase=.06;S.follow=false;S.camT=baseView()}

/* =====================================================================
   WALKING: a path graph; ground clicks walk along the paths, then cut across the grass.
   ===================================================================== */
const N={hub:HUB,gate:GATE,aveC:{x:500,y:AVE}};
[100,900].forEach(x=>N['ave'+x]={x,y:AVE});
B.forEach(b=>{N['door_'+b.id]={x:b.x,y:b.y+6};if(b.zone==='ave')N['ave'+b.x]={x:b.x,y:AVE}});
const E=[['hub','aveC'],['aveC','gate']];
B.forEach(b=>{if(b.zone==='up')E.push(['hub','door_'+b.id]);else if(b.zone==='gate')E.push(['gate','door_'+b.id]);else E.push(['door_'+b.id,'ave'+b.x])});
const aveXs=[...new Set(Object.keys(N).filter(k=>k.startsWith('ave')&&k!=='aveC').map(k=>N[k].x).concat(500))].sort((a,b)=>a-b);
aveXs.forEach((x,i)=>{if(i){const a=aveXs[i-1]===500?'aveC':'ave'+aveXs[i-1],z=x===500?'aveC':'ave'+x;E.push([a,z])}});
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function project(p){let best=null;E.forEach(([a,z])=>{const A=N[a],Z=N[z],dx=Z.x-A.x,dy=Z.y-A.y,L=dx*dx+dy*dy;let t=L?((p.x-A.x)*dx+(p.y-A.y)*dy)/L:0;t=Math.max(0,Math.min(1,t));
  const q={x:A.x+t*dx,y:A.y+t*dy},d=dist(p,q);if(!best||d<best.d)best={a,z,q,d}});return best}
function routeTo(from,to){
  const s=project(from),t=project(to);
  if((s.a===t.a&&s.z===t.z)||(s.a===t.z&&s.z===t.a))return clean([from,s.q,t.q,to]);
  const nodes={...N,_S:s.q,_T:t.q},adj={};const add=(a,b)=>{const d=dist(nodes[a],nodes[b]);(adj[a]=adj[a]||[]).push([b,d]);(adj[b]=adj[b]||[]).push([a,d])};
  E.forEach(([a,z])=>add(a,z));add('_S',s.a);add('_S',s.z);add('_T',t.a);add('_T',t.z);
  const D={},prev={},Q=new Set(Object.keys(nodes));Object.keys(nodes).forEach(k=>D[k]=Infinity);D._S=0;
  while(Q.size){let u=null;Q.forEach(k=>{if(u===null||D[k]<D[u])u=k});Q.delete(u);if(u==='_T')break;(adj[u]||[]).forEach(([v,w])=>{if(D[u]+w<D[v]){D[v]=D[u]+w;prev[v]=u}})}
  const path=[];let u='_T';while(u){path.unshift(nodes[u]);u=prev[u]}
  return clean([from,...path,to]);
}
function clean(pts){const out=[];pts.forEach(p=>{if(!out.length||dist(out[out.length-1],p)>1)out.push({x:p.x,y:p.y})});return out}
function setAv(p){S.pos={x:p.x,y:p.y};$('avatar').setAttribute('transform',`translate(${p.x},${p.y})`)}
setAv(S.pos);
let walkJob=null;
function walk(pts,label,done){
  cancelWalk();
  const lens=[];let L=0;for(let i=1;i<pts.length;i++){const d=dist(pts[i-1],pts[i]);lens.push(d);L+=d}
  if(L<2){done&&done();return}
  const dur=reduce?1:Math.max(600,L/330*1000);
  const rl=el('polyline',{id:'routeLine',points:pts.map(p=>`${p.x},${p.y}`).join(' ')},$('g-route'));
  S.walking=true;S.follow=true;camEase=.07;$('avatar').classList.add('walking');
  const tt=toast(`🚶 Walking to ${esc(label)}…`,0,['Skip',()=>finish()]);
  const t0=performance.now();let lastStep=0;
  function at(f){let d=f*L;for(let i=0;i<lens.length;i++){if(d<=lens[i]){const a=pts[i],b=pts[i+1],r=lens[i]?d/lens[i]:0;return{x:a.x+(b.x-a.x)*r,y:a.y+(b.y-a.y)*r}}d-=lens[i]}return pts[pts.length-1]}
  function frame(now){if(!walkJob)return;let f=Math.min(1,(now-t0)/dur);const e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;const p=at(e);setAv(p);
    if(now-lastStep>140){lastStep=now;const d=el('circle',{cx:p.x+(Math.random()*4-2),cy:p.y+2,r:1.6,class:'step-dot'},$('g-steps'));setTimeout(()=>d.remove(),1700)}
    if(f<1)walkJob.raf=requestAnimationFrame(frame);else finish()}
  function finish(){if(!walkJob)return;cancelAnimationFrame(walkJob.raf);walkJob=null;setAv(pts[pts.length-1]);rl.remove();tt.remove();S.walking=false;S.follow=false;$('avatar').classList.remove('walking');done&&done()}
  walkJob={raf:requestAnimationFrame(frame),finish};
}
function cancelWalk(){if(walkJob){cancelAnimationFrame(walkJob.raf);walkJob=null;$('g-route').innerHTML='';$('toast').querySelectorAll('.t').forEach(t=>{if(t.textContent.includes('Walking'))t.remove()});S.walking=false;S.follow=false;$('avatar').classList.remove('walking')}}

    const rl=B.flatMap(b=>b.rooms.filter(r=>hit(r[0]+' '+b.name)).map(r=>({ic:b.icon,c:b.color,t:r[0],s:'in the '+b.name,a:'Go in →',go:()=>goTo(b.id,{then:()=>setTimeout(()=>throughDoor(r[1]),900)})})));

    if(hit('food eat lunch dinner hungry coffee snack doordash uber grubhub order'))groups.push(['FOOD',[{ic:'🍔',c:'#e07a1f',t:'Order food',s:'Chow Hall · opens your delivery app in a new tab',a:'Order ↗',go:()=>openOrder()}]]);

    if(pl.length)groups.push(['PEOPLE',pl.slice(0,5)]);if(bl.length)groups.push(['BUILDINGS',bl]);if(rl.length)groups.push(['ROOMS',rl.slice(0,8)]);}

document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('#pop')&&!t.closest('[data-pid]')&&!t.closest('.chip'))closePop();

  const mb=t.closest('[data-mb]');if(mb){const id=mb.dataset.mb;hidePage(true);closeRoom(false);goTo(id);return}
  if(t.id==='focus'){$('focus').classList.remove('on');return}
  if(t.id==='book'){$('book').classList.remove('on');return}
  if(t.id==='order'){$('order').classList.remove('on');return}
  const ap=t.closest('[data-app]');if(ap){toast(`↗ Opening ${APPS[ap.dataset.app].n} in a new tab`);return}
  if(t.id==='cboard'){$('cboard').classList.remove('on');return}
  const qb=t.closest('[data-q]');if(qb&&S.ws){const c=CARDS[S.ws.cid];const ok=+qb.dataset.q===c.q.a;qb.classList.add(ok?'right':'wrong');if(ok){(S.ws.l=S.ws.l||{}).q=true;lessonCheck(c)}else coryMsg('Not quite. Think about what Claude Code does after it makes a change.');return}
  const cy=t.closest('[data-cory]');if(cy){coryAsk(cy.dataset.cory);return}
  const a=t.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='go'){closePop();$('chat').classList.remove('on');if(S.page)hidePage(true);if(S.room)closeRoom(false);goTo(a.dataset.b)}
  else if(act==='close-room')closeRoom(true);
  else if(act==='today')openToday();
  else if(act==='aud')setAud(S.aud==='explorer'?'member':'explorer');
  else if(act==='book')openBook();

  else if(act==='crave-card'){ORDER.crave=ORDER.crave===a.dataset.k?null:a.dataset.k;renderCard()}
  else if(act==='apps-all'){ORDER.all=!ORDER.all;renderOrder()}

  else if(act==='wx-close')$('wxPop').classList.remove('on');
  else if(act==='wx-cond'){WX.preview={...(WX.preview||{}),cond:a.dataset.v};wxApply()}
  else if(act==='wx-tod'){WX.preview={...(WX.preview||{}),tod:a.dataset.v};wxApply()}
  else if(act==='wx-live'){WX.preview=null;wxApply()}
  else if(act==='wx-geo'){if(!navigator.geolocation)return toast('Location isn’t available in this browser');navigator.geolocation.getCurrentPosition(pos=>{wxLoad(+pos.coords.latitude.toFixed(2),+pos.coords.longitude.toFixed(2),'Your location');toast('📍 Using your location for the weather')},()=>toast('Location not shared · using your time zone’s city'))}
  else if(act==='arc-tab'){S.arcTab=a.dataset.g;renderCard()}
  else if(act==='mroom')openMSheet('peek',a.dataset.r);
  else if(act==='mnew')openMSheet('new');
  else if(act==='mbook')openMSheet('book');
  else if(act==='mjoin'){const r=MROOMS.find(x=>x.id===a.dataset.r);$('book').classList.remove('on');if(r&&!r.ppl.includes('__me'))r.ppl.push('__me');toast(`🚪 Joined ${esc(r.n)} · mic off, camera off`,3500);refreshRoom()}
  else if(act==='m-vis'){MSHEET.vis=a.dataset.v;renderMSheet()}

  else if(act==='m-day'){MSHEET.day=+a.dataset.i;renderMSheet()}
  else if(act==='m-slot'){MSHEET.slot=a.dataset.t;renderMSheet()}
  else if(act==='m-go')mGo();
  else if(act==='board')goBoard();
  else if(act==='board-close')$('cboard').classList.remove('on');

  function lock(){cur.m.forEach((r,i)=>r.forEach((v,j)=>{if(v&&cur.y+i>=0)grid[cur.y+i][cur.x+j]=cur.c}));let n=0;for(let y=ROWS-1;y>=0;y--){if(grid[y].every(v=>v)){grid.splice(y,1);grid.unshift(Array(COLS).fill(0));n++;y++}}
    if(n){addScore([0,100,300,500,800][n]*G.lvl);lines+=n;setLvl(1+Math.floor(lines/8))}spawn()}
  G.key=k=>{if(!cur)return;if(k==='ArrowLeft'||k==='a'){if(!hit(cur.m,cur.x-1,cur.y))cur.x--}else if(k==='ArrowRight'||k==='d'){if(!hit(cur.m,cur.x+1,cur.y))cur.x++}
    else if(k==='ArrowUp'||k==='w'){const r=rot(cur.m);for(const dx of[0,-1,1,-2,2])if(!hit(r,cur.x+dx,cur.y)){cur.m=r;cur.x+=dx;break}}
    else if(k==='ArrowDown'||k==='s'){if(!hit(cur.m,cur.x,cur.y+1)){cur.y++;addScore(1)}}else if(k===' '){while(!hit(cur.m,cur.x,cur.y+1)){cur.y++;addScore(2)}lock()}};
  G.step=dt=>{drop+=dt;const sp=Math.max(90,700-G.lvl*60);if(drop>sp){drop=0;if(!hit(cur.m,cur.x,cur.y+1))cur.y++;else lock()}};
  const cell=(x,y,c,s=S)=>{cx.fillStyle=COLORS[(c-1)%7];cx.fillRect(x+1,y+1,s-2,s-2);cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(x+1,y+1,s-2,4)};
  G.draw=()=>{cx.fillStyle='#0b0712';cx.fillRect(0,0,480,560);cx.strokeStyle='#2b1a3d';cx.lineWidth=2;cx.strokeRect(OX-2,OY-2,COLS*S+4,ROWS*S+4);
    cx.strokeStyle='rgba(255,255,255,.04)';cx.lineWidth=1;for(let x=0;x<=COLS;x++){cx.beginPath();cx.moveTo(OX+x*S,OY);cx.lineTo(OX+x*S,OY+ROWS*S);cx.stroke()}
    grid.forEach((r,y)=>r.forEach((v,x)=>v&&cell(OX+x*S,OY+y*S,v)));
    if(cur){let gy=cur.y;while(!hit(cur.m,cur.x,gy+1))gy++;cur.m.forEach((r,i)=>r.forEach((v,j)=>{if(v){cx.strokeStyle='rgba(255,255,255,.25)';cx.strokeRect(OX+(cur.x+j)*S+2,OY+(gy+i)*S+2,S-4,S-4)}}));
      cur.m.forEach((r,i)=>r.forEach((v,j)=>v&&cur.y+i>=0&&cell(OX+(cur.x+j)*S,OY+(cur.y+i)*S,cur.c)))}
    const px=OX+COLS*S+24;cx.fillStyle='#ffd6ee';cx.font='10px "Press Start 2P",monospace';cx.textAlign='left';cx.fillText('NEXT',px,OY+12);next.m.forEach((r,i)=>r.forEach((v,j)=>v&&cell(px+j*18,OY+26+i*18,next.c,18)));
    cx.fillText('LINES',px,OY+120);cx.fillStyle='#fff';cx.font='14px "Press Start 2P",monospace';cx.fillText(lines,px,OY+144)};
  spawn()}
/* Token Trail: an original snake-style game */
function initTrail(){const S=20,W=24,H=26;let snake=[{x:12,y:20},{x:12,y:21},{x:12,y:22}],dir={x:0,y:-1},nd=dir,acc=0,tok=place(),eaten=0;
  function place(){let p;do{p={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
  G.key=k=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[k];if(m&&!(m[0]===-dir.x&&m[1]===-dir.y))nd={x:m[0],y:m[1]}};
  G.step=dt=>{acc+=dt;const sp=Math.max(55,130-G.lvl*10);if(acc<sp)return;acc=0;dir=nd;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=W||h.y>=H||snake.some(s=>s.x===h.x&&s.y===h.y))return endGame();snake.unshift(h);
    if(h.x===tok.x&&h.y===tok.y){eaten++;addScore(10*G.lvl);setLvl(1+Math.floor(eaten/6));tok=place()}else snake.pop()};
  G.draw=()=>{cx.fillStyle='#0b0712';cx.fillRect(0,0,480,560);cx.fillStyle='rgba(255,255,255,.03)';for(let x=0;x<W;x++)for(let y=0;y<H;y++)if((x+y)%2)cx.fillRect(x*S,20+y*S,S,S);
    cx.fillStyle='#ffd23d';cx.beginPath();cx.arc(tok.x*S+S/2,20+tok.y*S+S/2,S/2-3,0,7);cx.fill();cx.fillStyle='#0b0712';cx.font='bold 10px DM Sans';cx.textAlign='center';cx.fillText('T',tok.x*S+S/2,20+tok.y*S+S/2+4);
    snake.forEach((s,i)=>{cx.fillStyle=i?`hsl(${140-i*2},90%,${60-Math.min(i,20)}%)`:'#7dff6b';cx.fillRect(s.x*S+1,20+s.y*S+1,S-2,S-2)})}}
/* Bug Breaker */
function initBreaker(){const pw=80;let px=200,ball={x:240,y:470,vx:0,vy:0,served:false},bricks=[],lives=3;
  function lay(){bricks=[];for(let r=0;r<5;r++)for(let c=0;c<8;c++)bricks.push({x:16+c*56,y:60+r*24,w:50,h:18,c:r})}lay();
  G.key=k=>{if(k===' '&&!ball.served){ball.served=true;ball.vx=2.4;ball.vy=-4.2}};
  cv.onmousemove=e=>{if(G&&G.id==='breaker'){const r=cv.getBoundingClientRect();px=(e.clientX-r.left)/r.width*480-pw/2}};
  G.step=dt=>{if(keys.ArrowLeft||keys.a)px-=6;if(keys.ArrowRight||keys.d)px+=6;px=Math.max(0,Math.min(480-pw,px));
    if(!ball.served){ball.x=px+pw/2;ball.y=496;return}ball.x+=ball.vx*dt/16;ball.y+=ball.vy*dt/16;
    if(ball.x<6||ball.x>474)ball.vx*=-1;if(ball.y<6)ball.vy*=-1;
    if(ball.y>500&&ball.y<510&&ball.x>px&&ball.x<px+pw&&ball.vy>0){ball.vy*=-1;ball.vx=((ball.x-px)/pw-.5)*8}
    if(ball.y>560){lives--;$('pLvl').textContent='♥'.repeat(Math.max(0,lives))+' · Lv '+G.lvl;if(!lives)return endGame();ball.served=false}
    for(const b of bricks)if(!b.dead&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.dead=true;ball.vy*=-1;addScore(10*G.lvl);break}
    if(bricks.every(b=>b.dead)){setLvl(G.lvl+1);lay();ball.served=false;ball.vy*=1.1}};
  G.draw=()=>{cx.fillStyle='#0b0712';cx.fillRect(0,0,480,560);bricks.forEach(b=>{if(b.dead)return;cx.fillStyle=COLORS[b.c];cx.fillRect(b.x,b.y,b.w,b.h);cx.fillStyle='#0b0712';cx.fillRect(b.x+14,b.y+6,4,4);cx.fillRect(b.x+32,b.y+6,4,4)});
    cx.fillStyle='#e31b23';cx.fillRect(px,500,pw,10);cx.fillStyle='#fff';cx.beginPath();cx.arc(ball.x,ball.y,6,0,7);cx.fill();
    if(!ball.served){cx.fillStyle='#ffd6ee';cx.font='10px "Press Start 2P",monospace';cx.textAlign='center';cx.fillText('SPACE OR TAP TO SERVE',240,330)}};
  cv.onclick=()=>G&&G.key&&G.key(' ');$('pLvl').textContent='♥♥♥ · Lv 1'}

addEventListener('keydown',e=>{if(!$('cab').classList.contains('on'))return;if(e.key==='Escape'){stop();$('cab').classList.remove('on');return}
  keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();G&&!G.over&&G.key&&G.key(e.key)});
addEventListener('keyup',e=>keys[e.key]=false);
$('pad').onclick=e=>{const b=e.target.closest('[data-k]');if(b&&G&&G.key)G.key(b.dataset.k)};
let tsx=0,tsy=0;cv.addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;if(!G||!G.key)return;if(Math.abs(dx)<10&&Math.abs(dy)<10)return G.key(G.id==='stack'?'ArrowUp':' ');G.key(Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowRight':'ArrowLeft'):(dy>0?'ArrowDown':'ArrowUp'))});

document.addEventListener('click',e=>{const p=e.target.closest('[data-play]');if(p){openGame(p.dataset.play);return}
  const t=e.target.closest('[data-tab]');if(t){LB.tab=t.dataset.tab;renderLB();return}
  const s=e.target.closest('[data-gscroll]');if(s){document.getElementById(s.dataset.gscroll)?.scrollIntoView({behavior:'smooth'});return}
  const tt=e.target.closest('[data-toast]');if(tt)toast(esc(tt.dataset.toast))});

renderGames();renderLB();renderFeed();renderTime();
window.ARC={GAMES,gById,seedScores,drawArt,openGame,fmtT,get LEFT(){return LEFT},renderAll(){renderGames();renderLB();renderFeed();renderTime()}};
