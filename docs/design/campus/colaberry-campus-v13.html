<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colaberry Campus v13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--neon:#ff4fa3;--cyan:#3de0ff;--pix:'Press Start 2P',var(--mono);--purple:#6b2fa0;
  --paper:#fbf7f0; --card:#fffdf9; --ink:#1f1b16; --muted:#6b6258; --faint:#9a9086; --line:#e9e0d3; --line2:#f1eadf;
  --red:#e31b23; --red-d:#b3161c; --teal:#0f766e; --teal-l:#e6f3f1; --navy:#1f3a5f; --gold:#d4a017; --green:#1f8a4c;
  --grass:#dfe9cf; --shadow:0 10px 30px rgba(40,30,20,.12),0 2px 6px rgba(40,30,20,.06);
  --r:18px; --ctl:36px; --panelW:360px; --cardW:360px; --gap:12px;
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- MAP ---------- */
#map{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#map .bld{cursor:pointer}
#map .bld .body-g{transition:transform .25s}
#map .bld:hover .body-g,#map .bld.hl .body-g{transform:translateY(-3px)}
#map .lbl rect{fill:#fff;stroke:#e6dccb}
#map .lbl text{font:700 11px var(--sans);fill:var(--ink)}
#map .bld:hover .lbl rect,#map .bld.hl .lbl rect{fill:var(--ink);stroke:var(--ink)}
#map .bld:hover .lbl text,#map .bld.hl .lbl text{fill:#fff}
#map .bld.dim{opacity:.45}
#map .water{animation:shim 4s ease-in-out infinite}
@keyframes shim{50%{opacity:.6}}
#map .neon{animation:neon 2.4s linear infinite}
@keyframes neon{0%,100%{stroke:#ff4fa3}50%{stroke:#3de0ff}}
.ppl-chip rect{fill:#fff;stroke:#e6dccb}
.ppl-chip text{font:800 9px var(--sans);fill:var(--ink)}
#routeLine{fill:none;stroke:var(--red);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;animation:march .6s linear infinite}
@keyframes march{to{stroke-dashoffset:-9}}
.step-dot{fill:#c9b08a;animation:stepfade 1.6s forwards}
@keyframes stepfade{to{opacity:0}}
#dropPin .ring{fill:none;stroke:var(--red);stroke-width:2;animation:ringp 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ringp{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
#avatar .bob{animation:none}
#avatar.walking .bob{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2.5px)}}
.plan-pin circle{stroke:var(--teal);stroke-width:1.6}
.plan-pin text{font:800 7px var(--sans)}

/* ---------- v13: TODAY FOR EXPLORERS ---------- */
.todaybtn{font:800 15px var(--sans,'DM Sans');color:var(--ink);cursor:pointer;border:0;white-space:nowrap}
.todaybtn .n{font:700 11px var(--mono);background:var(--line2);border-radius:999px;padding:2px 8px;color:var(--muted)}
body.aud-explorer .todaybtn{background:var(--red);color:#fff;box-shadow:0 8px 22px rgba(227,27,35,.35)}
body.aud-explorer .todaybtn .n{background:rgba(255,255,255,.22);color:#fff}
.todaybtn:hover{filter:brightness(1.05)}
.audchip{height:34px;border-radius:17px;border:2px solid var(--green);color:var(--green);background:#fff;font:800 11px var(--sans,'DM Sans');letter-spacing:.1em;padding:0 12px;cursor:pointer;white-space:nowrap}
body:not(.aud-explorer) .audchip{border-color:var(--navy);color:var(--navy)}
.todaycard{display:block;width:100%;text-align:left;border:2px solid var(--red);background:linear-gradient(180deg,#fff,#fff5f4);border-radius:18px;padding:14px 16px;margin:12px 0 4px;cursor:pointer;font:inherit;color:var(--ink)}
.todaycard .k{font:800 11px var(--sans,'DM Sans');letter-spacing:.14em;color:var(--red)}
.todaycard h3{margin:4px 0 2px;font-size:19px}
.todaycard p{margin:0 0 10px;color:var(--muted);font-size:13.5px;line-height:1.4}
.todaycard ul{list-style:none;margin:0 0 12px;padding:0}
.todaycard li{display:flex;gap:8px;align-items:baseline;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line2)}
.todaycard li span{color:var(--muted);min-width:78px;font-size:12px;font-weight:700}
.todaycard li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.todaycard .go{display:flex;align-items:center;justify-content:center;height:46px;border-radius:999px;background:var(--red);color:#fff;font-weight:800;font-size:15px}
.todayrow{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;margin:10px 0 2px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.todayrow small{color:var(--muted)}
.todayrow .go{margin-left:auto;color:var(--red);font-weight:800}
.todaytile{border:2px solid var(--red);border-radius:16px;padding:12px 14px;margin-bottom:12px;background:#fff5f4}
.todaytile b{display:block;font-size:15px}.todaytile small{color:var(--muted)}
.tdplan{padding:6px 18px}
.tdrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.tdrow:last-child{border-bottom:0}
.tdrow .tx{flex:1;min-width:0}.tdrow .tx b{display:block}.tdrow .tx small{color:var(--muted)}
.tdrow.done .tx b{text-decoration:line-through;color:var(--muted)}
.tdrow em{font-style:normal;color:var(--green);font-weight:700;font-size:13px}
.tdhelp{display:flex;align-items:center;gap:10px;padding:8px 0}
.gate-today{cursor:pointer}
.tower-flag{cursor:pointer;display:none}
body.aud-explorer .tower-flag{display:inline}
@media (max-width:760px){.todaybtn .n,.audchip{display:none}}
/* ---------- TOP BAR ---------- */
.top{position:fixed;top:12px;left:12px;right:12px;height:52px;display:flex;align-items:center;gap:10px;z-index:30;pointer-events:none}
.top>*{pointer-events:auto}
.pill{height:52px;background:var(--card);border-radius:26px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 16px}
.brand{gap:12px}
.brand img,.brand .logo{height:26px}
.brand .sub{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);border-left:1px solid var(--line);padding-left:12px}
.search{flex:1;max-width:520px;margin:0 auto;color:var(--muted);justify-content:flex-start;font-size:15px}
.search .kbd{margin-left:auto}
.kbd{font:600 11px var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);background:#fff}
.stats{gap:14px;font-weight:700;font-size:13.5px}
.rung{background:#ffd84d;color:#3a2e00;border-radius:12px;padding:4px 10px;font-size:12px}
.sep{width:1px;height:22px;background:var(--line)}
.iconbtn{width:var(--ctl);height:var(--ctl);border-radius:50%;display:grid;place-items:center;position:relative;font-size:16px}
.iconbtn:hover{background:var(--line2)}
.badge-n{position:absolute;top:2px;right:0;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.me{width:38px;height:38px;border-radius:50%;background:#3a2f26;color:#fff;font:800 13px var(--sans);display:grid;place-items:center}
.proto-tag{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:52;background:rgba(31,27,22,.82);color:#fff;font-size:11.5px;padding:6px 12px;border-radius:14px;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

/* ---------- SIDE PANEL (always on) ---------- */
#panel{position:fixed;left:12px;top:76px;bottom:12px;width:var(--panelW);background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:auto;z-index:20;padding:22px 20px 20px;scrollbar-width:thin}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:800}
h1.greet{font-family:var(--serif);font-size:30px;line-height:1.08;margin:6px 0 6px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 14px;line-height:1.45}
.pulse{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:16px;line-height:1.35}
.pulse:hover{background:var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 3px rgba(31,138,76,.15)}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between}
.sec small{letter-spacing:0;text-transform:none;font-weight:600;color:var(--faint);font-size:12px}
.upnext{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.upnext .row{display:flex;gap:10px;align-items:flex-start}
.num{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 12px var(--sans);border:2px solid var(--teal);color:var(--teal);background:#fff}
.num.on{background:var(--teal);color:#fff}
.num.done{background:var(--green);border-color:var(--green);color:#fff}
.upnext b{display:block;font-size:14.5px;line-height:1.3}
.meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{height:var(--ctl);border-radius:18px;padding:0 16px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:#fff;max-width:100%}
.btn:hover{background:var(--line2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}.btn.teal:hover{background:#0b5f58}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn.block{width:100%}
.tourcard{margin-top:14px;border-radius:16px;padding:14px;background:linear-gradient(135deg,#fff5f2,#fff);border:1px solid #f3d5cc;display:flex;gap:12px;align-items:center}
.tourcard .tx{flex:1;min-width:0}
.tourcard b{display:block;font-size:14.5px}
.tourcard p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.4}
.tourcard.going{background:linear-gradient(135deg,#eef3fb,#fff);border-color:#cfdbee}
.tourcard.done{background:#fff;border-style:dashed}
.plan{border:1px solid var(--line);border-radius:16px;padding:6px 12px;background:#fff}
.plan .it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);width:100%;text-align:left;align-items:flex-start}
.plan .it:last-child{border-bottom:0}
.plan .it b{font-size:13.5px;line-height:1.3;display:block}
.plan .it.done b{text-decoration:line-through;color:var(--faint)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:2px 7px;background:var(--teal-l);color:var(--teal);margin-left:6px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;border-radius:17px;border:1px solid var(--line);padding:0 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;background:#fff}
.chip:hover{background:var(--line2)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font:800 10.5px var(--sans);color:#fff;flex:none}
.av.staff{box-shadow:0 0 0 2px var(--gold)}
.chip small{color:var(--muted);font-weight:500}
.here-rooms{display:flex;flex-direction:column;gap:6px}
.roomrow{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;text-align:left;width:100%}
.roomrow:hover{background:var(--line2)}
.roomrow code{font:500 11px var(--mono);color:var(--faint)}

/* ---------- ARRIVAL CARD (right) ---------- */
#card{position:fixed;right:12px;top:76px;bottom:12px;width:var(--cardW);background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:auto;z-index:21;transform:translateX(calc(100% + 30px));transition:transform .5s cubic-bezier(.2,.9,.2,1);scrollbar-width:thin}
#card.open{transform:none}
.hero{padding:20px 20px 18px;color:#fff;border-radius:22px 22px 0 0;position:relative}
.hero .kicker{color:rgba(255,255,255,.85)}
.hero h2{font-family:var(--serif);font-size:30px;margin:4px 0 2px;letter-spacing:-.01em}
.hero p{margin:0;opacity:.9}
.x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:16px;display:grid;place-items:center}
.x:hover{background:rgba(255,255,255,.36)}
.cbody{padding:16px 18px 18px}
.planbox{border:1px solid #cfe5e1;background:var(--teal-l);border-radius:16px;padding:14px}
.planbox .k{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--teal);display:flex;gap:8px;align-items:center}
.planbox b{display:block;font-size:15px;margin:6px 0 2px;line-height:1.3}
.whorow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.whorow:last-child{border-bottom:0}
.whorow .nm{flex:1;min-width:0}
.whorow .nm b{display:block;font-size:13.5px}
.whorow .nm small{color:var(--muted);font-size:12px}
.lv{font-size:10.5px;font-weight:800;background:#fff3c4;color:#6b5200;border-radius:7px;padding:1px 6px;margin-left:4px}
.stafftag{font-size:10px;font-weight:800;background:var(--gold);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px;letter-spacing:.05em}
.cfoot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tourblk{border:1px solid #f3d5cc;background:#fff8f6;border-radius:16px;padding:14px;margin-bottom:14px}
.tourblk .k{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--red)}
.tourblk .n{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:11px}
.tourblk h3{margin:8px 0 4px;font-size:17px}
.tourblk p{margin:0;color:var(--muted);line-height:1.45}
.tourblk .tip{margin-top:10px;border:1px dashed #e5c7bd;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#7a5146;background:#fff}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#e8d6cf}
.dots i.on{background:var(--red);width:16px;border-radius:4px}
.dots i.dn{background:#c98f80}
.tournav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.tournav .dots{order:-1;width:100%;margin-bottom:4px}

/* ---------- ROOM (CSS 3D) ---------- */
#roomWrap{position:fixed;top:76px;bottom:12px;left:calc(12px + var(--panelW) + 12px);right:12px;z-index:15;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:#2a221c;
  clip-path:circle(0% at var(--ox,50%) var(--oy,50%));transition:clip-path .7s cubic-bezier(.3,.8,.2,1),right .5s cubic-bezier(.2,.9,.2,1);pointer-events:none}
#roomWrap.on{clip-path:circle(150% at var(--ox,50%) var(--oy,50%));pointer-events:auto}
body.card-open #roomWrap{right:calc(12px + var(--cardW) + 12px)}
#mapDim{position:fixed;inset:0;background:rgba(30,26,20,.38);opacity:0;transition:opacity .5s;z-index:14;pointer-events:none}
body.in-room #mapDim{opacity:1;pointer-events:auto;cursor:pointer}
.stage{position:absolute;inset:0;perspective:var(--persp,1000px);perspective-origin:var(--po,68%) 40%;overflow:hidden}
.room{position:absolute;inset:0;transform-style:preserve-3d}
.room .face{position:absolute;backface-visibility:hidden}
.room .back{left:0;top:0;width:var(--FW);height:var(--FH);transform:translateZ(calc(var(--D) * -1))}
.room .left{left:0;top:0;width:var(--D);height:var(--FH);transform-origin:left center;transform:rotateY(90deg)}
.room .right{right:0;top:0;width:var(--D);height:var(--FH);transform-origin:right center;transform:rotateY(-90deg)}
.room .floor{left:0;bottom:0;width:var(--FW);height:var(--D);transform-origin:bottom center;transform:rotateX(90deg)}
.room .ceil{left:0;top:0;width:var(--FW);height:var(--D);transform-origin:top center;transform:rotateX(-90deg)}
.room .floor{background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 90px),var(--floor)}
.room .ceil{background:var(--ceil)}
.room .ceil i{position:absolute;width:150px;height:46px;border-radius:50%;background:#fff7d6;box-shadow:0 0 40px 10px rgba(255,247,214,.55)}
.room .back{background:var(--wall)}
.room .left,.room .right{background:var(--wallS)}
.room .wainscot{position:absolute;left:0;right:0;bottom:0;height:16%;background:rgba(0,0,0,.06);border-top:3px solid rgba(0,0,0,.06)}
/* back wall screen: the next step */
.screen{position:absolute;left:5%;right:5%;top:5%;height:74%;cursor:zoom-in;background:#17131c;border-radius:18px;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.screen .inner{width:100%;height:100%;border-radius:10px;background:#fff;display:flex;flex-direction:column;justify-content:center;padding:4% 5%;position:relative;overflow:hidden}
.screen .inner:before{content:"";position:absolute;left:0;top:0;right:0;height:7px;background:var(--bc)}
.screen .k{font-size:calc(var(--FW) * .026);font-weight:800;letter-spacing:.12em;color:var(--red);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pts{font:700 13px var(--mono);white-space:nowrap;color:#1b6b3a;background:#e5f4ea;border-radius:8px;padding:3px 8px;letter-spacing:0}
.screen h3{font-size:calc(var(--FW) * .05);line-height:1.12;margin:12px 0 10px;letter-spacing:-.01em}
.screen p{font-size:calc(var(--FW) * .028);color:var(--muted);margin:0 0 16px}
.screen .btnrow .btn{height:calc(var(--FW) * .07);font-size:calc(var(--FW) * .03);padding:0 calc(var(--FW) * .03);border-radius:999px}
.screen .pts{font-size:calc(var(--FW) * .026)}
.screen .stand{display:none;position:absolute;left:50%;bottom:-38px;width:12px;height:38px;background:#3a2f26;transform:translateX(-50%)}
/* wall boards */
.board{position:absolute;background:#fff;border-radius:16px;padding:22px 26px;box-shadow:0 10px 24px rgba(0,0,0,.14);border:6px solid #3a2f26;cursor:zoom-in;transition:filter .2s}
.board:hover{filter:brightness(1.04)}
.board h4{margin:0 0 8px;font-size:36px;display:flex;align-items:center;gap:10px}
.board .r{display:flex;justify-content:space-between;font-size:27px;padding:5px 0;border-bottom:2px solid var(--line2)}
.board .r b{font-family:var(--mono)}
.board .bar{height:12px;border-radius:6px;background:var(--line2);margin:6px 0 10px;overflow:hidden}
.board .bar i{display:block;height:100%;background:var(--red)}
.board p{font-size:28px;line-height:1.4;margin:0;color:var(--muted)}
.board .pin{position:absolute;top:-14px;left:50%;width:20px;height:20px;border-radius:50%;background:var(--red);transform:translateX(-50%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
/* door + directory on the right wall */
.door{position:absolute;bottom:0;width:26%;height:58%;background:var(--doorC);border-radius:8px 8px 0 0;cursor:pointer;box-shadow:inset 0 0 0 8px rgba(0,0,0,.15)}
.door .glow{position:absolute;inset:12px 12px 0;background:#fff6d6;opacity:0;transition:opacity .3s;border-radius:4px 4px 0 0}
.door:hover .glow,.door.open .glow{opacity:.9}
.door .knob{position:absolute;right:14%;top:52%;width:18px;height:18px;border-radius:50%;background:#ffd36e}
.gosign{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;cursor:pointer}
.gosign .btn{height:40px;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.gosign small{background:rgba(23,19,28,.78);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.directory{position:absolute;top:12%;width:44%;background:#26303a;color:#fff;border-radius:14px;padding:20px 24px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.directory h5{margin:0 0 10px;font-size:20px;letter-spacing:.14em;color:#9fc0d6}
.directory button{display:flex;justify-content:space-between;width:100%;font-size:24px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12);color:#fff;text-align:left}
.directory button:last-child{border-bottom:0}
.directory button:hover{color:#ffd36e}
/* people + furniture (billboards in 3D) */
.bb{position:absolute;left:0;top:0;transform-style:preserve-3d}
#furn,#figs{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
#furn>*,#figs>*{pointer-events:auto}
.desk{height:40px;background:linear-gradient(#9a6a4a 0 18%,#7a5038 18%);border-radius:4px}
.desk.bench{background:linear-gradient(#90a0a3 0 18%,#6c7a7d 18%)}
.rtable{width:150px;height:56px}
.rtable:before{content:"";position:absolute;left:0;right:0;top:0;height:30px;border-radius:50%;background:#f2e6d2;border:3px solid #9a7a5a}
.rtable:after{content:"";position:absolute;left:50%;top:28px;width:10px;height:28px;margin-left:-5px;background:#9a7a5a}
.fig{width:70px;height:130px;cursor:pointer}
.fig svg{width:100%;height:100%;overflow:visible}
.fig .nm{opacity:0;transition:opacity .15s}
.fig:hover .nm,.fig.you .nm,.fig.staff .nm{opacity:1}
.deskstaff{width:150px;height:46px;background:var(--gold);border-radius:6px;color:#fff;font:800 13px var(--sans);display:grid;place-items:center;letter-spacing:.08em}
.bubble{position:absolute;white-space:nowrap;background:#fff;border:2px solid var(--gold);border-radius:16px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
/* room HUD */
.hud{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;z-index:5}
.hud .h{height:var(--ctl);border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.hud .dark{background:rgba(23,19,28,.86);color:#fff}
.hud .light{background:#fff}
.hud .light:hover{background:var(--line2)}
.roomtag{position:absolute;top:14px;left:14px;z-index:5;background:rgba(23,19,28,.78);color:#fff;font-size:11px;font-weight:800;letter-spacing:.12em;border-radius:12px;padding:6px 10px}
.hint{position:absolute;top:14px;right:14px;z-index:5;background:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;max-width:280px;box-shadow:var(--shadow);line-height:1.4;transition:opacity .4s}
.goingdoor .room{transition:transform .5s ease-in;transform:scale(2.2);transform-origin:var(--dx,85%) 70%}

/* ---------- TWO DOORS: front door (the section page) and back door (your workstation) ---------- */
.door.front{background:linear-gradient(90deg,var(--doorC) 0 49%,rgba(0,0,0,.35) 49% 51%,var(--doorC) 51%);box-shadow:inset 0 0 0 8px rgba(0,0,0,.15),0 0 0 10px #efe6d6}
.door.front .knob{right:54%}
.bdoor{position:absolute;right:4%;bottom:0;width:16%;height:60%;background:linear-gradient(#4b5058,#30343a);border-radius:6px 6px 0 0;cursor:pointer;box-shadow:inset 0 0 0 6px #23262b;overflow:hidden}
.bdoor:before{content:"";position:absolute;left:0;right:0;top:0;height:8%;background:repeating-linear-gradient(135deg,#f2b632 0 16px,#23262b 16px 32px)}
.bdoor .win{position:absolute;left:22%;right:22%;top:17%;height:15%;background:#ffcf6b;border-radius:4px;box-shadow:0 0 34px 8px rgba(255,190,80,.6)}
.bdoor .bar{position:absolute;left:12%;right:12%;top:54%;height:5%;background:#9aa3ad;border-radius:3px}
.bdoor .glow{position:absolute;inset:0;background:#ffcf6b;opacity:0;transition:opacity .3s}
.bdoor:hover .glow,.bdoor.open .glow{opacity:.35}
.bdoor-lamp{position:absolute;right:5%;width:18%;bottom:62%;display:flex;justify-content:center}
.bdoor-lamp i{width:46%;height:26px;border-radius:6px;background:#2b2e33;border:3px solid #f2b632;box-shadow:0 0 22px rgba(242,182,50,.7);color:#f2b632;font:800 15px var(--mono);display:grid;place-items:center;letter-spacing:.12em;font-style:normal}
.dsign{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;width:220px}
.dsign .tag2{font:800 10.5px var(--sans);letter-spacing:.14em;border-radius:8px;padding:3px 9px;white-space:nowrap}
.dsign .btn{height:38px;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.22);max-width:220px}
.dsign .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dsign.d-front .tag2{background:#fff;color:var(--ink)}
.dsign.d-back .tag2{background:#2b2e33;color:#f2b632}
.btn.amber{background:#2b2e33;border-color:#2b2e33;color:#ffd27a}.btn.amber:hover{background:#1c1e22}
/* arrival card: two ways in */
.ways{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.way{border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;border:1px solid var(--line);background:#fff}
.way:hover{filter:brightness(.98)}
.way .wk{font-size:10.5px;font-weight:800;letter-spacing:.14em}
.way b{font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.way small{color:var(--muted);font-size:12px;line-height:1.35}
.way .go2{margin-top:auto;font-weight:800;font-size:12.5px}
.way.front .wk{color:var(--red)}.way.front .go2{color:var(--red)}
.way.back{background:#26292e;border-color:#26292e;color:#f5efe6}.way.back .wk{color:#f2b632}.way.back small{color:#b9b2a8}.way.back .go2{color:#ffd27a}

/* ---------- WORKSTATION (the back door) ---------- */
#ws{position:fixed;inset:0;z-index:55;display:none;flex-direction:column;background:#211c18;color:#f2ebe1;--navW:300px;--railW:360px}
#ws.on{display:flex}
#ws.clip{transition:clip-path .6s cubic-bezier(.3,.8,.2,1)}
#ws .locbar{position:relative;flex:none;color:var(--ink)}
.wsbody{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr);gap:18px;padding:18px 22px;
  background:radial-gradient(ellipse 700px 420px at 18% 0%,rgba(255,206,120,.16),transparent 70%),radial-gradient(circle,rgba(255,255,255,.06) 1.4px,transparent 1.6px) 0 0/22px 22px,#211c18}
/* bench: tickets pinned to a strip of cork */
.bench{grid-column:1/3;display:flex;gap:14px;align-items:stretch;background:linear-gradient(#a87c52,#94693f);border-radius:14px;padding:12px 14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 6px 18px rgba(0,0,0,.3);min-width:0;overflow-x:auto}
.bench .bl{display:flex;flex-direction:column;justify-content:center;color:#fff6e6;flex:none;padding-right:6px}
.bench .bl small{font-size:10.5px;font-weight:800;letter-spacing:.14em;opacity:.85}
.bench .bl b{font-size:14px}
.ticket{position:relative;background:#fffdf6;color:var(--ink);border-radius:4px;padding:10px 12px 9px;width:180px;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.25);transform:rotate(var(--rot,0deg));font-size:12.5px;line-height:1.3}
.ticket:before{content:"";position:absolute;top:-7px;left:50%;width:46px;height:14px;margin-left:-23px;background:rgba(255,255,255,.55);transform:rotate(-3deg)}
.ticket .st{font-size:10px;font-weight:800;letter-spacing:.1em;margin-bottom:4px;display:block}
.ticket.done{opacity:.8}.ticket.done .st{color:var(--green)}.ticket.done b{text-decoration:line-through;color:var(--muted)}
.ticket.active{outline:3px solid #f2b632;box-shadow:0 0 0 6px rgba(242,182,50,.25),0 6px 14px rgba(0,0,0,.3)}.ticket.active .st{color:#b8860b}
.ticket.queued .st{color:var(--muted)}
.ticket small{display:block;color:var(--muted);margin-top:4px;font-size:11px}
.desktools{margin-left:auto;display:flex;flex-direction:column;gap:6px;justify-content:center;flex:none;min-width:190px}
.tool{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);color:#fff6e6;border-radius:12px;padding:6px 10px;font-size:12.5px;font-weight:700}
.tool button{margin-left:auto;background:#fff6e6;color:var(--ink);border-radius:10px;padding:3px 9px;font-size:11.5px;font-weight:800}
.tool.on{background:#2b2e33;color:#f2b632}
.tool .avs{display:flex;margin-left:auto}.tool .avs .av{width:22px;height:22px;font-size:9px;margin-left:-6px;box-shadow:0 0 0 2px #94693f}
/* left: terminal (stories) or notebook (lessons) */
.term{background:#121010;border:1px solid #3a332c;border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.term .th{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid #2c2622}
.term .th i{width:10px;height:10px;border-radius:50%;display:inline-block}
.term .th span{margin-left:8px;font:700 11px var(--mono);color:#a99f93;letter-spacing:.08em}
.term .repo{padding:12px 14px 6px;font-size:12px;color:#b9b2a8}
.term .repo a{color:#7cc4ff;font-weight:700;font-size:14px;text-decoration:none;display:block;margin:2px 0}
.term .tb{display:flex;gap:6px;padding:6px 14px 10px;flex-wrap:wrap}
.term .tb button{height:30px;border-radius:15px;padding:0 12px;font-size:12px;font-weight:700;background:#2a2521;color:#f2ebe1;border:1px solid #3a332c}
.term .tb button.pri{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
.term .log{flex:1;overflow:auto;padding:4px 14px 14px;font:500 11.5px/1.55 var(--mono);color:#cfc7bb}
.term .log div{padding:3px 0;border-bottom:1px dashed #2a2420}
.term .log .h{color:#f2b632}.term .log .g{color:#7ee2a8}.term .log .d{color:#7d756b}
.term .log .new{animation:flash 1.6s}
@keyframes flash{0%{background:rgba(126,226,168,.25)}100%{background:transparent}}
.cursor{display:inline-block;width:7px;height:13px;background:#7ee2a8;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.notebook{background:repeating-linear-gradient(#fffdf6 0 27px,#e7ddd0 27px 28px);color:var(--ink);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.35);border-left:6px solid #e31b23}
.notebook h4{margin:0;padding:14px 16px 6px;font-size:12px;letter-spacing:.14em;color:var(--muted);background:#fffdf6}
.notebook textarea{flex:1;border:0;background:transparent;resize:none;font:500 15px/28px var(--sans);padding:0 16px;outline:none;color:var(--ink)}
.notebook .nb-f{padding:8px 16px;font-size:11.5px;color:var(--muted);background:#fffdf6;border-top:1px solid #e7ddd0}
/* centre: the monitor */
.monitor{display:flex;flex-direction:column;min-height:0;align-items:stretch}
.bezel{flex:1;min-height:0;background:#0e0c0b;border-radius:20px;padding:12px;box-shadow:0 16px 40px rgba(0,0,0,.45),inset 0 0 0 1px #2e2924}
.scr{height:100%;background:var(--paper);color:var(--ink);border-radius:10px;overflow:auto;padding:26px 30px;scrollbar-width:thin}
.mstand{height:18px;width:120px;margin:0 auto;background:linear-gradient(#2a2420,#191512);border-radius:0 0 10px 10px}
.scr .k2{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--red);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scr h2{font-size:24px;line-height:1.25;margin:10px 0 8px;letter-spacing:-.01em}
.scr .lede{font-size:16px;line-height:1.5;color:#3a332c;margin:0 0 10px}
.chipm{font:700 11px var(--mono);background:#e6eef5;color:#2f5f86;border-radius:8px;padding:3px 8px}
.sec2{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-weight:800}
.sec2 .n{width:22px;height:22px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:11px}
.sec2 small{margin-left:auto;font:600 11px var(--mono);color:var(--faint)}
.dm{background:#fff;border:1px solid var(--line);border-radius:14px}
.dm .row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line2)}
.dm .row:last-child{border-bottom:0}
.dm .row input{margin-top:3px;width:16px;height:16px;accent-color:var(--ink)}
.dm .row .tx{flex:1;line-height:1.45}
.state{display:inline-block;margin-top:6px;font:700 10.5px var(--mono);letter-spacing:.06em;border-radius:7px;padding:3px 8px}
.state.ok{background:#e3f2e7;color:#1b6b3a}.state.note{background:var(--line2);color:var(--muted)}.state.wait{border:1px dashed #cdbfae;color:var(--faint)}
.dm .row.ok{background:#f3faf5}
.dm .row.ok .tx{color:#1b4b2c}
.prompt{background:#16130f;color:#e9e1d4;border-radius:14px;padding:14px 16px;font:500 12.5px/1.6 var(--mono);white-space:pre-wrap;position:relative}
.prompt .cp{position:absolute;top:10px;right:10px}
.donebar{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.donebar p{margin:0;flex:1;color:var(--muted);font-size:13px;line-height:1.45}
.donebar.won{background:#e3f2e7;border-color:#bfe0c9}.donebar.won p{color:#1b4b2c}
.player{position:relative;aspect-ratio:16/9;max-width:560px;cursor:pointer;background:linear-gradient(135deg,#1b2733,#3f6f8f);border-radius:14px;overflow:hidden;display:grid;place-items:center;color:#fff}
.player .ttl{position:absolute;left:18px;top:14px;right:18px;font-weight:700;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.player .play{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--red);font-size:30px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.player .pbar2{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.25)}
.player .pbar2 i{display:block;height:100%;width:0;background:var(--red);transition:width .2s linear}
.player .tm{position:absolute;right:14px;bottom:14px;font:700 12px var(--mono);background:rgba(0,0,0,.45);border-radius:6px;padding:2px 6px}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;background:#fff;font-size:13.5px}
.qopt:hover{background:var(--line2)}.qopt.right{border-color:#1f8a4c;background:#e3f2e7}.qopt.wrong{border-color:#e31b23;background:#fdecec}
/* right: Cory */
.cory{background:#fffdf9;color:var(--ink);border-radius:18px;grid-row:1/3;grid-column:3;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.cory .ch2{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cory .ch2 .av{width:38px;height:38px;font-size:13px;background:#2f8f5b;position:relative}
.cory .ch2 .av:after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#3ddc84;border:2px solid #fff}
.cory .ch2 small{display:block;color:var(--muted);font-size:12px}
.cory .msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.cory .m.them{background:#e8f1ef}
.cory .sc{display:flex;gap:6px;padding:8px 14px 0}
.cory .sc button{font:800 11px var(--mono);letter-spacing:.08em;border:1px solid var(--line);border-radius:14px;padding:5px 11px;background:#fff}
.cory .sc button:hover{background:var(--line2)}
.cory form{display:flex;gap:8px;padding:10px 14px 14px}
.cory input{flex:1;height:var(--ctl);border-radius:18px;border:1px solid var(--line);padding:0 14px;font:inherit;min-width:0}
.wsstatus{flex:none;display:flex;gap:30px;align-items:center;background:#0f0d0c;color:#efe8de;padding:10px 22px;font:700 13px var(--mono);overflow-x:auto;white-space:nowrap}
.wsstatus small{display:block;font-size:9.5px;letter-spacing:.14em;color:#8b8379;font-weight:700}
.wsstatus em{font-style:normal;color:#7cc4ff;font-size:11px}
.feedws{margin-left:12px;font-size:12.5px;font-weight:700;color:var(--navy);display:inline-flex;align-items:center;gap:6px}
@media (max-width:1100px){.wsbody{grid-template-columns:minmax(0,1fr) 320px}.bench{grid-column:1/2}.wsbody .term,.wsbody .notebook{display:none}.cory{grid-column:2}}
@media (max-width:760px){.wsbody{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow:auto;padding:12px}.bench{grid-column:1}.cory{grid-row:auto;grid-column:1;min-height:420px}.monitor{min-height:70vh}.desktools{display:none}}

/* doors on the back wall, each with its sign ON the door */
.door.front{left:4%;width:16%;height:60%;border-radius:8px 8px 0 0;box-shadow:inset 0 0 0 6px rgba(0,0,0,.18),0 0 0 8px #efe6d6}
.plate{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;border-radius:6px;pointer-events:none;line-height:1.15}
.door.front .plate{top:20%;background:#fffdf6;color:var(--ink);padding:calc(var(--FW)*.008) calc(var(--FW)*.012);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.door.front .plate small{display:block;font:800 calc(var(--FW)*.014) var(--sans);letter-spacing:.14em;color:var(--red)}
.door.front .plate b{display:block;font:800 calc(var(--FW)*.03) var(--sans)}
.bdoor .plate{top:38%;background:#1f2226;border:3px solid #f2b632;color:#f2b632;font:800 calc(var(--FW)*.03) var(--mono);letter-spacing:.14em;padding:calc(var(--FW)*.005) calc(var(--FW)*.012);box-shadow:0 0 18px rgba(242,182,50,.55)}
.door.front:hover,.bdoor:hover{filter:brightness(1.12)}
/* book a call with admissions */
#book{position:fixed;inset:0;z-index:89;background:rgba(23,19,28,.45);display:none;place-items:center;padding:16px}
#book.on{display:grid}
.bk{background:var(--card);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.3);width:min(600px,100%);max-height:92vh;overflow:auto;animation:pop .25s}
.bk .bh{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
.bk .bh h3{font-family:var(--serif);font-size:24px;margin:4px 0 4px}
.bk .bh p{margin:0;color:var(--muted)}
.bk .bh .x{background:var(--line2);color:var(--ink)}
.bk .bb2{padding:16px 22px 20px}
.bk .lbl2{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin:14px 0 8px}
.bk .lbl2:first-child{margin-top:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{border:1px solid var(--line);border-radius:12px;padding:8px 0;background:#fff;font-size:12px;line-height:1.2}
.days button b{display:block;font-size:17px}
.days button.on,.slots button.on,.chips .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slots button{height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;font-size:13px}
.slots button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.bk textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical}
.bk .who{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.bk .ft2{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.bk .ft2 small{color:var(--muted)}
.bk .okbig{text-align:center;padding:26px 22px}
.bk .okbig .ic{font-size:40px}
.coming{border:1px solid #cfdbee;background:#eef3fb;border-radius:16px;padding:12px 14px;margin-bottom:6px}
.coming b{display:block;font-size:14px}
/* ---------- YOUR DESK in the room ---------- */
.mydesk{width:340px;height:250px;cursor:pointer}
.mydesk svg{width:100%;height:100%;overflow:visible;transition:filter .25s}
.mydesk:hover svg,.mydesk.sit svg{filter:drop-shadow(0 0 14px rgba(255,196,90,.9))}
.mydesk .steam path{animation:steam 2.6s ease-in-out infinite;opacity:.0}
.mydesk .steam path:nth-child(2){animation-delay:1.3s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
.mydesk .scrglow{animation:scr 3s ease-in-out infinite}
@keyframes scr{50%{opacity:.75}}
.stage{transition:transform .6s cubic-bezier(.5,0,.3,1)}
#roomWrap.zoom .stage{transform:scale(2.6)}
/* ---------- the workstation as a real desk: two monitors + the fixings ---------- */
.wsbody{grid-template-columns:minmax(0,1fr) 360px!important}
.bench{grid-column:1/2!important}
.wsbody .cory{grid-column:2!important;grid-row:1/3!important}
.deskarea{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-height:0;position:relative}
.deskarea:before{content:"";position:absolute;left:-40px;top:-30px;width:520px;height:420px;background:radial-gradient(ellipse at 20% 10%,rgba(255,210,130,.20),transparent 65%);pointer-events:none}
.monitors{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.4fr) minmax(0,.6fr);gap:16px;perspective:1600px;align-items:stretch;padding:0 8px}
.mon{display:flex;flex-direction:column;min-height:0}
.mon.side{transform:rotateY(10deg);transform-origin:right center}
.mon .bezel{flex:1;min-height:0;background:#0e0c0b;border-radius:14px;padding:10px 10px 16px;box-shadow:0 16px 40px rgba(0,0,0,.45),inset 0 0 0 1px #2e2924;position:relative;display:flex}
.mon .bezel:after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#3ddc84;opacity:.8}
.mon .bezel>*{flex:1;min-width:0;border-radius:8px}
.mon .bezel .term,.mon .bezel .notebook{box-shadow:none;border:0}
.mon .neck{width:34px;height:26px;margin:0 auto;background:linear-gradient(90deg,#2b2622,#3a332c,#2b2622)}
.mon .base{width:150px;height:10px;margin:0 auto;border-radius:6px 6px 2px 2px;background:#2b2622;box-shadow:0 4px 8px rgba(0,0,0,.4)}
.desksurface{flex:none;height:104px;margin-top:-4px;border-radius:12px;background:linear-gradient(#b98557,#9a6a4a 70%,#7c5338);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 10px 24px rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px 10px;gap:10px}
.desksurface svg{flex:none;overflow:visible}
.desksurface .kb{flex:1;max-width:420px;height:58px}
.desksurface .steam path{animation:steam 2.6s ease-in-out infinite}
.desksurface .steam path:nth-child(2){animation-delay:1.3s}
.desksurface button{background:none;border:0;padding:0}
.lampcone{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;background:radial-gradient(ellipse 420px 260px at 6% 100%,rgba(255,214,140,.22),transparent 70%)}
@media (max-width:1100px){.mon.side{display:none}.monitors{grid-template-columns:1fr}.wsbody{grid-template-columns:minmax(0,1fr) 320px!important}}
@media (max-width:760px){.wsbody{grid-template-columns:1fr!important}.bench{grid-column:1!important}.deskarea{grid-row:auto;min-height:72vh}.desksurface .opt{display:none}}
/* screens with richer content: pricing (Admissions) and the calendar (Schedule) */
.pricegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--FW)*.008);margin:calc(var(--FW)*.008) 0 calc(var(--FW)*.012)}
.pricegrid div{border:2px solid var(--line);border-radius:10px;padding:calc(var(--FW)*.008);text-align:left}
.pricegrid div.hot{border-color:var(--red);background:#fff6f5}
.pricegrid small{display:block;font-size:calc(var(--FW)*.012);font-weight:800;letter-spacing:.1em;color:var(--muted)}
.pricegrid b{display:block;font-size:calc(var(--FW)*.03);letter-spacing:-.02em;line-height:1.05;margin-top:2px}
.pricegrid em{display:block;font-style:normal;font-size:calc(var(--FW)*.011);color:var(--muted)}
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:calc(var(--FW)*.006) 0}
.wkstrip span{text-align:center;border-radius:8px;padding:3px 0;font-size:calc(var(--FW)*.011);font-weight:700;color:var(--muted);background:var(--line2)}
.wkstrip span b{display:block;font-size:calc(var(--FW)*.02);color:var(--ink)}
.wkstrip span.ev{background:#fff3c4}.wkstrip span.ev:after{content:"●";color:var(--red);font-size:9px}
.wkstrip span.today{background:var(--ink);color:#fff}.wkstrip span.today b{color:#fff}
.evrow{display:flex;align-items:center;gap:calc(var(--FW)*.01);padding:calc(var(--FW)*.005) 0;border-top:1px solid var(--line2)}
.evrow .dt{width:calc(var(--FW)*.05);text-align:center;font-size:calc(var(--FW)*.011);font-weight:800;color:var(--red);line-height:1.1}
.evrow .dt b{display:block;font-size:calc(var(--FW)*.024);color:var(--ink)}
.evrow .tx{flex:1;min-width:0;font-size:calc(var(--FW)*.016);font-weight:700;line-height:1.2}
.evrow .tx small{display:block;font-weight:500;color:var(--muted);font-size:calc(var(--FW)*.012)}
.screen .evrow .btn{height:calc(var(--FW)*.04)!important;font-size:calc(var(--FW)*.016)!important;padding:0 calc(var(--FW)*.016)!important}
.btn.going{background:#e3f2e7;border-color:#bfe0c9;color:#1b6b3a}
/* events in cards and pages */
.evlist .ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.evlist .ev:last-child{border-bottom:0}
.evlist .dt{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:10px;padding:4px 0;font-size:10.5px;font-weight:800;color:var(--red);background:#fff}
.evlist .dt b{display:block;font-size:17px;color:var(--ink)}
.evlist .tx{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.3}
.evlist .tx small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.prow.wide{grid-template-columns:1fr}.prow.wide>div:last-child{display:grid!important;grid-template-columns:1fr 1fr}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:20px}
.calday{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.calday h5{margin:0;font-size:11px;letter-spacing:.1em;color:var(--muted)}
.calday h5 b{display:block;font-size:20px;color:var(--ink);letter-spacing:0}
.calday.today{border-color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.calev{border-radius:10px;padding:7px 8px;background:#fff3c4;font-size:12px;font-weight:700;line-height:1.3}
.calev small{display:block;font-weight:500;color:var(--muted)}
.calev .btn{margin-top:6px;width:100%}
.calev.plan{background:var(--teal-l)}
.svc{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.svc:last-child{border-bottom:0}
.svc .tx{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.svc .tx small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pricecards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}
.pricecards .pc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.pricecards .pc.hot{border:2px solid var(--red)}
.pricecards .pc .n{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.pricecards .pc .pr{font-size:30px;font-weight:800;letter-spacing:-.02em}
.pricecards .pc .u{color:var(--muted);font-size:13px}
.pricecards .pc p{color:#3a332c;font-size:13.5px;line-height:1.45;margin:4px 0 10px;flex:1}
/* the auditorium */
.seatrow{height:48px;border-radius:10px 10px 2px 2px;background:repeating-linear-gradient(90deg,#8e2a2a 0 34px,#6a1d1d 34px 38px);box-shadow:0 -2px 0 #b23a3a inset}
.seatrow i{position:absolute;bottom:30px;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.seatrow i:after{content:"";position:absolute;left:-6px;top:22px;width:34px;height:16px;border-radius:12px 12px 0 0;background:inherit;filter:brightness(.85)}
.stagep{background:linear-gradient(#6e4a32,#4d3322);border-radius:6px 6px 0 0;box-shadow:0 -4px 0 #8a5e40 inset}
@media (max-width:900px){.pricecards{grid-template-columns:1fr 1fr}.calgrid{grid-template-columns:repeat(2,1fr)}}
/* ---------- MEETING ROOMS: a hallway of doors ---------- */
.mdoor{position:absolute;bottom:0;width:26%;height:66%;background:var(--doorC);border-radius:8px 8px 0 0;cursor:pointer;box-shadow:inset 0 0 0 6px rgba(0,0,0,.18);transition:filter .2s}
.mdoor:hover{filter:brightness(1.12)}
.mdoor .glass{position:absolute;left:14%;right:14%;top:10%;height:30%;background:#dfe9ee;border-radius:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;padding:4px;box-shadow:inset 0 0 0 4px rgba(0,0,0,.15)}
.mdoor .glass i{width:30%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;font:800 14px var(--sans);color:#fff;display:grid;place-items:center;font-style:normal}
.mdoor.live .glass{background:#fff6d6;box-shadow:inset 0 0 0 4px rgba(0,0,0,.15),0 0 30px rgba(255,214,120,.8)}
.mdoor.friends{box-shadow:inset 0 0 0 6px rgba(0,0,0,.18),0 0 0 6px #14b8a6,0 0 34px rgba(20,184,166,.7)}
.mdoor .plate{position:absolute;left:8%;right:8%;top:46%;background:#fffdf6;border-radius:6px;padding:6px 8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mdoor .plate b{display:block;font:800 18px var(--sans);line-height:1.15;color:var(--ink)}
.mdoor .plate small{display:block;font:700 13px var(--sans);color:var(--muted);margin-top:2px}
.mdoor .plate .on{color:#1f8a4c}.mdoor .plate .bk{color:#b8860b}
.mdoor .knob{position:absolute;right:10%;top:62%;width:16px;height:16px;border-radius:50%;background:#ffd36e}
.mdoor .num{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font:800 22px var(--mono);color:var(--ink);background:#fffdf6;border-radius:6px;padding:0 10px}
.roomrow2{display:flex;align-items:center;gap:calc(var(--FW)*.008);padding:calc(var(--FW)*.006) 0;border-top:1px solid var(--line2)}
.roomrow2 .tx{flex:1;min-width:0;font-size:calc(var(--FW)*.016);font-weight:700;line-height:1.2}
.roomrow2 .tx small{display:block;font-weight:500;color:var(--muted);font-size:calc(var(--FW)*.012)}
.roomrow2 .avs{display:flex}.roomrow2 .avs i{width:calc(var(--FW)*.024);height:calc(var(--FW)*.024);border-radius:50%;margin-left:-6px;border:2px solid #fff;font:800 calc(var(--FW)*.009) var(--sans);color:#fff;display:grid;place-items:center;font-style:normal}
.dotlive{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1f8a4c;margin-right:6px;box-shadow:0 0 0 3px rgba(31,138,76,.2)}
/* room sheets (new room / book a session / room peek) */
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:0}
.mrow .tx{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.3}
.mrow .tx small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.avstack{display:flex}.avstack .av{margin-left:-7px;box-shadow:0 0 0 2px #fff}.avstack .av:first-child{margin-left:0}
.inp{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit}
/* ---------- COMMUNITY BOARD on the Quad ---------- */
#cboard{position:fixed;inset:0;z-index:87;background:rgba(23,19,28,.45);display:none;place-items:center;padding:16px}
#cboard.on{display:grid}
.cork{width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:22px;background:#c69c6d;background-image:radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.6px);background-size:9px 9px;box-shadow:0 30px 70px rgba(0,0,0,.35),inset 0 0 0 12px #8a5e40;padding:28px 30px 26px;animation:pop .25s;position:relative}
.cork .x{background:#fffdf6;color:var(--ink)}
.cork h3{font-family:var(--serif);font-size:30px;margin:0 0 2px;color:#2b1d12}
.cork .sub{color:#4a3424;margin:0 0 14px}
.cork .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cork .tabs button{height:34px;border-radius:17px;padding:0 14px;background:rgba(255,253,246,.7);font-weight:700;font-size:13px}
.cork .tabs button.on{background:#2b1d12;color:#fff}
.cork .tabs .sp{flex:1}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.note{position:relative;background:#fffdf6;border-radius:3px;padding:14px 14px 12px;box-shadow:0 6px 14px rgba(0,0,0,.25);transform:rotate(var(--r));font-size:13.5px;line-height:1.4;cursor:pointer;transition:transform .15s}
.note:hover{transform:rotate(0) scale(1.03);z-index:2}
.note:before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--pin,#e31b23);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.note.q{background:#fff6c9}.note.ann{background:#e6f3f1}
.note .ty{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.note b{display:block;font-size:14.5px;margin:4px 0}
.note .ft{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.note .ft .av{width:22px;height:22px;font-size:9px}
.note .ft span:last-child{margin-left:auto;font-weight:700;color:var(--ink)}
.composer{background:#fffdf6;border-radius:14px;padding:14px;margin-bottom:18px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.composer textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
/* live broadcast on the Events Hall stage */
.screen .live{position:absolute;inset:0;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#3b2a4a,#120c18);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:4% 5%}
.screen .live .chip{position:absolute;top:5%;left:5%;background:#e31b23;border-radius:8px;padding:4px 10px;font:800 calc(var(--FW)*.016) var(--sans);letter-spacing:.1em;animation:pulseR 1.6s infinite}
@keyframes pulseR{50%{box-shadow:0 0 0 8px rgba(227,27,35,.25)}}
.screen .live .host{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:22%;aspect-ratio:1;border-radius:50%;background:#b07a00;border:6px solid #fff;display:grid;place-items:center;font:800 calc(var(--FW)*.04) var(--sans)}
.screen .live h3{color:#fff;margin:0 0 4px}.screen .live p{color:#cfc4d8;margin:0 0 10px}
.liveplay{position:fixed;right:18px;bottom:52px;z-index:61;display:flex;gap:8px;align-items:center;background:#1f1b16;color:#fff;border-radius:18px;padding:6px 6px 6px 14px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow)}
.liveplay button{height:30px;border-radius:15px;padding:0 12px;background:#fff;color:var(--ink);font-weight:800;font-size:12px}
.liveplay button.on{background:#e31b23;color:#fff}
#map .onair{animation:pulseR 1.6s infinite}
#map .beam{transform-box:fill-box;transform-origin:50% 100%;animation:sweep 4s ease-in-out infinite alternate;opacity:.35}
@keyframes sweep{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.urgent{border:2px solid var(--red);background:#fff5f4;border-radius:16px;padding:12px 14px;margin-bottom:6px}
.urgent b{display:block}
@media (max-width:760px){.notes{grid-template-columns:1fr 1fr}}
/* games grid */
.gr .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gr .game{overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.gr .game:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.gr .game .art{height:130px;background:#0b0712;position:relative;display:grid;place-items:center;overflow:hidden}
.gr .game .art canvas{width:100%;height:100%;display:block}
.gr .game .tagnew{position:absolute;top:10px;left:10px;background:var(--neon);color:#fff;font:800 10px var(--sans);letter-spacing:.12em;border-radius:8px;padding:3px 8px}
.gr .game .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gr .game b{font-size:16px}
.gr .game p{margin:0;color:var(--muted);font-size:13px;line-height:1.4;flex:1}
.gr .game .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--line2);padding-top:8px;margin-top:4px}
.gr .game .meta b{font:700 12px var(--mono);color:var(--ink)}
.gr .game .btn{width:100%;margin-top:8px}
/* leaderboard */
.gr .lb{padding:18px 20px}
.gr .tabs{display:flex;gap:6px;flex-wrap:wrap}
.gr .tabs button{height:32px;border-radius:16px;padding:0 13px;font-weight:700;font-size:12.5px;border:1px solid var(--line);background:#fff}
.gr .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gr .lbtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gr .seg{display:inline-flex;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gr .seg button{height:30px;padding:0 12px;font-size:12px;font-weight:700}
.gr .seg button.on{background:var(--ink);color:#fff}
.gr .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin:6px 0 16px}
.gr .pod{border-radius:16px;padding:14px 10px 12px;text-align:center;background:var(--paper);border:1px solid var(--line)}
.gr .pod .av{width:46px;height:46px;font-size:15px;margin:0 auto 6px}
.gr .pod .rk{font:800 12px var(--mono);color:var(--muted)}
.gr .pod b{display:block;font-size:14px}
.gr .pod .sc{font:800 18px var(--mono)}
.gr .pod.p1{background:linear-gradient(#fff6d6,#fff);border-color:#f1dc9a;padding-top:22px}
.gr .pod.p1 .rk{color:#b8860b}
.gr .av,.arcd .av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:800 11px var(--sans);color:#fff;flex:none}
.gr .lbrow{display:grid;grid-template-columns:36px 30px minmax(0,1fr) auto 90px;gap:10px;align-items:center;padding:8px 6px;border-radius:10px}
.gr .lbrow:nth-child(even){background:#faf7f2}
.gr .lbrow .r{font:800 13px var(--mono);color:var(--muted);text-align:center}
.gr .lbrow .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .lbrow .n small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.gr .lv{font-size:10.5px;font-weight:800;background:#fff3c4;color:#6b5200;border-radius:7px;padding:2px 7px;white-space:nowrap}
.gr .lbrow .s{font:800 14px var(--mono);text-align:right}
.gr .lbrow.you{background:#fff1f1!important;outline:2px solid #f6c9cb}
.gr .lbgap{text-align:center;color:var(--faint);font-size:12px;padding:4px}
/* feed */
.feed{display:flex;flex-direction:column;gap:10px}
.gr .fitem{display:flex;align-items:center;gap:12px;padding:12px 16px}
.gr .fitem .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.gr .fitem .tx small{display:block;color:var(--muted);font-size:12px}
/* rail */
.prail{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
.rbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.rbox h6{display:flex;justify-content:space-between}
.num{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 12px var(--sans);background:var(--teal);color:#fff}
.meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.pp{display:flex;align-items:center;gap:10px;padding:6px 0}
.pp .nm{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .nm small{display:block;font-weight:500;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;border-radius:17px;border:1px solid var(--line);padding:0 12px 0 4px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;background:#fff}
.chip .av{width:26px;height:26px;font-size:10px;box-shadow:0 0 0 2px var(--gold)}
/* cabinet modal */
#cab{position:fixed;inset:0;z-index:50;background:rgba(10,6,16,.72);display:none;place-items:center;padding:16px}
#cab.on{display:grid}
.cab{background:#14091f;border-radius:24px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 2px #3a2752;color:#fff;width:min(560px,100%);position:relative}
.cabh{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cabh .ttl{font:400 13px var(--pix);color:#ffd6ee;text-shadow:0 0 10px var(--neon);margin-right:auto}
.cpill{background:#2b1a3d;border-radius:12px;padding:5px 10px;font:700 12px var(--mono);color:#fff;white-space:nowrap}
.cpill.low{background:var(--red);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.6}}
.cabx{width:32px;height:32px;border-radius:50%;background:#2b1a3d;color:#fff;font-size:15px}
.cabscreen{position:relative;border-radius:14px;overflow:hidden;background:#0b0712;box-shadow:inset 0 0 0 3px #2b1a3d}
.cabscreen canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.cabf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:#b9a8cf;gap:10px;flex-wrap:wrap}
.cpad{display:none;gap:8px;justify-content:center;margin-top:10px}
.cpad button{width:54px;height:54px;border-radius:16px;background:#2b1a3d;color:#fff;font-size:20px}
.cover{position:absolute;inset:0;background:rgba(20,9,31,.92);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:6px}
.cover.on{display:flex}
.cover h3{font:400 15px var(--pix);color:#ffd23d;margin:0 0 8px;line-height:1.6}
.cover .sc{font:800 40px var(--mono)}
.over p{color:#cfc0e4;margin:4px 0 12px;font-size:13.5px}
.cover .btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cover .btn{border:0}
.cover .btn.ghost{background:#2b1a3d;color:#fff}
.gtoast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f1b16;color:#fff;border-radius:18px;padding:10px 16px;font-weight:600;z-index:60;box-shadow:var(--shadow);display:none}
.gproto{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(31,27,22,.8);color:#fff;font-size:11.5px;padding:5px 12px;border-radius:12px;z-index:40;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
.gr .grhero{display:grid;grid-template-columns:230px 1fr;overflow:hidden}
.gr .grhero .sum{border-right:1px solid var(--line);padding:24px 20px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px;background:linear-gradient(#fbf8ff,#fff)}
.gr .grhero .big{font:800 34px var(--mono);letter-spacing:-.02em}.gr .grhero small{color:var(--muted)}
.gr .pbar i{background:#6b2fa0}
.gr .grhero .nx{padding:24px 26px;display:grid;grid-template-columns:1fr 160px;gap:18px;align-items:center}
.gr .grhero h2{font-size:24px;margin:8px 0 6px}.gr .grhero p{color:var(--muted);margin:0 0 16px;line-height:1.45}
.gr .acc-p{border-top:4px solid #6b2fa0}
.gr .pts.new{background:#ffe6f2;color:#c2185b}
.gr .grprow{display:block}
.gr .siderow{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.gr .sec2{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px;gap:12px;flex-wrap:wrap}
.gr .sec2 h2{font-size:20px;margin:0}.gr .sec2 small{color:var(--muted)}
.gr .feed{margin-top:0}
.btn.lg{height:46px;padding:0 24px;font-size:15px;border-radius:23px}.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:900px){.gr .grprow{display:block}
.gr .siderow{grid-template-columns:1fr}.gr .grhero{grid-template-columns:1fr}.gr .grhero .nx{grid-template-columns:1fr}.gr .grhero .nx canvas{display:none}}
/* ---------- the Game Room interior: arcade aisle ---------- */
.arcab{width:130px;height:250px;cursor:pointer;transition:filter .2s}
.arcab:hover{filter:drop-shadow(0 0 16px rgba(255,79,163,.9))}
.arcab .body{position:absolute;inset:0;background:linear-gradient(#3a2752,#2b1a3d);border-radius:10px 10px 4px 4px;box-shadow:inset 0 0 0 3px #4a2f6b}
.arcab .mq{position:absolute;left:6px;right:6px;top:6px;height:26px;background:#14091f;border:2px solid var(--neon);border-radius:6px;color:#ffd6ee;font:400 7.5px var(--pix);display:grid;place-items:center;text-align:center;line-height:1.3;text-shadow:0 0 6px var(--neon);animation:neonb 2.4s linear infinite}
@keyframes neonb{50%{border-color:var(--cyan)}}
.arcab canvas{position:absolute;left:10px;right:10px;top:38px;width:110px;height:84px;border-radius:5px}
.arcab .ctl{position:absolute;left:4px;right:4px;top:128px;height:30px;background:#4a3466;border-radius:4px}
.arcab .ctl i{position:absolute;top:8px;width:12px;height:12px;border-radius:50%}
.arcab .best{position:absolute;left:8px;right:8px;top:166px;color:#ffd23d;font:800 10px var(--mono);text-align:center}
.arcab .play{position:absolute;left:24px;right:24px;top:186px;height:22px;border-radius:11px;background:var(--red);color:#fff;font:800 10px var(--sans);display:grid;place-items:center}
.arcab .new{position:absolute;right:-6px;top:-8px;background:var(--neon);color:#fff;font:800 9px var(--sans);border-radius:6px;padding:2px 6px}
.champ{position:absolute;background:#14091f;border:6px solid #4a2f6b;border-radius:14px;color:#fff;padding:20px 24px;box-shadow:0 0 30px rgba(255,79,163,.25)}
.champ h4{margin:0 0 12px;font:400 22px var(--pix);color:#ffd23d;text-shadow:0 0 10px rgba(255,210,61,.6)}
.champ .r{display:flex;align-items:center;gap:12px;font-size:24px;padding:6px 0;border-bottom:2px dashed #3a2752}
.champ .r b{font-family:var(--mono);color:#7dff6b;margin-left:auto}
.champ .r i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--sans);font-style:normal}
.arcd .meter{border-radius:16px;background:linear-gradient(135deg,#2b1a3d,#4a2f6b);color:#fff;padding:14px}
.arcd .meter b{font:800 26px var(--mono)}
.arcd .meter .pbar{background:rgba(255,255,255,.15)}.arcd .meter .pbar i{background:#ff4fa3}
.arcd .grow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.arcd .grow canvas{width:54px;height:36px;border-radius:6px;flex:none}
.arcd .grow .tx{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.arcd .grow .tx small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.arcd .lbm{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.arcd .lbm .rk{width:22px;font:800 12px var(--mono);color:var(--muted)}
.arcd .lbm b{margin-left:auto;font:800 13px var(--mono)}
.arcd .lbm.you{background:#fff1f1;border-radius:8px;padding:5px 6px}
.arcd .gtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.arcd .gtabs button{height:26px;border-radius:13px;padding:0 9px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#fff}
.arcd .gtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- WEATHER + TIME OF DAY (the user's local) ---------- */
#wxFx{position:fixed;inset:0;pointer-events:none;z-index:1;transition:background 1.5s}
#wxFx.night{background:radial-gradient(ellipse at 50% 40%,rgba(20,30,70,.38),rgba(8,12,40,.62))}
#wxFx.dusk{background:linear-gradient(rgba(255,120,60,.18),rgba(80,40,110,.28))}
#wxFx.dawn{background:linear-gradient(rgba(255,190,140,.22),rgba(255,230,200,.08))}
#wxFx.overcast{filter:none;background-color:rgba(120,130,140,.18)}
#wxCv{position:fixed;inset:0;pointer-events:none;z-index:2}
#wxFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.wxchip{display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:16px;padding:4px 8px}
.wxchip:hover{background:var(--line2)}
#roomWrap .wxtint{position:absolute;inset:0;pointer-events:none;z-index:4;transition:background 1.2s}
#roomWrap .wxtint.night{background:radial-gradient(ellipse at 50% 15%,rgba(255,230,170,.12),rgba(15,20,55,.38) 70%)}
#roomWrap .wxtint.dusk{background:linear-gradient(90deg,rgba(80,40,110,.12),rgba(255,140,80,.16))}
#roomWrap .wxtint.dawn{background:linear-gradient(90deg,rgba(255,220,180,.06),rgba(255,180,120,.14))}
#roomWrap .wxtint.gray{background:rgba(90,100,115,.12)}
#wxPop{position:fixed;top:72px;right:180px;z-index:80;width:320px;background:var(--card);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.22);padding:16px;display:none}
#wxPop.on{display:block}
#wxPop h4{margin:0 0 2px;font-size:16px}
#wxPop .meta{margin-bottom:10px}
#wxPop .lbl2{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin:12px 0 6px}
#wxPop .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* the window on the right wall */
.rwin{position:absolute;left:4%;right:4%;top:5%;height:70%;border-radius:10px;background:#e9e2d4;padding:12px;box-shadow:0 10px 24px rgba(0,0,0,.18),inset 0 0 0 3px rgba(0,0,0,.08)}
.rwin.high{top:3%;height:28%}
.rwin .sky{position:relative;width:100%;height:100%;border-radius:4px;overflow:hidden;background:var(--sky)}
.rwin .mull{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent calc(50% - 4px),#e9e2d4 calc(50% - 4px),#e9e2d4 calc(50% + 4px),transparent calc(50% + 4px)),linear-gradient(transparent calc(50% - 4px),#e9e2d4 calc(50% - 4px),#e9e2d4 calc(50% + 4px),transparent calc(50% + 4px))}
.rwin .sill{position:absolute;left:-14px;right:-14px;bottom:-14px;height:14px;background:#d6ccb9;border-radius:3px}
.rwin .orb{position:absolute;border-radius:50%}
.rwin .sun{width:22%;aspect-ratio:1;background:radial-gradient(#fff6c8,#ffd23d 60%,#ffb02e);box-shadow:0 0 50px 20px rgba(255,210,61,.55)}
.rwin .moon{width:16%;aspect-ratio:1;background:radial-gradient(circle at 35% 35%,#fffbe8,#e8e2c8 70%);box-shadow:0 0 40px 10px rgba(255,250,220,.35)}
.rwin .moon:after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--moonshade,transparent)}
.rwin .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.rwin .cloud{position:absolute;height:18%;border-radius:40px;background:var(--cloud,#fff);opacity:.95;animation:drift 40s linear infinite}
.rwin .cloud:before,.rwin .cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}
.rwin .cloud:before{width:50%;height:160%;left:15%;top:-70%}.rwin .cloud:after{width:40%;height:130%;left:48%;top:-45%}
@keyframes drift{from{transform:translateX(-30%)}to{transform:translateX(130%)}}
.rwin .hills{position:absolute;left:-5%;right:-5%;bottom:0;height:24%;background:var(--hill);border-radius:50% 50% 0 0}
.rwin .city{position:absolute;left:0;right:0;bottom:12%;height:22%;display:flex;align-items:flex-end;gap:3%;padding:0 6%}
.rwin .city i{flex:1;background:var(--bldg);border-radius:2px 2px 0 0;position:relative;background-image:var(--lit)}
.rwin .rain i{position:absolute;top:-20%;width:2px;height:16%;background:linear-gradient(transparent,rgba(220,235,255,.85));animation:fall .7s linear infinite}
.rwin .snow i{position:absolute;top:-6%;width:7px;height:7px;border-radius:50%;background:#fff;animation:snow 5s linear infinite}
@keyframes fall{to{transform:translate(-14px,700%)}}
@keyframes snow{to{transform:translate(20px,1600%)}}
.rwin .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash 7s infinite}
@keyframes flash{0%,92%,96%,100%{opacity:0}93%,95%{opacity:.85}}
.rwin .fog{position:absolute;inset:0;background:linear-gradient(rgba(230,230,235,.2),rgba(230,230,235,.75))}
.rwin .drops{position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.5) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.45) 0 2px,transparent 3px),radial-gradient(circle at 40% 80%,rgba(255,255,255,.4) 0 1.5px,transparent 2.5px);background-size:60px 60px,80px 80px,50px 50px}
.rwin .view{position:absolute;left:0;right:0;bottom:0;height:62%}
.rwin .view svg{position:absolute;bottom:4%;overflow:visible}
.rwin .tag small{display:block;font:700 .55em var(--sans);color:var(--muted);letter-spacing:.02em}
.rwin .tag{position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);background:#fffdf6;border-radius:12px;padding:8px 18px;font:800 28px var(--sans);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);color:var(--ink)}
.rwin.high .tag{bottom:auto;top:50%;left:auto;right:-8px;transform:translate(100%,-50%);font-size:13px}
/* ---------- CHOW HALL ---------- */
.chalk{position:absolute;left:8%;right:8%;top:8%;height:66%;background:#1f2a24;border:10px solid #8a5e40;border-radius:8px;color:#f4f1e8;padding:22px 26px;font-family:'Comic Sans MS','Segoe Print',var(--sans);box-shadow:0 10px 24px rgba(0,0,0,.25);cursor:pointer}
.chalk h4{margin:0 0 10px;font-size:34px;letter-spacing:.06em;text-align:center}
.chalk .it{display:flex;align-items:center;gap:12px;font-size:28px;padding:6px 0;border-bottom:2px dashed rgba(255,255,255,.18)}
.chalk .it span{font-size:38px}
.chalk .ft{text-align:center;font-size:20px;opacity:.8;margin-top:10px}
.cravegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--FW)*.008);margin:calc(var(--FW)*.008) 0}
.cravegrid button{border:2px solid var(--line);border-radius:12px;padding:calc(var(--FW)*.006) 0;background:#fff;font-size:calc(var(--FW)*.012);font-weight:700;line-height:1.2}
.cravegrid button b{display:block;font-size:calc(var(--FW)*.03)}
.cravegrid button:hover,.cravegrid button.on{border-color:var(--red);background:#fff5f4}
.counter{width:380px;height:210px;cursor:pointer;transition:filter .2s}
.counter:hover{filter:drop-shadow(0 0 14px rgba(255,170,60,.9))}
.counter .glass{position:absolute;left:10px;right:10px;top:0;height:92px;background:linear-gradient(rgba(220,240,250,.55),rgba(200,225,240,.35));border:3px solid #cfd8df;border-radius:10px 10px 0 0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;font-size:28px;padding:6px}
.counter .base{position:absolute;left:0;right:0;top:92px;height:96px;background:linear-gradient(#c0392b,#8e2a1f);border-radius:4px;box-shadow:inset 0 6px 0 rgba(255,255,255,.18)}
.counter .base:before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:#efe6d6;border-radius:4px}
.counter .sign{position:absolute;left:50%;top:132px;transform:translateX(-50%);background:#fffdf6;border-radius:12px;padding:6px 14px;font:800 15px var(--sans);white-space:nowrap;color:var(--ink)}
.counter .tray{position:absolute;right:16px;top:70px;width:70px;height:12px;background:#9aa6b0;border-radius:3px}
#order{position:fixed;inset:0;z-index:89;background:rgba(23,19,28,.45);display:none;place-items:center;padding:16px}
#order.on{display:grid}
.ord{background:var(--card);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.3);width:min(640px,100%);max-height:92vh;overflow:auto;animation:pop .25s}
.ord .oh{padding:22px 22px 14px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(135deg,#fff3e6,#fff)}
.ord .oh h3{font-family:var(--serif);font-size:26px;margin:4px 0}
.ord .oh p{margin:0;color:var(--muted)}
.ord .oh .x{background:var(--line2);color:var(--ink)}
.ord .ob{padding:16px 22px 20px}
.crave{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.crave button{border:1px solid var(--line);border-radius:14px;padding:10px 0;background:#fff;font-weight:700;font-size:13px}
.crave button b{display:block;font-size:30px;line-height:1.1}
.crave button.on{border-color:var(--red);background:#fff5f4;box-shadow:0 0 0 2px rgba(227,27,35,.2)}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.app{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
.app:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.app .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 15px var(--sans);flex:none}
.app .tx{flex:1;min-width:0;font-weight:800;font-size:14.5px}
.app .tx small{display:block;color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .go{font-weight:800;color:var(--muted)}
.ofoot{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5}
.applist .app{padding:9px 12px}.applist{display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.crave{grid-template-columns:repeat(4,1fr)}.apps{grid-template-columns:1fr}}
/* ---------- FOCUS (flat view of a wall board) ---------- */
#focus{position:fixed;inset:0;z-index:70;background:rgba(23,19,28,.5);display:none;place-items:center}
#focus.on{display:grid}
#focus .fcard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);width:min(460px,92vw);padding:22px;animation:pop .25s}
@keyframes pop{from{transform:scale(.94);opacity:0}}

/* ---------- POPOVER / CHAT / TOASTS ---------- */
#pop{position:fixed;z-index:80;width:300px;background:var(--card);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.22);padding:16px;display:none;animation:pop .2s}
#pop.on{display:block}
#pop .hd{display:flex;gap:12px;align-items:center}
#pop .hd .av{width:46px;height:46px;font-size:15px}
#pop b{font-size:16px}
#chat{position:fixed;right:24px;bottom:24px;width:340px;height:440px;background:var(--card);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);z-index:85;display:none;flex-direction:column;overflow:hidden}
#chat.on{display:flex}
#chat .ch{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
#chat .ch .tx{flex:1;min-width:0}
#chat .ch small{color:var(--muted);display:block;font-size:12px}
#chat .loc{font-size:12px;color:var(--muted);padding:6px 14px;background:var(--line2);display:flex;justify-content:space-between;align-items:center}
#chat .msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:8px 12px;border-radius:14px;line-height:1.4;font-size:13.5px}
.m.them{background:#f1ece4;align-self:flex-start;border-bottom-left-radius:4px}
.m.mine{background:var(--red);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.m.sys{align-self:center;background:none;color:var(--faint);font-size:12px;text-align:center}
.m .act{margin-top:8px}
#chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#chat input{flex:1;height:var(--ctl);border-radius:18px;border:1px solid var(--line);padding:0 14px;font:inherit}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:#1f1b16;color:#fff;border-radius:18px;padding:10px 16px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);pointer-events:auto;animation:pop .25s}
.t .btn{height:28px;font-size:12px;background:#fff;color:var(--ink);border:0}
.burst{position:fixed;z-index:95;font:800 15px var(--sans);color:var(--red);pointer-events:none;animation:burst 1.4s ease-out forwards}
@keyframes burst{to{transform:translateY(-36px);opacity:0}}

/* ---------- WHERE TO (palette) ---------- */
#wf{position:fixed;inset:0;z-index:88;background:rgba(23,19,28,.35);backdrop-filter:blur(3px);display:none;justify-content:center;align-items:flex-start;padding-top:12vh}
#wf.on{display:flex}
#wf .box{width:min(620px,94vw);background:var(--card);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.3);overflow:hidden}
#wf input{width:100%;height:58px;border:0;border-bottom:1px solid var(--line);padding:0 20px;font:500 18px var(--sans);background:transparent;outline:none}
#wf .res{max-height:52vh;overflow:auto;padding:8px}
#wf .g{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);padding:10px 12px 4px}
#wf .r{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:12px;text-align:left}
#wf .r.sel,#wf .r:hover{background:var(--line2)}
#wf .r .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
#wf .r .tx{flex:1;min-width:0}
#wf .r small{color:var(--muted);display:block}
#wf .r em{font-style:normal;font-weight:700;font-size:12px;color:var(--muted)}
#wf .ft{border-top:1px solid var(--line);padding:9px 16px;font-size:12px;color:var(--muted)}

/* ---------- PAGE (inside a building) ---------- */
#page{position:fixed;inset:0;z-index:50;background:#f6f3ee;overflow:auto;display:none;scrollbar-width:thin}
#page.on{display:block}
#page.clip{clip-path:inset(var(--ci));transition:clip-path .6s cubic-bezier(.3,.8,.2,1)}
.ph{background:#fff;border-bottom:1px solid var(--line);height:72px;display:flex;align-items:center;gap:16px;padding:0 24px}
