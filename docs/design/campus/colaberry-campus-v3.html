<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colaberry Campus v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf7f0; --card:#fffdf9; --ink:#1f1b16; --muted:#6b6258; --faint:#9a9086; --line:#e9e0d3; --line2:#f1eadf;
  --red:#e31b23; --red-d:#b3161c; --teal:#0f766e; --teal-l:#e6f3f1; --navy:#1f3a5f; --gold:#d4a017; --green:#1f8a4c;
  --grass:#dfe9cf; --shadow:0 10px 30px rgba(40,30,20,.12),0 2px 6px rgba(40,30,20,.06);
  --r:18px; --ctl:36px; --panelW:360px; --cardW:360px; --gap:12px;
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- MAP ---------- */
#map{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#map .bld{cursor:pointer}
#map .bld .body-g{transition:transform .25s}
#map .bld:hover .body-g,#map .bld.hl .body-g{transform:translateY(-3px)}
#map .lbl rect{fill:#fff;stroke:#e6dccb}
#map .lbl text{font:700 11px var(--sans);fill:var(--ink)}
#map .bld:hover .lbl rect,#map .bld.hl .lbl rect{fill:var(--ink);stroke:var(--ink)}
#map .bld:hover .lbl text,#map .bld.hl .lbl text{fill:#fff}
#map .bld.dim{opacity:.45}
#map .water{animation:shim 4s ease-in-out infinite}
@keyframes shim{50%{opacity:.6}}
#map .neon{animation:neon 2.4s linear infinite}
@keyframes neon{0%,100%{stroke:#ff4fa3}50%{stroke:#3de0ff}}
.ppl-chip rect{fill:#fff;stroke:#e6dccb}
.ppl-chip text{font:800 9px var(--sans);fill:var(--ink)}
#routeLine{fill:none;stroke:var(--red);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;animation:march .6s linear infinite}
@keyframes march{to{stroke-dashoffset:-9}}
.step-dot{fill:#c9b08a;animation:stepfade 1.6s forwards}
@keyframes stepfade{to{opacity:0}}
#dropPin .ring{fill:none;stroke:var(--red);stroke-width:2;animation:ringp 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ringp{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
#avatar .bob{animation:none}
#avatar.walking .bob{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2.5px)}}
.plan-pin circle{stroke:var(--teal);stroke-width:1.6}
.plan-pin text{font:800 7px var(--sans)}

/* ---------- TOP BAR ---------- */
.top{position:fixed;top:12px;left:12px;right:12px;height:52px;display:flex;align-items:center;gap:10px;z-index:30;pointer-events:none}
.top>*{pointer-events:auto}
.pill{height:52px;background:var(--card);border-radius:26px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 16px}
.brand{gap:12px}
.brand img,.brand .logo{height:26px}
.brand .sub{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);border-left:1px solid var(--line);padding-left:12px}
.search{flex:1;max-width:520px;margin:0 auto;color:var(--muted);justify-content:flex-start;font-size:15px}
.search .kbd{margin-left:auto}
.kbd{font:600 11px var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);background:#fff}
.stats{gap:14px;font-weight:700;font-size:13.5px}
.rung{background:#ffd84d;color:#3a2e00;border-radius:12px;padding:4px 10px;font-size:12px}
.sep{width:1px;height:22px;background:var(--line)}
.iconbtn{width:var(--ctl);height:var(--ctl);border-radius:50%;display:grid;place-items:center;position:relative;font-size:16px}
.iconbtn:hover{background:var(--line2)}
.badge-n{position:absolute;top:2px;right:0;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.me{width:38px;height:38px;border-radius:50%;background:#3a2f26;color:#fff;font:800 13px var(--sans);display:grid;place-items:center}
.proto-tag{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:52;background:rgba(31,27,22,.82);color:#fff;font-size:11.5px;padding:6px 12px;border-radius:14px;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

/* ---------- SIDE PANEL (always on) ---------- */
#panel{position:fixed;left:12px;top:76px;bottom:12px;width:var(--panelW);background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:auto;z-index:20;padding:22px 20px 20px;scrollbar-width:thin}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:800}
h1.greet{font-family:var(--serif);font-size:30px;line-height:1.08;margin:6px 0 6px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 14px;line-height:1.45}
.pulse{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:16px;line-height:1.35}
.pulse:hover{background:var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 3px rgba(31,138,76,.15)}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between}
.sec small{letter-spacing:0;text-transform:none;font-weight:600;color:var(--faint);font-size:12px}
.upnext{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.upnext .row{display:flex;gap:10px;align-items:flex-start}
.num{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 12px var(--sans);border:2px solid var(--teal);color:var(--teal);background:#fff}
.num.on{background:var(--teal);color:#fff}
.num.done{background:var(--green);border-color:var(--green);color:#fff}
.upnext b{display:block;font-size:14.5px;line-height:1.3}
.meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{height:var(--ctl);border-radius:18px;padding:0 16px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:#fff;max-width:100%}
.btn:hover{background:var(--line2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}.btn.teal:hover{background:#0b5f58}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn.block{width:100%}
.tourcard{margin-top:14px;border-radius:16px;padding:14px;background:linear-gradient(135deg,#fff5f2,#fff);border:1px solid #f3d5cc;display:flex;gap:12px;align-items:center}
.tourcard .tx{flex:1;min-width:0}
.tourcard b{display:block;font-size:14.5px}
.tourcard p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.4}
.tourcard.going{background:linear-gradient(135deg,#eef3fb,#fff);border-color:#cfdbee}
.tourcard.done{background:#fff;border-style:dashed}
.plan{border:1px solid var(--line);border-radius:16px;padding:6px 12px;background:#fff}
.plan .it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);width:100%;text-align:left;align-items:flex-start}
.plan .it:last-child{border-bottom:0}
.plan .it b{font-size:13.5px;line-height:1.3;display:block}
.plan .it.done b{text-decoration:line-through;color:var(--faint)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:2px 7px;background:var(--teal-l);color:var(--teal);margin-left:6px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;border-radius:17px;border:1px solid var(--line);padding:0 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;background:#fff}
.chip:hover{background:var(--line2)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font:800 10.5px var(--sans);color:#fff;flex:none}
.av.staff{box-shadow:0 0 0 2px var(--gold)}
.chip small{color:var(--muted);font-weight:500}
.here-rooms{display:flex;flex-direction:column;gap:6px}
.roomrow{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;text-align:left;width:100%}
.roomrow:hover{background:var(--line2)}
.roomrow code{font:500 11px var(--mono);color:var(--faint)}

/* ---------- ARRIVAL CARD (right) ---------- */
#card{position:fixed;right:12px;top:76px;bottom:12px;width:var(--cardW);background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:auto;z-index:21;transform:translateX(calc(100% + 30px));transition:transform .5s cubic-bezier(.2,.9,.2,1);scrollbar-width:thin}
#card.open{transform:none}
.hero{padding:20px 20px 18px;color:#fff;border-radius:22px 22px 0 0;position:relative}
.hero .kicker{color:rgba(255,255,255,.85)}
.hero h2{font-family:var(--serif);font-size:30px;margin:4px 0 2px;letter-spacing:-.01em}
.hero p{margin:0;opacity:.9}
.x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:16px;display:grid;place-items:center}
.x:hover{background:rgba(255,255,255,.36)}
.cbody{padding:16px 18px 18px}
.planbox{border:1px solid #cfe5e1;background:var(--teal-l);border-radius:16px;padding:14px}
.planbox .k{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--teal);display:flex;gap:8px;align-items:center}
.planbox b{display:block;font-size:15px;margin:6px 0 2px;line-height:1.3}
.whorow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.whorow:last-child{border-bottom:0}
.whorow .nm{flex:1;min-width:0}
.whorow .nm b{display:block;font-size:13.5px}
.whorow .nm small{color:var(--muted);font-size:12px}
.lv{font-size:10.5px;font-weight:800;background:#fff3c4;color:#6b5200;border-radius:7px;padding:1px 6px;margin-left:4px}
.stafftag{font-size:10px;font-weight:800;background:var(--gold);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px;letter-spacing:.05em}
.cfoot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tourblk{border:1px solid #f3d5cc;background:#fff8f6;border-radius:16px;padding:14px;margin-bottom:14px}
.tourblk .k{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--red)}
.tourblk .n{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:11px}
.tourblk h3{margin:8px 0 4px;font-size:17px}
.tourblk p{margin:0;color:var(--muted);line-height:1.45}
.tourblk .tip{margin-top:10px;border:1px dashed #e5c7bd;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#7a5146;background:#fff}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#e8d6cf}
.dots i.on{background:var(--red);width:16px;border-radius:4px}
.dots i.dn{background:#c98f80}
.tournav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.tournav .dots{order:-1;width:100%;margin-bottom:4px}

/* ---------- ROOM (CSS 3D) ---------- */
#roomWrap{position:fixed;top:76px;bottom:12px;left:calc(12px + var(--panelW) + 12px);right:12px;z-index:15;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:#2a221c;
  clip-path:circle(0% at var(--ox,50%) var(--oy,50%));transition:clip-path .7s cubic-bezier(.3,.8,.2,1),right .5s cubic-bezier(.2,.9,.2,1);pointer-events:none}
#roomWrap.on{clip-path:circle(150% at var(--ox,50%) var(--oy,50%));pointer-events:auto}
body.card-open #roomWrap{right:calc(12px + var(--cardW) + 12px)}
#mapDim{position:fixed;inset:0;background:rgba(30,26,20,.38);opacity:0;transition:opacity .5s;z-index:14;pointer-events:none}
body.in-room #mapDim{opacity:1;pointer-events:auto;cursor:pointer}
.stage{position:absolute;inset:0;perspective:var(--persp,1000px);perspective-origin:var(--po,68%) 40%;overflow:hidden}
.room{position:absolute;inset:0;transform-style:preserve-3d}
.room .face{position:absolute;backface-visibility:hidden}
.room .back{left:0;top:0;width:var(--FW);height:var(--FH);transform:translateZ(calc(var(--D) * -1))}
.room .left{left:0;top:0;width:var(--D);height:var(--FH);transform-origin:left center;transform:rotateY(90deg)}
.room .right{right:0;top:0;width:var(--D);height:var(--FH);transform-origin:right center;transform:rotateY(-90deg)}
.room .floor{left:0;bottom:0;width:var(--FW);height:var(--D);transform-origin:bottom center;transform:rotateX(90deg)}
.room .ceil{left:0;top:0;width:var(--FW);height:var(--D);transform-origin:top center;transform:rotateX(-90deg)}
.room .floor{background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 90px),var(--floor)}
.room .ceil{background:var(--ceil)}
.room .ceil i{position:absolute;width:150px;height:46px;border-radius:50%;background:#fff7d6;box-shadow:0 0 40px 10px rgba(255,247,214,.55)}
.room .back{background:var(--wall)}
.room .left,.room .right{background:var(--wallS)}
.room .wainscot{position:absolute;left:0;right:0;bottom:0;height:16%;background:rgba(0,0,0,.06);border-top:3px solid rgba(0,0,0,.06)}
/* back wall screen: the next step */
.screen{position:absolute;left:23%;right:23%;top:8%;height:58%;background:#17131c;border-radius:18px;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.screen .inner{width:100%;height:100%;border-radius:10px;background:#fff;display:flex;flex-direction:column;justify-content:center;padding:4% 5%;position:relative;overflow:hidden}
.screen .inner:before{content:"";position:absolute;left:0;top:0;right:0;height:7px;background:var(--bc)}
.screen .k{font-size:calc(var(--FW) * .017);font-weight:800;letter-spacing:.12em;color:var(--red);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pts{font:700 13px var(--mono);white-space:nowrap;color:#1b6b3a;background:#e5f4ea;border-radius:8px;padding:3px 8px;letter-spacing:0}
.screen h3{font-size:calc(var(--FW) * .031);line-height:1.12;margin:12px 0 10px;letter-spacing:-.01em}
.screen p{font-size:calc(var(--FW) * .018);color:var(--muted);margin:0 0 16px}
.screen .btnrow .btn{height:calc(var(--FW) * .052);font-size:calc(var(--FW) * .021);padding:0 calc(var(--FW) * .024);border-radius:999px}
.screen .pts{font-size:calc(var(--FW) * .02)}
.screen .stand{position:absolute;left:50%;bottom:-38px;width:12px;height:38px;background:#3a2f26;transform:translateX(-50%)}
/* wall boards */
.board{position:absolute;background:#fff;border-radius:16px;padding:22px 26px;box-shadow:0 10px 24px rgba(0,0,0,.14);border:6px solid #3a2f26;cursor:zoom-in;transition:filter .2s}
.board:hover{filter:brightness(1.04)}
.board h4{margin:0 0 8px;font-size:36px;display:flex;align-items:center;gap:10px}
.board .r{display:flex;justify-content:space-between;font-size:27px;padding:5px 0;border-bottom:2px solid var(--line2)}
.board .r b{font-family:var(--mono)}
.board .bar{height:12px;border-radius:6px;background:var(--line2);margin:6px 0 10px;overflow:hidden}
.board .bar i{display:block;height:100%;background:var(--red)}
.board p{font-size:28px;line-height:1.4;margin:0;color:var(--muted)}
.board .pin{position:absolute;top:-14px;left:50%;width:20px;height:20px;border-radius:50%;background:var(--red);transform:translateX(-50%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
/* door + directory on the right wall */
.door{position:absolute;bottom:0;width:26%;height:58%;background:var(--doorC);border-radius:8px 8px 0 0;cursor:pointer;box-shadow:inset 0 0 0 8px rgba(0,0,0,.15)}
.door .glow{position:absolute;inset:12px 12px 0;background:#fff6d6;opacity:0;transition:opacity .3s;border-radius:4px 4px 0 0}
.door:hover .glow,.door.open .glow{opacity:.9}
.door .knob{position:absolute;right:14%;top:52%;width:18px;height:18px;border-radius:50%;background:#ffd36e}
.gosign{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;cursor:pointer}
.gosign .btn{height:40px;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.gosign small{background:rgba(23,19,28,.78);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.directory{position:absolute;top:12%;width:44%;background:#26303a;color:#fff;border-radius:14px;padding:20px 24px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.directory h5{margin:0 0 10px;font-size:20px;letter-spacing:.14em;color:#9fc0d6}
.directory button{display:flex;justify-content:space-between;width:100%;font-size:24px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12);color:#fff;text-align:left}
.directory button:last-child{border-bottom:0}
.directory button:hover{color:#ffd36e}
/* people + furniture (billboards in 3D) */
.bb{position:absolute;left:0;top:0;transform-style:preserve-3d}
#furn,#figs{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
#furn>*,#figs>*{pointer-events:auto}
.desk{height:40px;background:linear-gradient(#9a6a4a 0 18%,#7a5038 18%);border-radius:4px}
.desk.bench{background:linear-gradient(#90a0a3 0 18%,#6c7a7d 18%)}
.rtable{width:150px;height:56px}
.rtable:before{content:"";position:absolute;left:0;right:0;top:0;height:30px;border-radius:50%;background:#f2e6d2;border:3px solid #9a7a5a}
.rtable:after{content:"";position:absolute;left:50%;top:28px;width:10px;height:28px;margin-left:-5px;background:#9a7a5a}
.fig{width:70px;height:130px;cursor:pointer}
.fig svg{width:100%;height:100%;overflow:visible}
.fig .nm{opacity:0;transition:opacity .15s}
.fig:hover .nm,.fig.you .nm,.fig.staff .nm{opacity:1}
.deskstaff{width:150px;height:46px;background:var(--gold);border-radius:6px;color:#fff;font:800 13px var(--sans);display:grid;place-items:center;letter-spacing:.08em}
.bubble{position:absolute;white-space:nowrap;background:#fff;border:2px solid var(--gold);border-radius:16px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
/* room HUD */
.hud{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;z-index:5}
.hud .h{height:var(--ctl);border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.hud .dark{background:rgba(23,19,28,.86);color:#fff}
.hud .light{background:#fff}
.hud .light:hover{background:var(--line2)}
.roomtag{position:absolute;top:14px;left:14px;z-index:5;background:rgba(23,19,28,.78);color:#fff;font-size:11px;font-weight:800;letter-spacing:.12em;border-radius:12px;padding:6px 10px}
.hint{position:absolute;top:14px;right:14px;z-index:5;background:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;max-width:280px;box-shadow:var(--shadow);line-height:1.4;transition:opacity .4s}
.goingdoor .room{transition:transform .5s ease-in;transform:scale(2.2);transform-origin:var(--dx,85%) 70%}

/* ---------- TWO DOORS: front door (the section page) and back door (your workstation) ---------- */
.door.front{background:linear-gradient(90deg,var(--doorC) 0 49%,rgba(0,0,0,.35) 49% 51%,var(--doorC) 51%);box-shadow:inset 0 0 0 8px rgba(0,0,0,.15),0 0 0 10px #efe6d6}
.door.front .knob{right:54%}
.bdoor{position:absolute;right:4%;bottom:0;width:16%;height:60%;background:linear-gradient(#4b5058,#30343a);border-radius:6px 6px 0 0;cursor:pointer;box-shadow:inset 0 0 0 6px #23262b;overflow:hidden}
.bdoor:before{content:"";position:absolute;left:0;right:0;top:0;height:8%;background:repeating-linear-gradient(135deg,#f2b632 0 16px,#23262b 16px 32px)}
.bdoor .win{position:absolute;left:22%;right:22%;top:17%;height:15%;background:#ffcf6b;border-radius:4px;box-shadow:0 0 34px 8px rgba(255,190,80,.6)}
.bdoor .bar{position:absolute;left:12%;right:12%;top:54%;height:5%;background:#9aa3ad;border-radius:3px}
.bdoor .glow{position:absolute;inset:0;background:#ffcf6b;opacity:0;transition:opacity .3s}
.bdoor:hover .glow,.bdoor.open .glow{opacity:.35}
.bdoor-lamp{position:absolute;right:5%;width:18%;bottom:62%;display:flex;justify-content:center}
.bdoor-lamp i{width:46%;height:26px;border-radius:6px;background:#2b2e33;border:3px solid #f2b632;box-shadow:0 0 22px rgba(242,182,50,.7);color:#f2b632;font:800 15px var(--mono);display:grid;place-items:center;letter-spacing:.12em;font-style:normal}
.dsign{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;width:220px}
.dsign .tag2{font:800 10.5px var(--sans);letter-spacing:.14em;border-radius:8px;padding:3px 9px;white-space:nowrap}
.dsign .btn{height:38px;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.22);max-width:220px}
.dsign .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dsign.d-front .tag2{background:#fff;color:var(--ink)}
.dsign.d-back .tag2{background:#2b2e33;color:#f2b632}
.btn.amber{background:#2b2e33;border-color:#2b2e33;color:#ffd27a}.btn.amber:hover{background:#1c1e22}
/* arrival card: two ways in */
.ways{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.way{border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;border:1px solid var(--line);background:#fff}
.way:hover{filter:brightness(.98)}
.way .wk{font-size:10.5px;font-weight:800;letter-spacing:.14em}
.way b{font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.way small{color:var(--muted);font-size:12px;line-height:1.35}
.way .go2{margin-top:auto;font-weight:800;font-size:12.5px}
.way.front .wk{color:var(--red)}.way.front .go2{color:var(--red)}
.way.back{background:#26292e;border-color:#26292e;color:#f5efe6}.way.back .wk{color:#f2b632}.way.back small{color:#b9b2a8}.way.back .go2{color:#ffd27a}

/* ---------- WORKSTATION (the back door) ---------- */
#ws{position:fixed;inset:0;z-index:55;display:none;flex-direction:column;background:#211c18;color:#f2ebe1;--navW:300px;--railW:360px}
#ws.on{display:flex}
#ws.clip{transition:clip-path .6s cubic-bezier(.3,.8,.2,1)}
#ws .locbar{position:relative;flex:none;color:var(--ink)}
.wsbody{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr);gap:18px;padding:18px 22px;
  background:radial-gradient(ellipse 700px 420px at 18% 0%,rgba(255,206,120,.16),transparent 70%),radial-gradient(circle,rgba(255,255,255,.06) 1.4px,transparent 1.6px) 0 0/22px 22px,#211c18}
/* bench: tickets pinned to a strip of cork */
.bench{grid-column:1/3;display:flex;gap:14px;align-items:stretch;background:linear-gradient(#a87c52,#94693f);border-radius:14px;padding:12px 14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 6px 18px rgba(0,0,0,.3);min-width:0;overflow-x:auto}
.bench .bl{display:flex;flex-direction:column;justify-content:center;color:#fff6e6;flex:none;padding-right:6px}
.bench .bl small{font-size:10.5px;font-weight:800;letter-spacing:.14em;opacity:.85}
.bench .bl b{font-size:14px}
.ticket{position:relative;background:#fffdf6;color:var(--ink);border-radius:4px;padding:10px 12px 9px;width:210px;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.25);transform:rotate(var(--rot,0deg));font-size:12.5px;line-height:1.3}
.ticket:before{content:"";position:absolute;top:-7px;left:50%;width:46px;height:14px;margin-left:-23px;background:rgba(255,255,255,.55);transform:rotate(-3deg)}
.ticket .st{font-size:10px;font-weight:800;letter-spacing:.1em;margin-bottom:4px;display:block}
.ticket.done{opacity:.8}.ticket.done .st{color:var(--green)}.ticket.done b{text-decoration:line-through;color:var(--muted)}
.ticket.active{outline:3px solid #f2b632;box-shadow:0 0 0 6px rgba(242,182,50,.25),0 6px 14px rgba(0,0,0,.3)}.ticket.active .st{color:#b8860b}
.ticket.queued .st{color:var(--muted)}
.ticket small{display:block;color:var(--muted);margin-top:4px;font-size:11px}
.desktools{margin-left:auto;display:flex;flex-direction:column;gap:6px;justify-content:center;flex:none;min-width:190px}
.tool{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);color:#fff6e6;border-radius:12px;padding:6px 10px;font-size:12.5px;font-weight:700}
.tool button{margin-left:auto;background:#fff6e6;color:var(--ink);border-radius:10px;padding:3px 9px;font-size:11.5px;font-weight:800}
.tool.on{background:#2b2e33;color:#f2b632}
.tool .avs{display:flex;margin-left:auto}.tool .avs .av{width:22px;height:22px;font-size:9px;margin-left:-6px;box-shadow:0 0 0 2px #94693f}
/* left: terminal (stories) or notebook (lessons) */
.term{background:#121010;border:1px solid #3a332c;border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.term .th{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid #2c2622}
.term .th i{width:10px;height:10px;border-radius:50%;display:inline-block}
.term .th span{margin-left:8px;font:700 11px var(--mono);color:#a99f93;letter-spacing:.08em}
.term .repo{padding:12px 14px 6px;font-size:12px;color:#b9b2a8}
.term .repo a{color:#7cc4ff;font-weight:700;font-size:14px;text-decoration:none;display:block;margin:2px 0}
.term .tb{display:flex;gap:6px;padding:6px 14px 10px;flex-wrap:wrap}
.term .tb button{height:30px;border-radius:15px;padding:0 12px;font-size:12px;font-weight:700;background:#2a2521;color:#f2ebe1;border:1px solid #3a332c}
.term .tb button.pri{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
.term .log{flex:1;overflow:auto;padding:4px 14px 14px;font:500 11.5px/1.55 var(--mono);color:#cfc7bb}
.term .log div{padding:3px 0;border-bottom:1px dashed #2a2420}
.term .log .h{color:#f2b632}.term .log .g{color:#7ee2a8}.term .log .d{color:#7d756b}
.term .log .new{animation:flash 1.6s}
@keyframes flash{0%{background:rgba(126,226,168,.25)}100%{background:transparent}}
.cursor{display:inline-block;width:7px;height:13px;background:#7ee2a8;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.notebook{background:repeating-linear-gradient(#fffdf6 0 27px,#e7ddd0 27px 28px);color:var(--ink);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.35);border-left:6px solid #e31b23}
.notebook h4{margin:0;padding:14px 16px 6px;font-size:12px;letter-spacing:.14em;color:var(--muted);background:#fffdf6}
.notebook textarea{flex:1;border:0;background:transparent;resize:none;font:500 15px/28px var(--sans);padding:0 16px;outline:none;color:var(--ink)}
.notebook .nb-f{padding:8px 16px;font-size:11.5px;color:var(--muted);background:#fffdf6;border-top:1px solid #e7ddd0}
/* centre: the monitor */
.monitor{display:flex;flex-direction:column;min-height:0;align-items:stretch}
.bezel{flex:1;min-height:0;background:#0e0c0b;border-radius:20px;padding:12px;box-shadow:0 16px 40px rgba(0,0,0,.45),inset 0 0 0 1px #2e2924}
.scr{height:100%;background:var(--paper);color:var(--ink);border-radius:10px;overflow:auto;padding:26px 30px;scrollbar-width:thin}
.mstand{height:18px;width:120px;margin:0 auto;background:linear-gradient(#2a2420,#191512);border-radius:0 0 10px 10px}
.scr .k2{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--red);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scr h2{font-size:24px;line-height:1.25;margin:10px 0 8px;letter-spacing:-.01em}
.scr .lede{font-size:16px;line-height:1.5;color:#3a332c;margin:0 0 10px}
.chipm{font:700 11px var(--mono);background:#e6eef5;color:#2f5f86;border-radius:8px;padding:3px 8px}
.sec2{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-weight:800}
.sec2 .n{width:22px;height:22px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:11px}
.sec2 small{margin-left:auto;font:600 11px var(--mono);color:var(--faint)}
.dm{background:#fff;border:1px solid var(--line);border-radius:14px}
.dm .row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line2)}
.dm .row:last-child{border-bottom:0}
.dm .row input{margin-top:3px;width:16px;height:16px;accent-color:var(--ink)}
.dm .row .tx{flex:1;line-height:1.45}
.state{display:inline-block;margin-top:6px;font:700 10.5px var(--mono);letter-spacing:.06em;border-radius:7px;padding:3px 8px}
.state.ok{background:#e3f2e7;color:#1b6b3a}.state.note{background:var(--line2);color:var(--muted)}.state.wait{border:1px dashed #cdbfae;color:var(--faint)}
.dm .row.ok{background:#f3faf5}
.dm .row.ok .tx{color:#1b4b2c}
.prompt{background:#16130f;color:#e9e1d4;border-radius:14px;padding:14px 16px;font:500 12.5px/1.6 var(--mono);white-space:pre-wrap;position:relative}
.prompt .cp{position:absolute;top:10px;right:10px}
.donebar{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.donebar p{margin:0;flex:1;color:var(--muted);font-size:13px;line-height:1.45}
.donebar.won{background:#e3f2e7;border-color:#bfe0c9}.donebar.won p{color:#1b4b2c}
.player{position:relative;aspect-ratio:16/9;max-width:560px;cursor:pointer;background:linear-gradient(135deg,#1b2733,#3f6f8f);border-radius:14px;overflow:hidden;display:grid;place-items:center;color:#fff}
.player .ttl{position:absolute;left:18px;top:14px;right:18px;font-weight:700;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.player .play{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--red);font-size:30px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.player .pbar2{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.25)}
.player .pbar2 i{display:block;height:100%;width:0;background:var(--red);transition:width .2s linear}
.player .tm{position:absolute;right:14px;bottom:14px;font:700 12px var(--mono);background:rgba(0,0,0,.45);border-radius:6px;padding:2px 6px}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;background:#fff;font-size:13.5px}
.qopt:hover{background:var(--line2)}.qopt.right{border-color:#1f8a4c;background:#e3f2e7}.qopt.wrong{border-color:#e31b23;background:#fdecec}
/* right: Cory */
.cory{background:#fffdf9;color:var(--ink);border-radius:18px;grid-row:1/3;grid-column:3;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.cory .ch2{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cory .ch2 .av{width:38px;height:38px;font-size:13px;background:#2f8f5b;position:relative}
.cory .ch2 .av:after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#3ddc84;border:2px solid #fff}
.cory .ch2 small{display:block;color:var(--muted);font-size:12px}
.cory .msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.cory .m.them{background:#e8f1ef}
.cory .sc{display:flex;gap:6px;padding:8px 14px 0}
.cory .sc button{font:800 11px var(--mono);letter-spacing:.08em;border:1px solid var(--line);border-radius:14px;padding:5px 11px;background:#fff}
.cory .sc button:hover{background:var(--line2)}
.cory form{display:flex;gap:8px;padding:10px 14px 14px}
.cory input{flex:1;height:var(--ctl);border-radius:18px;border:1px solid var(--line);padding:0 14px;font:inherit;min-width:0}
.wsstatus{flex:none;display:flex;gap:30px;align-items:center;background:#0f0d0c;color:#efe8de;padding:10px 22px;font:700 13px var(--mono);overflow-x:auto;white-space:nowrap}
.wsstatus small{display:block;font-size:9.5px;letter-spacing:.14em;color:#8b8379;font-weight:700}
.wsstatus em{font-style:normal;color:#7cc4ff;font-size:11px}
.feedws{margin-left:12px;font-size:12.5px;font-weight:700;color:var(--navy);display:inline-flex;align-items:center;gap:6px}
@media (max-width:1100px){.wsbody{grid-template-columns:minmax(0,1fr) 320px}.bench{grid-column:1/2}.wsbody .term,.wsbody .notebook{display:none}.cory{grid-column:2}}
@media (max-width:760px){.wsbody{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow:auto;padding:12px}.bench{grid-column:1}.cory{grid-row:auto;grid-column:1;min-height:420px}.monitor{min-height:70vh}.desktools{display:none}}

/* doors on the back wall, each with its sign ON the door */
.door.front{left:4%;width:16%;height:60%;border-radius:8px 8px 0 0;box-shadow:inset 0 0 0 6px rgba(0,0,0,.18),0 0 0 8px #efe6d6}
.plate{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;border-radius:6px;pointer-events:none;line-height:1.15}
.door.front .plate{top:20%;background:#fffdf6;color:var(--ink);padding:calc(var(--FW)*.008) calc(var(--FW)*.012);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.door.front .plate small{display:block;font:800 calc(var(--FW)*.014) var(--sans);letter-spacing:.14em;color:var(--red)}
.door.front .plate b{display:block;font:800 calc(var(--FW)*.03) var(--sans)}
.bdoor .plate{top:38%;background:#1f2226;border:3px solid #f2b632;color:#f2b632;font:800 calc(var(--FW)*.03) var(--mono);letter-spacing:.14em;padding:calc(var(--FW)*.005) calc(var(--FW)*.012);box-shadow:0 0 18px rgba(242,182,50,.55)}
.door.front:hover,.bdoor:hover{filter:brightness(1.12)}
/* book a call with admissions */
#book{position:fixed;inset:0;z-index:89;background:rgba(23,19,28,.45);display:none;place-items:center;padding:16px}
#book.on{display:grid}
.bk{background:var(--card);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.3);width:min(600px,100%);max-height:92vh;overflow:auto;animation:pop .25s}
.bk .bh{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
.bk .bh h3{font-family:var(--serif);font-size:24px;margin:4px 0 4px}
.bk .bh p{margin:0;color:var(--muted)}
.bk .bh .x{background:var(--line2);color:var(--ink)}
.bk .bb2{padding:16px 22px 20px}
.bk .lbl2{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin:14px 0 8px}
.bk .lbl2:first-child{margin-top:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{border:1px solid var(--line);border-radius:12px;padding:8px 0;background:#fff;font-size:12px;line-height:1.2}
.days button b{display:block;font-size:17px}
.days button.on,.slots button.on,.chips .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slots button{height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;font-size:13px}
.slots button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.bk textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical}
.bk .who{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.bk .ft2{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.bk .ft2 small{color:var(--muted)}
.bk .okbig{text-align:center;padding:26px 22px}
.bk .okbig .ic{font-size:40px}
.coming{border:1px solid #cfdbee;background:#eef3fb;border-radius:16px;padding:12px 14px;margin-bottom:6px}
.coming b{display:block;font-size:14px}
/* ---------- FOCUS (flat view of a wall board) ---------- */
#focus{position:fixed;inset:0;z-index:70;background:rgba(23,19,28,.5);display:none;place-items:center}
#focus.on{display:grid}
#focus .fcard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);width:min(460px,92vw);padding:22px;animation:pop .25s}
@keyframes pop{from{transform:scale(.94);opacity:0}}

/* ---------- POPOVER / CHAT / TOASTS ---------- */
#pop{position:fixed;z-index:80;width:300px;background:var(--card);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.22);padding:16px;display:none;animation:pop .2s}
#pop.on{display:block}
#pop .hd{display:flex;gap:12px;align-items:center}
#pop .hd .av{width:46px;height:46px;font-size:15px}
#pop b{font-size:16px}
#chat{position:fixed;right:24px;bottom:24px;width:340px;height:440px;background:var(--card);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);z-index:85;display:none;flex-direction:column;overflow:hidden}
#chat.on{display:flex}
#chat .ch{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
#chat .ch .tx{flex:1;min-width:0}
#chat .ch small{color:var(--muted);display:block;font-size:12px}
#chat .loc{font-size:12px;color:var(--muted);padding:6px 14px;background:var(--line2);display:flex;justify-content:space-between;align-items:center}
#chat .msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:8px 12px;border-radius:14px;line-height:1.4;font-size:13.5px}
.m.them{background:#f1ece4;align-self:flex-start;border-bottom-left-radius:4px}
.m.mine{background:var(--red);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.m.sys{align-self:center;background:none;color:var(--faint);font-size:12px;text-align:center}
.m .act{margin-top:8px}
#chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#chat input{flex:1;height:var(--ctl);border-radius:18px;border:1px solid var(--line);padding:0 14px;font:inherit}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:#1f1b16;color:#fff;border-radius:18px;padding:10px 16px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);pointer-events:auto;animation:pop .25s}
.t .btn{height:28px;font-size:12px;background:#fff;color:var(--ink);border:0}
.burst{position:fixed;z-index:95;font:800 15px var(--sans);color:var(--red);pointer-events:none;animation:burst 1.4s ease-out forwards}
@keyframes burst{to{transform:translateY(-36px);opacity:0}}

/* ---------- WHERE TO (palette) ---------- */
#wf{position:fixed;inset:0;z-index:88;background:rgba(23,19,28,.35);backdrop-filter:blur(3px);display:none;justify-content:center;align-items:flex-start;padding-top:12vh}
#wf.on{display:flex}
#wf .box{width:min(620px,94vw);background:var(--card);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.3);overflow:hidden}
#wf input{width:100%;height:58px;border:0;border-bottom:1px solid var(--line);padding:0 20px;font:500 18px var(--sans);background:transparent;outline:none}
#wf .res{max-height:52vh;overflow:auto;padding:8px}
#wf .g{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);padding:10px 12px 4px}
#wf .r{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:12px;text-align:left}
#wf .r.sel,#wf .r:hover{background:var(--line2)}
#wf .r .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
#wf .r .tx{flex:1;min-width:0}
#wf .r small{color:var(--muted);display:block}

/* =====================================================================
   WALKING: a path graph; ground clicks walk along the paths, then cut across the grass.
   ===================================================================== */
const N={hub:HUB,gate:GATE,aveC:{x:500,y:AVE}};
[100,900].forEach(x=>N['ave'+x]={x,y:AVE});
B.forEach(b=>{N['door_'+b.id]={x:b.x,y:b.y+6};if(b.zone==='ave')N['ave'+b.x]={x:b.x,y:AVE}});
const E=[['hub','aveC'],['aveC','gate']];
B.forEach(b=>{if(b.zone==='up')E.push(['hub','door_'+b.id]);else E.push(['door_'+b.id,'ave'+b.x])});
const aveXs=[...new Set(Object.keys(N).filter(k=>k.startsWith('ave')&&k!=='aveC').map(k=>N[k].x).concat(500))].sort((a,b)=>a-b);
aveXs.forEach((x,i)=>{if(i){const a=aveXs[i-1]===500?'aveC':'ave'+aveXs[i-1],z=x===500?'aveC':'ave'+x;E.push([a,z])}});
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function project(p){let best=null;E.forEach(([a,z])=>{const A=N[a],Z=N[z],dx=Z.x-A.x,dy=Z.y-A.y,L=dx*dx+dy*dy;let t=L?((p.x-A.x)*dx+(p.y-A.y)*dy)/L:0;t=Math.max(0,Math.min(1,t));
  const q={x:A.x+t*dx,y:A.y+t*dy},d=dist(p,q);if(!best||d<best.d)best={a,z,q,d}});return best}
function routeTo(from,to){
  const s=project(from),t=project(to);
  if((s.a===t.a&&s.z===t.z)||(s.a===t.z&&s.z===t.a))return clean([from,s.q,t.q,to]);
  const nodes={...N,_S:s.q,_T:t.q},adj={};const add=(a,b)=>{const d=dist(nodes[a],nodes[b]);(adj[a]=adj[a]||[]).push([b,d]);(adj[b]=adj[b]||[]).push([a,d])};
  E.forEach(([a,z])=>add(a,z));add('_S',s.a);add('_S',s.z);add('_T',t.a);add('_T',t.z);
  const D={},prev={},Q=new Set(Object.keys(nodes));Object.keys(nodes).forEach(k=>D[k]=Infinity);D._S=0;
  while(Q.size){let u=null;Q.forEach(k=>{if(u===null||D[k]<D[u])u=k});Q.delete(u);if(u==='_T')break;(adj[u]||[]).forEach(([v,w])=>{if(D[u]+w<D[v]){D[v]=D[u]+w;prev[v]=u}})}
  const path=[];let u='_T';while(u){path.unshift(nodes[u]);u=prev[u]}
  return clean([from,...path,to]);
}
function clean(pts){const out=[];pts.forEach(p=>{if(!out.length||dist(out[out.length-1],p)>1)out.push({x:p.x,y:p.y})});return out}
function setAv(p){S.pos={x:p.x,y:p.y};$('avatar').setAttribute('transform',`translate(${p.x},${p.y})`)}
setAv(S.pos);
let walkJob=null;
function walk(pts,label,done){
  cancelWalk();
  const lens=[];let L=0;for(let i=1;i<pts.length;i++){const d=dist(pts[i-1],pts[i]);lens.push(d);L+=d}
  if(L<2){done&&done();return}
  const dur=reduce?1:Math.max(600,L/330*1000);
  const rl=el('polyline',{id:'routeLine',points:pts.map(p=>`${p.x},${p.y}`).join(' ')},$('g-route'));
  S.walking=true;S.follow=true;camEase=.07;$('avatar').classList.add('walking');
  const tt=toast(`🚶 Walking to ${esc(label)}…`,0,['Skip',()=>finish()]);
  const t0=performance.now();let lastStep=0;
  function at(f){let d=f*L;for(let i=0;i<lens.length;i++){if(d<=lens[i]){const a=pts[i],b=pts[i+1],r=lens[i]?d/lens[i]:0;return{x:a.x+(b.x-a.x)*r,y:a.y+(b.y-a.y)*r}}d-=lens[i]}return pts[pts.length-1]}
  function frame(now){if(!walkJob)return;let f=Math.min(1,(now-t0)/dur);const e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;const p=at(e);setAv(p);
    if(now-lastStep>140){lastStep=now;const d=el('circle',{cx:p.x+(Math.random()*4-2),cy:p.y+2,r:1.6,class:'step-dot'},$('g-steps'));setTimeout(()=>d.remove(),1700)}
    if(f<1)walkJob.raf=requestAnimationFrame(frame);else finish()}
  function finish(){if(!walkJob)return;cancelAnimationFrame(walkJob.raf);walkJob=null;setAv(pts[pts.length-1]);rl.remove();tt.remove();S.walking=false;S.follow=false;$('avatar').classList.remove('walking');done&&done()}
  walkJob={raf:requestAnimationFrame(frame),finish};
}
function cancelWalk(){if(walkJob){cancelAnimationFrame(walkJob.raf);walkJob=null;$('g-route').innerHTML='';$('toast').querySelectorAll('.t').forEach(t=>{if(t.textContent.includes('Walking'))t.remove()});S.walking=false;S.follow=false;$('avatar').classList.remove('walking')}}

   <div class="loc"><span>📍 ${p.staff?esc(p.desk)+' · '+byId[p.at].name:(S.room===p.at?'Here with you in the '+byId[p.at].name:'In the '+byId[p.at].name)}</span>${S.room===p.at?'':`<button class="btn sm" data-act="go" data-b="${p.at}">Walk over</button>`}</div>
   <div class="msgs" id="msgs"><div class="m sys">${p.staff?esc(p.name)+' is AI staff. '+esc(p.name)+' only replies to you, never messages first.':'Direct message · '+esc(p.cohort)}</div></div>
   <form id="chatForm"><input id="chatIn" placeholder="Message ${esc(p.name.split(' ')[0])}…" autocomplete="off"><button class="btn red" type="submit">Send</button></form>`;
  c.classList.add('on');$('chatIn').focus();
  $('chatForm').onsubmit=e=>{e.preventDefault();const v=$('chatIn').value.trim();if(!v)return;addMsg('mine',esc(v)+(S.room?`<div style="font-size:11px;opacity:.8;margin-top:4px">📍 ${byId[S.room].name}</div>`:''));$('chatIn').value='';
    const typing=document.createElement('div');typing.className='m sys';typing.textContent=p.name.split(' ')[0]+' is typing…';$('msgs').appendChild(typing);
    setTimeout(()=>{typing.remove();const R=REPLIES[pid];const k=(S.chat.n=(S.chat.n||0)+1)-1;
      if(R)addMsg('them',esc(R[Math.min(k,R.length-1)])+(k===0&&pid==='reese'?`<div class="act"><button class="btn sm" data-act="book">📅 Book a call with admissions</button></div>`:'')+(k>=1?`<div class="act"><button class="btn sm teal" data-act="go" data-b="lecture">Walk to the Classroom →</button></div>`:''));
      else addMsg('them',['Hey Ali! 👋','Sure, come find me in the '+byId[p.at].name+'.','Sounds good.'][Math.min(k,2)])},900)};}
function addMsg(who,html){const m=document.createElement('div');m.className='m '+who;m.innerHTML=html;$('msgs').appendChild(m);$('msgs').scrollTop=1e6}

/* Where to? palette */
let wfSel=0,wfItems=[];
function openWF(){$('wf').classList.add('on');$('wfIn').value='';renderWF();setTimeout(()=>$('wfIn').focus(),20)}
function closeWF(){$('wf').classList.remove('on')}
function renderWF(){const q=$('wfIn').value.trim().toLowerCase();wfItems=[];
  const groups=[];
  if(!q){const n=nextStep();if(n)groups.push(['UP NEXT',[{ic:'▶',c:'#0f766e',t:n.t,s:byId[n.b].name,a:'Walk →',go:()=>goTo(n.b)}]]);
    groups.push(['HELP',[...Object.values(STAFF).map(s=>({ic:s.ini,c:s.color,t:'Message '+s.name,s:s.role+' · AI, 24/7',a:'Message',go:()=>openChat(s.pid)})),{ic:'📅',c:'#1f3a5f',t:'Book a call with admissions',s:'A real person · 30 min · Google Meet',a:'Book',go:()=>openBook()}]]);
    groups.push(['ALL BUILDINGS',B.map(b=>({ic:b.icon,c:b.color,t:b.name,s:b.sub,a:'Walk →',go:()=>goTo(b.id)}))]);}
  else{const toks=q.split(/\s+/);const hit=s=>toks.every(t=>s.toLowerCase().includes(t));
    const bl=B.filter(b=>hit(b.name+' '+b.sub+' '+b.keys)).map(b=>({ic:b.icon,c:b.color,t:b.name,s:b.sub,a:'Walk →',go:()=>goTo(b.id)}));
    const rl=B.flatMap(b=>b.rooms.filter(r=>hit(r[0]+' '+b.name)).map(r=>({ic:b.icon,c:b.color,t:r[0],s:'in the '+b.name,a:'Go in →',go:()=>goTo(b.id,{then:()=>setTimeout(()=>throughDoor(r[1]),900)})})));
    if(hit('book call admissions person human meeting enroll talk schedule'))groups.push(['HELP',[{ic:'📅',c:'#1f3a5f',t:'Book a call with admissions',s:'A real person · 30 min · Google Meet',a:'Book',go:()=>openBook()}]]);
    const pl=Object.values(PEOPLE).filter(p=>hit(p.name+' '+(p.role||'')+' '+(p.desk||''))).map(p=>({ic:p.ini,c:p.color,t:p.name,s:p.staff?p.role:'In the '+byId[p.at].name,a:p.staff?'Message':'View',go:()=>openChat(p.pid)}));
    if(pl.length)groups.push(['PEOPLE',pl.slice(0,5)]);if(bl.length)groups.push(['BUILDINGS',bl]);if(rl.length)groups.push(['ROOMS',rl.slice(0,8)]);}
  let html='';groups.forEach(([g,list])=>{html+=`<div class="g">${g}</div>`;list.forEach(it=>{const i=wfItems.push(it)-1;html+=`<button class="r" data-wf="${i}"><span class="ic" style="background:${it.c}">${esc(it.ic)}</span><span class="tx"><b>${esc(it.t)}</b><small>${esc(it.s)}</small></span><em>${it.a}</em></button>`})});
  $('wfRes').innerHTML=html||`<p class="meta" style="padding:14px">Nothing for “${esc(q)}”. Try “class”, “projects”, “points” or “Reese”.</p>`;wfSel=0;selWF();}
function selWF(){$('wfRes').querySelectorAll('.r').forEach((r,i)=>r.classList.toggle('sel',i===wfSel))}
$('wfIn').addEventListener('input',renderWF);
$('wfIn').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){wfSel=Math.min(wfItems.length-1,wfSel+1);selWF();e.preventDefault()}else if(e.key==='ArrowUp'){wfSel=Math.max(0,wfSel-1);selWF();e.preventDefault()}else if(e.key==='Enter'&&wfItems[wfSel]){const it=wfItems[wfSel];closeWF();it.go()}});
$('wf').addEventListener('click',e=>{if(e.target.id==='wf')closeWF();const r=e.target.closest('[data-wf]');if(r){const it=wfItems[+r.dataset.wf];closeWF();it.go()}});
$('openWF').onclick=openWF;

/* focus a wall board flat */
function focusBoard(which){const P=PAGES[S.room],c=which==='A'?P.A:P.Bc;$('focusCard').innerHTML=sideCardHTML(c).replace('pcard sidecard','sidecard')+`<div class="btnrow" style="padding:0 22px 6px"><button class="btn red" data-act="door" data-r="${byId[S.room].route}">See it on the page →</button><button class="btn" data-act="focus-close">Close</button></div>`;$('focus').classList.add('on')}

/* =====================================================================
   ONE CLICK HANDLER
   ===================================================================== */
document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('#pop')&&!t.closest('[data-pid]')&&!t.closest('.chip'))closePop();
  const pidEl=t.closest('[data-pid]');if(pidEl&&!t.closest('[data-chat]')){e.stopPropagation();openPerson(pidEl.dataset.pid,e.clientX,e.clientY);return}
  const ch=t.closest('[data-chat]');if(ch){openChat(ch.dataset.chat);return}
  const wv=t.closest('[data-wave]');if(wv){toast(`👋 You waved at ${esc(PEOPLE[wv.dataset.wave].name.split(' ')[0])}`);closePop();return}
  const bd=t.closest('[data-board]');if(bd){focusBoard(bd.dataset.board);return}
  const mb=t.closest('[data-mb]');if(mb){const id=mb.dataset.mb;hidePage(true);closeRoom(false);goTo(id);return}
  if(t.id==='focus'){$('focus').classList.remove('on');return}
  if(t.id==='book'){$('book').classList.remove('on');return}
  const qb=t.closest('[data-q]');if(qb&&S.ws){const c=CARDS[S.ws.cid];const ok=+qb.dataset.q===c.q.a;qb.classList.add(ok?'right':'wrong');if(ok){(S.ws.l=S.ws.l||{}).q=true;lessonCheck(c)}else coryMsg('Not quite. Think about what Claude Code does after it makes a change.');return}
  const cy=t.closest('[data-cory]');if(cy){coryAsk(cy.dataset.cory);return}
  const a=t.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='go'){closePop();$('chat').classList.remove('on');if(S.page)hidePage(true);if(S.room)closeRoom(false);goTo(a.dataset.b)}
  else if(act==='close-room')closeRoom(true);
  else if(act==='book')openBook();
  else if(act==='book-close'){$('book').classList.remove('on')}
  else if(act==='book-topic'){BOOK.note=($('bkNote')||{}).value||BOOK.note;BOOK.topic=a.dataset.t;renderBook()}
  else if(act==='book-day'){BOOK.note=($('bkNote')||{}).value||BOOK.note;BOOK.day=+a.dataset.i;BOOK.slot=null;renderBook()}
  else if(act==='book-slot'){BOOK.note=($('bkNote')||{}).value||BOOK.note;BOOK.slot=a.dataset.t;renderBook()}
  else if(act==='book-confirm'){if(!BOOK.slot)return;BOOK.done={day:BOOK.day,slot:BOOK.slot,topic:BOOK.topic};renderBook();renderPanel();if(S.page)showPage(S.page.b,S.page.route);toast('📅 Booked with admissions · invite sent to your email',4000)}
  else if(act==='book-resched'){BOOK.done=null;BOOK.slot=null;renderBook();renderPanel();$('book').classList.add('on')}
  else if(act==='ws'){$('focus').classList.remove('on');const cid=a.dataset.card;if(S.room&&!S.page)throughBackDoor(cid);else showWS(cid,a.getBoundingClientRect(),S.page?'page':'map')}
  else if(act==='ws-out')wsOut();
  else if(act==='ws-front'){const c=CARDS[S.ws.cid],o=S.ws.origin;hideWS(true);if(!(o==='page'&&S.page))showPage(c.b,byId[c.b].route,null)}
  else if(act==='ws-sync')wsSync();
  else if(act==='ws-cmd'){const l=$('wsLog');if(l){const d=document.createElement('div');d.className='new';d.innerHTML='<span class="h">$ git clone https://github.com/'+esc(CARDS[S.ws.cid].repo)+'.git</span>';l.insertBefore(d,l.lastElementChild)}}
  else if(act==='ws-play')wsPlay();
  else if(act==='ws-focus'){if(focusT){clearInterval(focusT);focusT=null;a.textContent='Start';$('focusTool').classList.remove('on');return}let sec=1500;a.textContent='Stop';$('focusTool').classList.add('on');focusT=setInterval(()=>{sec--;const e=$('focusTxt');if(!e){clearInterval(focusT);return}e.textContent='Focus '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000)}
  else if(act==='ws-hd'){const on=a.textContent==='Off';a.textContent=on?'On':'Off';$('hdTool').classList.toggle('on',on);toast(on?'🎧 Heads-down: classmates see you’re busy and messages wait until you’re done':'Heads-down is off')}
  else if(act==='door'){$('focus').classList.remove('on');throughDoor(a.dataset.r,a.dataset.open==='next')}
  else if(act==='room-go'){const r=a.dataset.r,b=B.find(x=>x.rooms.some(y=>y[1]===r));if(S.room===b.id)throughDoor(r);else goTo(b.id,{then:()=>setTimeout(()=>throughDoor(r),900)})}
  else if(act==='page-room'){showPage(S.page.b,a.dataset.r)}
  else if(act==='page-bld'){hidePage(true);closeRoom(false);goTo(a.dataset.b)}
  else if(act==='step-out')stepOutside();
  else if(act==='to-campus')toCampus();
  else if(act==='wf')openWF();
  else if(act==='plan-done')planDone(a.dataset.id,e);
  else if(act==='plan-open')planOpen(a.dataset.id);
  else if(act==='tour-start'){if(S.page)hidePage(true);tourGo(0)}
  else if(act==='tour-resume'){if(S.page)hidePage(true);tourGo(S.tour)}
  else if(act==='tour-next')tourGo(S.tour+1);
  else if(act==='tour-end')tourEnd(false);
  else if(act==='tour-finish')tourEnd(true);
  else if(act==='chat-close')$('chat').classList.remove('on');
  else if(act==='focus-close')$('focus').classList.remove('on');
  else if(act==='toast')toast(esc(a.dataset.msg));
});
document.addEventListener('change',e=>{const t=e.target;if(!S.ws)return;const c=CARDS[S.ws.cid];
  if(t.dataset.dn!=null){const d=c.done[+t.dataset.dn];if(d.st!=='ok'){d.st=t.checked?'note':'wait';$('scr').innerHTML=screenHTML(c)}}
  if(t.dataset.gt!=null){const all=[...document.querySelectorAll('[data-gt]')].every(x=>x.checked);if(all&&!c.complete){c.complete=true;$('donebar').className='donebar won';$('donebar').innerHTML='<p><b>✓ Done.</b> Nice work.</p><button class="btn" data-act="ws-out">Step outside</button>';if(c.pts)award(c.pts,esc(c.short))}}});
document.addEventListener('keydown',e=>{
  if((e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName))||(e.key==='k'&&(e.metaKey||e.ctrlKey))){e.preventDefault();openWF();return}
  if(e.key!=='Escape')return;
  if($('wf').classList.contains('on'))return closeWF();
  if($('book').classList.contains('on'))return $('book').classList.remove('on');
  if($('focus').classList.contains('on'))return $('focus').classList.remove('on');
  if($('pop').classList.contains('on'))return closePop();
  if($('chat').classList.contains('on'))return $('chat').classList.remove('on');
  if(S.ws)return wsOut();
  if(S.page)return stepOutside();
  if(S.room)return closeRoom(true);
});

renderPanel();renderPlanPins();
setTimeout(()=>toast('Click a building to walk in, or click anywhere on the grounds to walk there.',5200),900);
</script>
