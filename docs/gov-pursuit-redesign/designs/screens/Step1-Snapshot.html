<!doctype html>
<html lang="en">

<!-- Standalone render of design artboard Step1-Snapshot.dc.html. Interactive: clicks update local state. Links go to sibling screens. -->
<div id="dc-root"></div>
<script>
(function () {
  function get(scope, p) {
    p = p.trim();
    if (p === 'true') return true; if (p === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(p)) return Number(p);
    return p.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, scope);
  }
  var WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scope) {
    return s.replace(/\{\{([^}]+)\}\}/g, function (_, p) { var v = get(scope, p); return v == null ? '' : String(v); });
  }
  function renderNodes(nodes, scope, parent) {
    for (var i = 0; i < nodes.length; i++) renderNode(nodes[i], scope, parent);
  }
  function renderNode(n, scope, parent) {
    if (n.nodeType === 3) { parent.appendChild(document.createTextNode(interp(n.nodeValue, scope))); return; }
    if (n.nodeType !== 1) return;
    var tag = n.tagName.toLowerCase();
    if (tag === 'helmet') return;
    if (tag === 'sc-for') {
      var m = WHOLE.exec(n.getAttribute('list') || ''); var list = m ? get(scope, m[1]) : [];
      var as = n.getAttribute('as') || 'item';
      (list || []).forEach(function (item, idx) {
        var s = Object.create(scope); s[as] = item; s.$index = idx;
        renderNodes(n.childNodes, s, parent);
      });
      return;
    }
    if (tag === 'sc-if') {
      var mv = WHOLE.exec(n.getAttribute('value') || ''); var v = mv ? get(scope, mv[1]) : false;
      if (v) renderNodes(n.childNodes, scope, parent);
      return;
    }
    var el = document.createElement(tag === 'svg' || n.namespaceURI === 'http://www.w3.org/2000/svg' ? tag : tag);
    if (n.namespaceURI === 'http://www.w3.org/2000/svg') el = document.createElementNS('http://www.w3.org/2000/svg', n.tagName);
    for (var a = 0; a < n.attributes.length; a++) {
      var at = n.attributes[a]; var name = at.name; var val = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var w = WHOLE.exec(val);
      if (/^on[a-z]+$/i.test(name) && w) {
        var fn = get(scope, w[1]);
        if (typeof fn === 'function') el.addEventListener(name.slice(2).toLowerCase(), (function (f) { return function (e) { e.preventDefault(); f(e); }; })(fn));
        continue;
      }
      if (w) {
        var rv = get(scope, w[1]);
        if (rv === false || rv == null) { if (name === 'checked') el.checked = false; continue; }
        if (rv === true) { el.setAttribute(name, ''); if (name === 'checked') el.checked = true; continue; }
        if (name === 'value') { el.value = String(rv); }
        el.setAttribute(name, String(rv));
        continue;
      }
      var iv = interp(val, scope);
      if (name === 'href' && /\.dc\.html(#.*)?$/.test(iv)) iv = iv.replace('.dc.html', '.html');
      el.setAttribute(name, iv);
    }
    renderNodes(n.childNodes, scope, el);
    parent.appendChild(el);
  }
  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__dcRender(); };
  window.DCLogic.prototype.forceUpdate = function () { window.__dcRender(); };
  window.__dcBoot = function (tplHtml, Component) {
    var tpl = document.createElement('template'); tpl.innerHTML = tplHtml;
    var inst = new Component({});
    var root = document.getElementById('dc-root');
    window.__dcRender = function () {
      var scope = inst.renderVals();
      var frag = document.createDocumentFragment();
      renderNodes(tpl.content.childNodes, scope, frag);
      root.innerHTML = ''; root.appendChild(frag);
    };
    window.__dcRender();
    if (inst.componentDidMount) inst.componentDidMount();
  };
})();
</script>
<script>
(function(){
  var TPL = "\n\n<div style=\"font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #16181D; background: #F6F6F3; min-height: 100%\">\n\n<header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; padding: 24px 40px 18px; background: #FFFFFF; border-bottom: 1px solid #E4E5E9\">\n<div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n<div style=\"font-size: 13px; color: #5B6170\">Gov Opportunities / Qualification</div>\n<h1 style=\"margin: 0; font-size: 24px; font-weight: 600\">Herriman City — Enterprise Work Order Management System RFP</h1>\n<div style=\"font-size: 13px; color: #5B6170\">U3P (Utah) · Bidding as Colaberry</div>\n</div>\n<div style=\"display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #FFF6E5; border: 1px solid #F0D9A8; color: #5C3D00; font-size: 14px; font-weight: 600\">46 days left · closes Dec 1</div>\n</header>\n\n<div style=\"overflow-x: auto; background: #FFFFFF; border-bottom: 1px solid #E4E5E9\">\n<nav aria-label=\"Pursuit steps\" style=\"display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 6px; padding: 14px 40px; min-width: 1100px\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"7\">\n<a href=\"{{s.href}}\" style=\"{{s.wrap}}\" aria-current=\"{{s.aria}}\">\n<span style=\"{{s.badge}}\">{{s.mark}}</span>\n<span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\"><span style=\"{{s.labelStyle}}\">{{s.label}}</span><span style=\"font-size: 12px; color: #5B6170; white-space: nowrap\">{{s.q}}</span></span>\n</a>\n</sc-for>\n</nav>\n</div>\n\n<main style=\"max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 28px 40px 48px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start\">\n\n<section style=\"flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 13px; font-weight: 600; color: #1F4FD8\">Step 1 of 7 · about 2 minutes</div>\n<h2 style=\"margin: 0; font-size: 30px; font-weight: 700\">Is this worth a look?</h2>\n<p style=\"margin: 0; font-size: 16px; color: #3D424D; line-height: 1.5\">Read the short version. If it is clearly not for us, pass now. Otherwise pull the solicitation and we will read the real requirements next.</p>\n</div>\n\n<div style=\"background: #FFFFFF; border: 1px solid #E4E5E9; border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 600\">What they want</h3>\n<span style=\"font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #EEF2FD; color: #163BA6\">AI summary · verify</span>\n</div>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #2B2F38\">Herriman City wants a vendor to supply an enterprise work order management system and the services to deliver it: software to create, assign and close work orders across city operations, plus implementation and support. Bidders with enterprise IT and work order management experience are the target.</p>\n<a href=\"#\" style=\"font-size: 14px; font-weight: 500\">Open the source posting on Bonfire</a>\n</div>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px\">\n<div style=\"background: #FFFFFF; border: 1px solid #E4E5E9; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px\">\n<div style=\"font-size: 12px; font-weight: 600; color: #5B6170\">Estimated value</div>\n<div style=\"font-size: 26px; font-weight: 700\">$1.00M</div>\n<div style=\"font-size: 12px; color: #5B6170\">unverified</div>\n</div>\n<div style=\"background: #FFFFFF; border: 1px solid #E4E5E9; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px\">\n<div style=\"font-size: 12px; font-weight: 600; color: #5B6170\">Closes</div>\n<div style=\"font-size: 26px; font-weight: 700\">Dec 1</div>\n<div style=\"font-size: 12px; color: #5B6170\">46 days · time zone unverified</div>\n</div>\n<div style=\"background: #FFFFFF; border: 1px solid #E4E5E9; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px\">\n<div style=\"font-size: 12px; font-weight: 600; color: #5B6170\">Legacy scores</div>\n<div style=\"font-size: 26px; font-weight: 700\">78 / 75</div>\n<div style=\"font-size: 12px; color: #5B6170\">priority / fit · advisory</div>\n</div>\n<div style=\"background: #FFFFFF; border: 1px solid #E4E5E9; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px\">\n<div style=\"font-size: 12px; font-weight: 600; color: #5B6170\">Questions due</div>\n<div style=\"font-size: 26px; font-weight: 700\">Nov 19</div>\n<div style=\"font-size: 12px; color: #5B6170\">3:00 PM MDT · to S. Brown</div>\n</div>\n</div>\n\n<div style=\"background: #FFFFFF; border: 1px solid #E4E5E9; border-radius: 12px; padding: 18px 24px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 16px; font-weight: 600\">Not for us? Pick a reason and pass</h3>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" style=\"font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid #C9CCD3; background: #FFFFFF; color: #2B2F38; cursor: pointer\">Outside our services</button>\n<button type=\"button\" style=\"font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid #C9CCD3; background: #FFFFFF; color: #2B2F38; cursor: pointer\">Too small</button>\n<button type=\"button\" style=\"font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid #C9CCD3; background: #FFFFFF; color: #2B2F38; cursor: pointer\">Not enough time</button>\n<button type=\"button\" style=\"font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid #C9CCD3; background: #FFFFFF; color: #2B2F38; cursor: pointer\">Incumbent locked in</button>\n<button type=\"button\" style=\"font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid #C9CCD3; background: #FFFFFF; color: #2B2F38; cursor: pointer\">Other…</button>\n</div>\n</div>\n\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 20px; background: #FFFFFF; border: 1px solid #D5DBEA; border-radius: 12px; box-shadow: 0 6px 20px rgba(22, 24, 29, 0.06)\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-size: 15px; font-weight: 600\">Next: read the real requirements</div>\n<div style=\"font-size: 13px; color: #5B6170\">Download the ZIP from Bonfire (portal login) and drop it on the next step.</div>\n</div>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n<button type=\"button\" style=\"font: inherit; font-size: 15px; font-weight: 600; padding: 12px 18px; border-radius: 10px; border: 1px solid #B42318; background: #FFFFFF; color: #B42318; cursor: pointer\">Pass on this</button>\n<a href=\"Step2-Solicitation.dc.html\" style=\"font-size: 15px; font-weight: 600; padding: 12px 20px; border-radius: 10px; background: #1F4FD8; color: #FFFFFF; text-decoration: none\">Worth a look — get the solicitation →</a>\n</div>\n</div>\n</section>\n\n<aside aria-label=\"Pursuit brief\" style=\"flex: 1 1 320px; max-width: 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E5E9; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<h3 style=\"margin: 0; font-size: 17px; font-weight: 700\">Pursuit brief</h3>\n<div style=\"font-size: 13px; color: #5B6170\">Grows one section per step.</div>\n</div>\n<sc-for list=\"{{brief}}\" as=\"g\" hint-placeholder-count=\"6\">\n<div style=\"{{g.box}}\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n<span style=\"font-size: 13px; font-weight: 700\">{{g.title}}</span>\n<span style=\"{{g.tagStyle}}\">{{g.tag}}</span>\n</div>\n<sc-for list=\"{{g.items}}\" as=\"it\" hint-placeholder-count=\"2\">\n<div style=\"{{g.itemStyle}}\">{{it.t}}</div>\n</sc-for>\n</div>\n</sc-for>\n</aside>\n\n</main>\n</div>\n";
  var Component = (function(){ 
class Component extends DCLogic {
  renderVals() {
    const cur = 1;
    const S = [
      ['Snapshot', 'Worth a look?', 'Step1-Snapshot.dc.html'],
      ['Solicitation', 'What do we submit?', 'Step2-Solicitation.dc.html'],
      ['Fit', 'Can we deliver?', 'Step3-Fit.dc.html'],
      ['Decide', 'Should we bid?', 'Step4-Decide.dc.html'],
      ['Build the bid', 'Product + proposal', 'Step5-BuildTheBid.dc.html'],
      ['Submit', 'Ship it', 'Step6-Submit.dc.html'],
      ['Outcome', 'Did we win?', 'Main.dc.html']
    ];
    const approved = cur >= 5;
    const steps = S.map((s, i) => {
      const n = i + 1, done = n < cur, now = n === cur, locked = n >= 5 && !approved;
      return {
        label: s[0], q: locked ? 'After approval' : s[1], href: s[2], mark: done ? '✓' : String(n), aria: now ? 'step' : 'false',
        wrap: 'display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;min-width:0;' + (now ? 'background:#EEF2FD;box-shadow:inset 0 -3px 0 #1F4FD8;' : '') + (locked ? 'opacity:.6;' : ''),
        badge: 'flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;' + (done ? 'background:#1E7A4C;color:#FFFFFF;' : now ? 'background:#1F4FD8;color:#FFFFFF;' : 'background:#FFFFFF;color:#5B6170;border:1.5px solid #C9CCD3;'),
        labelStyle: 'font-size:14px;font-weight:600;white-space:nowrap;color:' + (now ? '#1F4FD8' : done ? '#1E7A4C' : '#16181D')
      };
    });
    const B = [
      ['Snapshot', ['Enterprise work order management system', '$1.00M est. · closes Dec 1 (46 days)', 'Legacy priority 78 · fit 75', 'Questions due Nov 19, 3:00 PM MDT']],
      ['Solicitation', ['What we submit and the rules']],
      ['Fit', ['Capabilities we have and lack']],
      ['Decide', ['Win probability and value', 'Approver and decision']],
      ['Build the bid', ['Product, MVP plan, proposal']],
      ['Submit', ['Ship by Nov 30']]
    ];
    const brief = B.map((b, i) => {
      const n = i + 1, known = n < cur, now = n === cur;
      return {
        title: n + ' · ' + b[0],
        tag: known ? 'Known' : now ? 'Adding now' : 'Step ' + n,
        tagStyle: 'font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;' + (known ? 'background:#E6F3EC;color:#1E5C3B' : now ? 'background:#EEF2FD;color:#163BA6' : 'background:#F1F2F4;color:#5B6170'),
        box: 'display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;' + (now ? 'border:1.5px solid #1F4FD8;background:#FAFBFF' : known ? 'border:1px solid #E4E5E9' : 'border:1px dashed #D3D5DA'),
        itemStyle: 'font-size:13px;line-height:1.4;' + (known || now ? 'color:#2B2F38' : 'color:#7A808C'),
        items: (known || now ? b[1] : ['Unlocks at step ' + n]).map((t) => ({ t }))
      };
    });
    return { steps, brief };
  }
}

  ; return Component; })();
  window.__dcBoot(TPL, Component);
})();
</script>
