<!-- Standalone render of design artboard Step5-BuildTheBid.dc.html. Interactive: clicks update local state. Links go to sibling screens. -->
<div id="dc-root"></div>
<script>
(function () {
  function get(scope, p) {
    p = p.trim();
    if (p === 'true') return true; if (p === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(p)) return Number(p);
    return p.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, scope);
  }
  var WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;
  function interp(s, scope) {
    return s.replace(/\{\{([^}]+)\}\}/g, function (_, p) { var v = get(scope, p); return v == null ? '' : String(v); });
  }
  function renderNodes(nodes, scope, parent) {
    for (var i = 0; i < nodes.length; i++) renderNode(nodes[i], scope, parent);
  }
  function renderNode(n, scope, parent) {
    if (n.nodeType === 3) { parent.appendChild(document.createTextNode(interp(n.nodeValue, scope))); return; }
    if (n.nodeType !== 1) return;
    var tag = n.tagName.toLowerCase();
    if (tag === 'helmet') return;
    if (tag === 'sc-for') {
      var m = WHOLE.exec(n.getAttribute('list') || ''); var list = m ? get(scope, m[1]) : [];
      var as = n.getAttribute('as') || 'item';
      (list || []).forEach(function (item, idx) {
        var s = Object.create(scope); s[as] = item; s.$index = idx;
        renderNodes(n.childNodes, s, parent);
      });
      return;
    }
    if (tag === 'sc-if') {
      var mv = WHOLE.exec(n.getAttribute('value') || ''); var v = mv ? get(scope, mv[1]) : false;
      if (v) renderNodes(n.childNodes, scope, parent);
      return;
    }
    var el = document.createElement(tag === 'svg' || n.namespaceURI === 'http://www.w3.org/2000/svg' ? tag : tag);
    if (n.namespaceURI === 'http://www.w3.org/2000/svg') el = document.createElementNS('http://www.w3.org/2000/svg', n.tagName);
    for (var a = 0; a < n.attributes.length; a++) {
      var at = n.attributes[a]; var name = at.name; var val = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var w = WHOLE.exec(val);
      if (/^on[a-z]+$/i.test(name) && w) {
        var fn = get(scope, w[1]);
        if (typeof fn === 'function') el.addEventListener(name.slice(2).toLowerCase(), (function (f) { return function (e) { e.preventDefault(); f(e); }; })(fn));
        continue;
      }
      if (w) {
        var rv = get(scope, w[1]);
        if (rv === false || rv == null) { if (name === 'checked') el.checked = false; continue; }
        if (rv === true) { el.setAttribute(name, ''); if (name === 'checked') el.checked = true; continue; }
        if (name === 'value') { el.value = String(rv); }
        el.setAttribute(name, String(rv));
        continue;
      }
      var iv = interp(val, scope);
      if (name === 'href' && /\.dc\.html(#.*)?$/.test(iv)) iv = iv.replace('.dc.html', '.html');
      el.setAttribute(name, iv);
    }
    renderNodes(n.childNodes, scope, el);
    parent.appendChild(el);
  }
  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__dcRender(); };
  window.DCLogic.prototype.forceUpdate = function () { window.__dcRender(); };
  window.__dcBoot = function (tplHtml, Component) {
    var tpl = document.createElement('template'); tpl.innerHTML = tplHtml;
    var inst = new Component({});
    var root = document.getElementById('dc-root');
    window.__dcRender = function () {
      var scope = inst.renderVals();
      var frag = document.createDocumentFragment();
      renderNodes(tpl.content.childNodes, scope, frag);
      root.innerHTML = ''; root.appendChild(frag);
    };
    window.__dcRender();
    if (inst.componentDidMount) inst.componentDidMount();
  };
})();
</script>
<script>
(function(){
  var TPL = "\n\n<div style=\"font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #16181D; background: #F6F6F3; min-height: 100%\">\n\n<header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; padding: 24px 40px 18px; background: #FFFFFF; border-bottom: 1px solid #E4E5E9\">\n<div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n<div style=\"font-size: 13px; color: #5B6170\">Gov Opportunities / Qualification</div>\n<h1 style=\"margin: 0; font-size: 24px; font-weight: 600\">Herriman City — Enterprise Work Order Management System RFP</h1>\n<div style=\"font-size: 13px; color: #5B6170\">U3P (Utah) · Bidding as Colaberry</div>\n</div>\n<div style=\"display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #FFF6E5; border: 1px solid #F0D9A8; color: #5C3D00; font-size: 14px; font-weight: 600\">46 days left · closes Dec 1</div>\n</header>\n\n<div style=\"overflow-x: auto; background: #FFFFFF; border-bottom: 1px solid #E4E5E9\">\n<nav aria-label=\"Pursuit steps\" style=\"display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 6px; padding: 14px 40px; min-width: 1100px\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"7\">\n<a href=\"{{s.href}}\" style=\"{{s.wrap}}\" aria-current=\"{{s.aria}}\">\n<span style=\"{{s.badge}}\">{{s.mark}}</span>\n<span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\"><span style=\"{{s.labelStyle}}\">{{s.label}}</span><span style=\"font-size: 12px; color: #5B6170; white-space: nowrap\">{{s.q}}</span></span>\n</a>\n</sc-for>\n</nav>\n</div>\n\n<main style=\"max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 28px 40px 48px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start\">\n\n<section style=\"flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 13px; font-weight: 600; color: #1F4FD8\">Step 5 of 7 · approved by [approver] · 6 weeks</div>\n<h2 style=\"margin: 0; font-size: 30px; font-weight: 700\">Define the product, plan the MVP, then write the bid</h2>\n<p style=\"margin: 0; font-size: 16px; color: #3D424D; line-height: 1.5\">The proposal describes a product, so we define and plan the product first. The AI drafts every part and stops to ask you when it needs something only you know.</p>\n</div>\n\n<div style=\"background: #16181D; color: #FFFFFF; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #C3C7D0\">LEFT TO SUBMIT</div>\n<div style=\"font-size: 44px; font-weight: 700; line-height: 1\">9 <span style=\"font-size: 18px; font-weight: 500; color: #C3C7D0\">of 14 items</span></div>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #C3C7D0\">SHIP BY</div>\n<div style=\"font-size: 28px; font-weight: 700; line-height: 1.1\">Nov 30 <span style=\"font-size: 15px; font-weight: 500; color: #C3C7D0\">· 45 days</span></div>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #C3C7D0\">ON-TIME PROBABILITY</div>\n<div style=\"font-size: 28px; font-weight: 700; line-height: 1.1; color: #8FD6AE\">74%</div>\n</div>\n<div style=\"flex: 1 1 260px; font-size: 13px; line-height: 1.5; color: #D5D8DF\">Remaining work at this team's pace. The biggest risk is 3 answers waiting on you; answering them lifts this to about 88%.</div>\n</div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<span style=\"font-size: 13px; padding: 5px 10px; border-radius: 999px; background: #2B2F38; color: #FFFFFF\">3 need your answer</span>\n<span style=\"font-size: 13px; padding: 5px 10px; border-radius: 999px; background: #5A1E19; color: #FFD9D4\">{{fillerCount}} blocking export (filler)</span>\n<span style=\"font-size: 13px; padding: 5px 10px; border-radius: 999px; background: #2B2F38; color: #FFFFFF\">1 question for the City · send by Nov 19</span>\n</div>\n</div>\n\n<div style=\"background: #FFFFFF; border: 1px solid #D5DBEA; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 600\">Team and access</h3>\n<a href=\"Intern-BuildPage.dc.html\" style=\"font-size: 14px; font-weight: 500\">Preview what the intern sees →</a>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 10px; background: #F6F6F3\">\n<div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5B6170\">BUILDER (INTERN)</div>\n<sc-if value=\"{{notAssigned}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n<label for=\"intern\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Intern</label>\n<select id=\"intern\" style=\"font: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid #C9CCD3; border-radius: 8px; flex: 1 1 180px\"><option>[Intern name] · AI suggested</option><option>[Another intern]</option></select>\n<button type=\"button\" onClick=\"{{assign}}\" style=\"font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: none; background: #1F4FD8; color: #FFFFFF; cursor: pointer\">Assign</button>\n</div>\n<div style=\"font-size: 13px; line-height: 1.45; color: #3D424D\">Suggested because their profile shows mobile and data work, and they have room for ~20 stories before Nov 26.</div>\n</sc-if>\n<sc-if value=\"{{assigned}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; align-items: center; gap: 10px\">\n<span style=\"width: 36px; height: 36px; border-radius: 50%; background: #1E7A4C; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700\">IN</span>\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"font-size: 15px; font-weight: 600\">[Intern name]</div><div style=\"font-size: 13px; color: #1E5C3B\">Assigned · project created on their profile</div></div>\n</div>\n<div style=\"font-size: 13px; line-height: 1.45; color: #3D424D\">They now have the Build page for this project: the MVP releases and stories assigned to them, plus the submission checklist. <button type=\"button\" onClick=\"{{assign}}\" style=\"font: inherit; font-size: 13px; padding: 0; border: none; background: none; color: #1F4FD8; text-decoration: underline; cursor: pointer\">Change</button></div>\n</sc-if>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 10px; background: #F6F6F3\">\n<div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5B6170\">SHARE THE PROPOSAL WITH THEM</div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\" role=\"group\" aria-label=\"Proposal access\">\n<sc-for list=\"{{shareOpts}}\" as=\"o\" hint-placeholder-count=\"4\">\n<button type=\"button\" onClick=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\" style=\"{{o.style}}\">{{o.label}}</button>\n</sc-for>\n</div>\n<div style=\"font-size: 13px; line-height: 1.45; color: #3D424D\">{{shareNote}}</div>\n</div>\n</div>\n</div>\n\n<div style=\"background: #FFFFFF; border: 1px solid #D5DBEA; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 28px; height: 28px; border-radius: 50%; background: #1F4FD8; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">A</span><h3 style=\"margin: 0; font-size: 18px; font-weight: 600\">Product definition</h3></div>\n<span style=\"font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #FFF0D6; color: #7A4A00\">AI draft · 2 questions for you</span>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 20px; font-size: 14px; line-height: 1.5\">\n<div><div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5B6170\">THE PRODUCT</div>A city work order and asset management system: requests come in, become work orders, go to crews, get closed with time and parts, and roll up into asset history and cost.</div>\n<div><div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5B6170\">WHO USES IT</div>Public works supervisors, field crews (mobile), city staff filing requests, finance for cost reports.</div>\n<div><div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5B6170\">MVP</div>Work orders, crew assignment, asset register, preventive schedules, mobile close-out, migration.</div>\n<div><div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5B6170\">LATER</div>Citizen request portal, inventory and purchasing, advanced reporting.</div>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 10px; background: #F6F6F3\">\n<div style=\"font-size: 14px; font-weight: 600\">The AI can't answer these from the RFP</div>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; font-size: 14px\"><span>What system does the City use today, and how many work orders a year?</span><span style=\"display: flex; gap: 6px\"><button type=\"button\" style=\"font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid #C9CCD3; background: #FFFFFF; cursor: pointer\">I know</button><button type=\"button\" style=\"font: inherit; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid #1F4FD8; background: #FFFFFF; color: #1F4FD8; cursor: pointer\">Ask the City (by Nov 19)</button></span></div>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; font-size: 14px\"><span>Is a GIS map view of assets expected?</span><span style=\"display: flex; gap: 6px\"><button type=\"button\" style=\"font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid #C9CCD3; background: #FFFFFF; cursor: pointer\">Yes</button><button type=\"button\" style=\"font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid #C9CCD3; background: #FFFFFF; cursor: pointer\">No</button><button type=\"button\" style=\"font: inherit; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid #1F4FD8; background: #FFFFFF; color: #1F4FD8; cursor: pointer\">Ask the City</button></span></div>\n</div>\n<div style=\"display: flex; justify-content: flex-end\"><button type=\"button\" style=\"font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 10px; border: none; background: #1F4FD8; color: #FFFFFF; cursor: pointer\">Confirm product — generate spec and MVP plan</button></div>\n</div>\n\n<div style=\"background: #FFFFFF; border: 1px solid #E4E5E9; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #C9CCD3; color: #5B6170; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">B</span><h3 style=\"margin: 0; font-size: 18px; font-weight: 600\">Spec and MVP build schedule</h3></div>\n<span style=\"font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #E6F3EC; color: #1E5C3B\">MVP demo-ready Nov 26 · 5 days before due</span>\n</div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #3D424D\">\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 8px; border-radius: 3px; background: #1F4FD8\"></span>Define + spec</span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 8px; border-radius: 3px; background: #1E7A4C\"></span>MVP build</span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 8px; border-radius: 3px; background: #8A93A6\"></span>Planned, not built</span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 8px; border-radius: 3px; background: #D9A443\"></span>Proposal</span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 2px; height: 12px; background: #1F4FD8\"></span>Today</span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 2px; height: 12px; background: #D9A443\"></span>Questions due Nov 19</span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 2px; height: 12px; background: #B42318\"></span>Proposal due Dec 1</span>\n</div>\n<div style=\"overflow-x: auto\">\n<div style=\"min-width: 760px; display: f
