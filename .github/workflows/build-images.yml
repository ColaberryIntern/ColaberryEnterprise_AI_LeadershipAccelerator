# Build the three production images in CI and push them to GHCR.
#
# WHY THIS EXISTS. Images are currently built ON the production host. The kernel
# journal shows 344 OOM kills, 75 of them in the first eight days of September, and
# the Sep 08 cascade opens with "docker-buildx invoked oom-killer" — the build is
# the largest recurring memory spike on a 15.6GB box that also runs five Postgres
# instances. An 8GB swapfile now absorbs the pressure; moving the build off the box
# removes it.
#
# NOTHING CONSUMES THESE IMAGES YET. This is phase 1 and is deliberately additive:
# docker-compose.production.yml still carries its `build:` stanzas, so deploys are
# completely unchanged by this file. Phase 2 switches compose to `image:` and the
# deploy to `pull && up -d` — that changes the deploy command CLAUDE.md, the memory
# files and every concurrent session rely on, so it is coordinated separately.
#
# SAFE TO BUILD ELSEWHERE: none of the three Dockerfiles takes an ARG or bakes a
# secret. nginx/Dockerfile hardcodes `ENV REACT_APP_API_URL=` (empty), so the React
# bundle is environment-independent and a CI-built image behaves identically to a
# host-built one. If that ever stops being true, phase 2 stops being safe.
name: Build images

on:
  push:
    branches: [main]
  # Proves the build still works BEFORE merge, without pushing anything. Without
  # this, a broken Dockerfile would only ever be discovered on main.
  pull_request:
    paths:
      - 'backend/Dockerfile'
      - 'nginx/Dockerfile'
      - 'intelligence/ai_engine/Dockerfile'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

# A second push to main supersedes the first; there is no value in finishing an
# image nobody will deploy.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One broken image should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          # `context` and `file` mirror docker-compose.production.yml exactly.
          # Both are repo-root relative, which is what build-push-action expects.
          - service: backend
            context: .
            file: backend/Dockerfile
          - service: intelligence
            context: ./intelligence/ai_engine
            file: intelligence/ai_engine/Dockerfile
          - service: nginx
            context: .
            file: nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in an image path and this org is "ColaberryIntern",
      # so the owner is lowercased rather than hardcoded.
      - name: Resolve image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/accelerator-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Only main publishes. A pull_request build verifies and throws the result away.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The GeoLite2 City database, fetched here and baked into the backend image
      # for scripts/enrichVisitorGeo.ts.
      #
      # WHY AT BUILD TIME RATHER THAN ON THE HOST. MaxMind's EULA requires GeoLite
      # users to keep the data current and to delete a database within 30 days of a
      # new release. Fetching it per build means every deploy ships a current copy
      # with no cron to forget and, more importantly, NO LICENSE KEY ON THE
      # PRODUCTION HOST - the key lives only in Actions, and the database it fetches
      # is public data.
      #
      # The layer is content-addressed, so an unchanged database is not re-pulled on
      # deploy; MaxMind publishes about twice a week.
      #
      # NEVER FAILS THE BUILD. Without a key (a fork's PR) or if MaxMind is
      # unreachable, this logs and moves on: `backend/geoip/` is committed with a
      # .gitkeep so the Dockerfile's COPY still succeeds, and the enrichment script
      # refuses loudly at run time on a missing file. An image that cannot enrich is
      # a worse outcome than a broken deploy only if it goes unnoticed, and it
      # cannot - the script exits non-zero and says exactly which path was empty.
      # ONE DOWNLOAD PER DAY, NOT ONE PER BUILD.
      #
      # On 2026-11-11 MaxMind emailed to say the account had hit its daily download
      # limit. Every push to main runs this workflow, and that day had a dozen or
      # more, each fetching a 50 MB database that MaxMind publishes about twice a
      # week. Their own guidance is "no more than once per day per server", so the
      # original step was always going to trip it; it just needed a busy day.
      #
      # Nothing broke, which is why it went unnoticed: the fetch below is fail-soft,
      # so rate-limited builds simply shipped without a database and logged a
      # warning nobody was reading. That is the worse failure mode - quiet.
      #
      # The date in the key is what makes it one per day. `restore-keys` falls back
      # to the most recent earlier cache, so a rate-limited or offline build now
      # ships YESTERDAY's database instead of none at all, which is strictly better
      # for a dataset that changes twice a week.
      #
      # ON THE EULA. MaxMind requires a GeoLite database to be deleted within 30
      # days of a new release. The fallback cannot drift that far: GitHub evicts
      # cache entries not accessed within 7 days, so the oldest entry `restore-keys`
      # can ever return is about a week old, and any build that reaches MaxMind
      # replaces it with the current one.
      - name: GeoLite2 cache key
        if: matrix.service == 'backend'
        id: geodate
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore today's GeoLite2 database
        if: matrix.service == 'backend'
        id: geocache
        uses: actions/cache@v4
        with:
          path: backend/geoip/GeoLite2-City.mmdb
          key: geolite2-city-${{ steps.geodate.outputs.day }}
          restore-keys: geolite2-city-

      - name: Fetch GeoLite2 City database
        # Skipped entirely once today's copy is already in hand. An older restored
        # copy does NOT count as a hit, so the first build of each day still
        # refreshes it.
        if: matrix.service == 'backend' && steps.geocache.outputs.cache-hit != 'true'
        env:
          MM_ACCOUNT: ${{ vars.MAXMIND_ACCOUNT_ID }}
          MM_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          set -uo pipefail
          mkdir -p backend/geoip
          db=backend/geoip/GeoLite2-City.mmdb

          # Did `restore-keys` hand us an older copy? It is the fallback if this
          # fetch cannot complete, so say which outcome actually happened rather
          # than claiming "no database" when there is one.
          if [ -s "$db" ]; then
            have_fallback=yes
            echo "A previous GeoLite2 database was restored from cache; refreshing it."
          else
            have_fallback=no
          fi

          give_up() {
            if [ "$have_fallback" = yes ]; then
              echo "::warning::$1 Keeping the cached copy, which is at most a few days old."
            else
              echo "::warning::$1 Building without a GeoIP database."
            fi
            exit 0
          }

          if [ -z "${MM_KEY:-}" ] || [ -z "${MM_ACCOUNT:-}" ]; then
            give_up "No MaxMind credentials available."
          fi
          # Credentials go in a config file, never on the command line, so they
          # cannot surface in a process list or a trace.
          cfg="$(mktemp)"
          printf 'user = "%s:%s"\n' "$MM_ACCOUNT" "$MM_KEY" > "$cfg"
          url='https://download.maxmind.com/geoip/databases/GeoLite2-City/download?suffix=tar.gz'
          if ! curl -sS -f -L -K "$cfg" -o /tmp/geolite2-city.tar.gz "$url"; then
            rm -f "$cfg"
            # The daily download limit lands here as an HTTP error, which is why
            # the cache above exists rather than this message being the whole plan.
            give_up "GeoLite2 download failed (rate limit, outage or bad key)."
          fi
          rm -f "$cfg"

          # Extract BESIDE the existing file, not over it: a tar that fails halfway
          # would otherwise destroy the usable fallback it was meant to replace.
          tmp="$(mktemp -d)"
          if ! tar -xzf /tmp/geolite2-city.tar.gz -C "$tmp" --strip-components=1 --wildcards '*/GeoLite2-City.mmdb'; then
            rm -rf "$tmp" /tmp/geolite2-city.tar.gz
            give_up "GeoLite2 archive could not be extracted."
          fi
          rm -f /tmp/geolite2-city.tar.gz

          # A truncated or HTML error body would otherwise be installed as if it
          # were a database and fail much later, at a prompt nobody is watching.
          # `stat` on a missing file leaves `bytes` empty, and `[ "" -lt N ]` is a
          # shell error, not a clean failure - so the file is checked first.
          if [ ! -s "$tmp/GeoLite2-City.mmdb" ]; then
            rm -rf "$tmp"
            give_up "The archive contained no GeoLite2-City.mmdb."
          fi
          bytes=$(stat -c%s "$tmp/GeoLite2-City.mmdb")
          if [ "$bytes" -lt 10000000 ]; then
            rm -rf "$tmp"
            give_up "Downloaded GeoLite2-City.mmdb is only ${bytes} bytes, which is not a city database."
          fi

          mv -f "$tmp/GeoLite2-City.mmdb" "$db"
          rm -rf "$tmp"
          ls -l backend/geoip/
          echo "GeoLite2-City.mmdb: ${bytes} bytes"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          # Two tags on purpose: `main` is what a phase-2 rolling deploy would
          # track, and the commit SHA is what makes a rollback nameable.
          tags: |
            ${{ steps.img.outputs.name }}:main
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.service }}"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Built and discarded. Pull requests verify the Dockerfile, they do not publish."
            else
              echo "Pushed \`${{ steps.img.outputs.name }}:sha-${{ github.sha }}\`"
              echo ""
              echo "Not deployed. docker-compose.production.yml still builds from source; see phase 2."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
