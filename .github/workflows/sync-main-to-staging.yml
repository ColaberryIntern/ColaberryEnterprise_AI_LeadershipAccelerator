name: Sync main to staging

on:
  push:
    branches:
      - main

jobs:
  sync:
    name: Back-merge main into staging
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Check if staging already contains main
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..origin/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "staging is $BEHIND commits behind main"

      - name: Merge main into staging (clean path)
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          if git merge origin/main --no-edit; then
            git push origin staging
            echo "result=merged" >> "$GITHUB_OUTPUT"
            echo "Merged main into staging cleanly and pushed."
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "Merge conflict detected — will open a PR for manual review."
          fi

      # Idempotency guard. Without this, every push to main opens ANOTHER
      # identical conflict PR: the branch is always cut from origin/main, so
      # each one is the same unresolvable merge wearing a new number. That is
      # how 56 open PRs accumulated between 2026-08-07 and 2026-08-11 while the
      # underlying main/staging divergence went unresolved. Opening a duplicate
      # tells no one anything the first PR did not already say, and it buries
      # real PRs in the list.
      - name: Look for an already-open sync PR
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.result == 'conflict'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(gh pr list --base staging --state open \
                  --search "chore: sync main to staging in:title" \
                  --json number --jq '.[0].number // empty')
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          if [ -n "$NUM" ]; then
            echo "An open sync PR already exists: #$NUM. Will comment instead of opening another."
          else
            echo "No open sync PR. Will open one."
          fi

      # A conflict that is already reported does not need a new PR; it needs the
      # existing one to stay current. Comment on it so the thread shows the
      # divergence is still growing, and keep the PR count at one.
      - name: Note the new conflict on the existing PR
        if: steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          BEHIND: ${{ steps.check.outputs.behind }}
        run: |
          gh pr comment "${{ steps.existing.outputs.number }}" --body \
            "Still conflicting as of commit \`$SHA\`. Staging is now **$BEHIND commits behind main**. This PR remains the single tracking item for the divergence; no duplicate has been opened."

      - name: Open PR for manual review (conflict path)
        if: steps.existing.outputs.number == '' && steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          BEHIND: ${{ steps.check.outputs.behind }}
        run: |
          BRANCH="sync/main-to-staging-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH" origin/main
          git push origin "$BRANCH"
          gh pr create \
            --base staging \
            --head "$BRANCH" \
            --title "chore: sync main to staging (conflict - manual review needed)" \
            --body "Automated sync of main to staging detected merge conflicts and could not auto-merge. Staging is $BEHIND commits behind main. Action required: resolve the divergence and merge before cutting any new feature branches. Triggered by commit $SHA. This workflow will not open a second PR while this one is open; it comments here on each further conflicting push instead."
