name: Secret scan

# The backstop for the pre-commit hook. The hook is skippable (--no-verify,
# unconfigured clone, a fresh CI agent); this is not. Anything that reaches a
# PR or main gets scanned with the identical binary and identical .gitleaks.toml.
#
# Two jobs, deliberately separated:
#   - `pull-request`: scans the commits the PR actually adds. Fast, blocking,
#     and the thing that stops a new secret from landing.
#   - `full-history`: sweeps all ~4,600 commits. Slow, so it runs on a schedule
#     and on demand rather than per-PR. This is what catches a secret that was
#     committed then "deleted" — the blob survives in history and stays public.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC. Catches anything that landed via a bypass, an
    # administrative merge, or a rule that only exists as of this week.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request:
    name: Scan new commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need both sides of the range to diff a PR; 0 = full history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve pinned gitleaks
        run: node scripts/ensure-gitleaks.js

      # Prove the detector can still FAIL before believing that it passed. This gate's
      # output is an absence, so a broken detector and a clean repository produce the
      # identical green tick. Points the same binary and the same .gitleaks.toml at
      # planted secrets and fails the job if any goes unseen.
      - name: Prove the gate can fail
        run: node scripts/secret-scan-selftest.js

      - name: Scan commit range
        env:
          # For a PR, scan base..head. For a push to main, scan the pushed range.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          GITLEAKS="$(node scripts/ensure-gitleaks.js)"

          # A first push to a new branch reports an all-zero "before" SHA, and a
          # force-push can leave a base that is no longer reachable. Either way,
          # fall back to scanning the full history rather than scanning nothing.
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit unavailable — falling back to a full-history scan."
            LOG_OPTS="--all"
          else
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          fi

          echo "Scanning: ${LOG_OPTS}"
          # --redact=100 so a detected secret is never printed into a public
          # Actions log, which would leak it a second time.
          "${GITLEAKS}" git \
            --log-opts="${LOG_OPTS}" \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-pr.sarif \
            --redact=100 \
            --no-banner \
            --exit-code 1

      - name: Explain failure
        if: failure()
        run: |
          echo "::error title=Secret detected::A possible credential was found in this change."
          echo "The value itself is redacted above and in the SARIF artifact."
          echo ""
          echo "If it is real:  remove it, move it to an env var, and ROTATE it."
          echo "                Assume it is compromised — this repository is public."
          echo "If it is not:   add 'gitleaks:allow' on the line, or a fingerprint"
          echo "                entry in .gitleaksignore (both are code-reviewed)."
          echo ""
          echo "See docs/SECRET_SCANNING.md"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-pr-sarif
          path: gitleaks-pr.sarif
          if-no-files-found: ignore
          retention-days: 7

  full-history:
    name: Sweep full history
    # Not on pull_request: ~4,600 commits is too slow to gate every PR, and the
    # PR job already covers what the PR adds.
    #
    # NOT ON PUSH EITHER, which is the fix for a gate that was permanently red.
    #
    # This job scans `--log-opts="--all"`, i.e. every commit reachable from EVERY REF,
    # not just the ref that triggered it. Running it on a push to main therefore let an
    # unrelated, UNMERGED work-in-progress branch fail main's required check: in Nov 2026
    # main went red for seven findings that were all false positives living only on an
    # open PR's branch, and scanning main's own commits directly returned zero. The PR
    # that owned the finding showed green while main, which did not contain the code at
    # all, showed red.
    #
    # A permanently red gate is not a gate. This repository has already written that
    # lesson down once, in backend/jest.ci.config.ts: "a gate that is permanently red is
    # not a gate: someone eventually deletes it, and then the coverage is zero rather
    # than 96%."
    #
    # Coverage is NOT narrowed to compensate. The sweep still walks every ref, so a
    # secret committed to a branch and never merged is still found; it is now reported by
    # the Monday schedule or an on-demand run instead of blocking an unrelated merge.
    # New content reaching main is still blocked by the `pull-request` job above, which
    # runs on push to main and scans the pushed range. So nothing stops being scanned --
    # a finding on somebody else's branch just stops masquerading as a defect in main.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Same reasoning as the PR job: this sweep's verdict is also an absence, and a
      # scheduled "clean" from a blind detector is the most dangerous result of all,
      # because nobody is watching a green scheduled run.
      - name: Prove the gate can fail
        run: node scripts/secret-scan-selftest.js

      - name: Scan every commit on every ref
        run: |
          set -euo pipefail
          GITLEAKS="$(node scripts/ensure-gitleaks.js)"
          "${GITLEAKS}" git \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-history.sarif \
            --redact=100 \
            --no-banner \
            --exit-code 1

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-sarif
          path: gitleaks-history.sarif
          if-no-files-found: ignore
          retention-days: 30
