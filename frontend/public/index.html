<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a365d" />
    <meta name="description" content="Colaberry Enterprise AI Leadership Accelerator — A 5-Day Executive AI Build Accelerator for Directors, VPs, and Technical Leaders. Build POCs, 90-Day Roadmaps, and Executive Decks internally." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Colaberry Enterprise AI" />
    <meta property="og:title" content="Colaberry Enterprise AI Leadership Accelerator" />
    <meta property="og:description" content="Colaberry Enterprise AI Leadership Accelerator — A 5-Day Executive AI Build Accelerator for Directors, VPs, and Technical Leaders. Build POCs, 90-Day Roadmaps, and Executive Decks internally." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Colaberry Enterprise AI Leadership Accelerator" />
    <meta name="twitter:description" content="5-Day Executive AI Build Accelerator — POC, 90-Day Roadmap, Executive Deck. Built for Directors and Technical Leaders." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/colaberry-icon.png" />

    <!-- Open Graph Image -->
    <meta property="og:image" content="%PUBLIC_URL%/colaberry-logo.png" />
    <meta name="twitter:image" content="%PUBLIC_URL%/colaberry-logo.png" />

    <!-- Canonical for crawlers that do not execute JS. SeoV2 overrides this
         per-route at runtime, but the static value is what a non-JS crawler
         indexes -- and it used to read https://www.colaberry.com/, telling search
         engines that every page of THIS site was a duplicate of another domain. -->
    <link rel="canonical" href="https://enterprise.colaberry.ai/" />
    <title>Colaberry Enterprise AI Leadership Accelerator</title>
    <script src="https://d3js.org/d3.v7.min.js" defer></script>
    <!--
      Fonts are self-hosted in src/fonts/. They used to load from
      fonts.googleapis.com here, which fired on every page BEFORE the consent
      banner was answered, handing the visitor's IP and user-agent to Google
      whatever they then chose. Same files, served from our own origin.
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
