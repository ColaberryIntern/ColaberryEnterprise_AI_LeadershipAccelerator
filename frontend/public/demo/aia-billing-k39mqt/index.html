<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Not for search engines: this page names a client, their address and their staff. -->
<title>AIA Billing</title>
<style>
  :root {
    --primary:#0060a0; --primary-dark:#004570; --primary-bg:#eaf2f8; --accent:#428bca;
    --ink:#2d3748; --muted:#718096; --border:#e2e8f0; --bg:#f7fafc; --surface:#ffffff;
    --ok:#2f7d32; --watch:#b26a00; --bad:#b3261e; --okbg:#eef8ee; --watchbg:#fff6e6; --badbg:#fdf0ef;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  button { font:inherit; cursor:pointer; }
  .bar {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:10px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20;
  }
  /* Middlesex's own bar. Their logo has a white background, so the bar is light and the brand
     blue carries through the rest of the page instead. */
  .bar { background:#fff; border-bottom:3px solid var(--primary); }
  .bar .mglogo { height:38px; width:auto; }
  .bar .app {
    font-weight:700; color:var(--primary); letter-spacing:.07em; text-transform:uppercase;
    font-size:12px; border-left:1px solid var(--border); padding-left:16px;
  }
  .bar .byline {
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--muted);
    letter-spacing:.04em; margin-left:4px;
  }
  .bar .byline img { opacity:.55; }
  .grow { flex:1; }
  .picker { display:flex; align-items:center; gap:7px; font-size:13px; }
  .picker label { color:var(--muted); font-size:11px; text-transform:uppercase;
                  letter-spacing:.07em; font-weight:700; }
  select {
    font:inherit; font-size:13.5px; padding:5px 9px; border:1px solid var(--border);
    border-radius:6px; background:var(--surface); color:var(--ink);
  }
  .wrap { max-width:1220px; margin:0 auto; padding:20px; }
  h1 { font-size:21px; margin:0 0 3px; color:var(--primary-dark); }
  h2 { font-size:16px; margin:26px 0 9px; color:var(--primary-dark); }
  .sub { color:var(--muted); font-size:13.5px; margin:0 0 16px; }
  .banner {
    background:var(--primary-bg); border-left:4px solid var(--primary);
    padding:11px 14px; border-radius:0 6px 6px 0; margin:0 0 18px; font-size:13.5px;
  }
  .cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:11px 15px; min-width:150px; flex:1;
  }
  .card .n { font-size:23px; font-weight:700; color:var(--primary); line-height:1.1; }
  .card .k { font-size:10.5px; color:var(--muted); text-transform:uppercase;
             letter-spacing:.06em; margin-top:3px; font-weight:700; }
  table { width:100%; border-collapse:collapse; background:var(--surface); font-size:13.5px; }
  th {
    text-align:left; background:#eef1f5; color:var(--ink); font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em; padding:8px 10px;
    border-bottom:2px solid var(--border); position:sticky; top:48px;
  }
  td { padding:7px 10px; border-bottom:1px solid var(--border); }
  tbody tr:hover td { background:#fbfcfe; }
  .r { text-align:right; font-variant-numeric:tabular-nums; }
  .sec td {
    background:#eef1f5; font-weight:700; font-size:11px; letter-spacing:.07em;
    text-transform:uppercase; color:var(--muted);
  }
  .chip {
    display:inline-block; padding:2px 9px; border-radius:11px; font-size:11px;
    font-weight:700; white-space:nowrap; border:1px solid;
  }
  .c-open   { background:var(--watchbg); color:var(--watch); border-color:var(--watch); }
  .c-pm     { background:#eef4fd; color:#2b6cb0; border-color:#2b6cb0; }
  .c-appr   { background:#f3eefc; color:#6b46c1; border-color:#6b46c1; }
  .c-ready  { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
  .c-sent   { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
  .c-rej    { background:var(--badbg); color:var(--bad); border-color:var(--bad); }
  .c-none   { background:#eceff3; color:#5a6676; border-color:#b6bec9; }
  .btn {
    border:1px solid var(--primary); background:var(--primary); color:#fff;
    padding:7px 15px; border-radius:7px; font-weight:600; font-size:13.5px;
  }
  .btn:hover { background:var(--primary-dark); border-color:var(--primary-dark); }
  .btn.ghost { background:var(--surface); color:var(--primary-dark); }
  .btn.ghost:hover { background:var(--primary-bg); }
  .btn.quiet { background:var(--surface); color:var(--ink); border-color:var(--border); }
  .btn.quiet:hover { background:var(--bg); }
  .btn[disabled] { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type=number] {
    font:inherit; font-size:13.5px; width:112px; text-align:right; padding:5px 8px;
    border:1px solid var(--border); border-radius:5px; font-variant-numeric:tabular-nums;
  }
  input[type=number]:focus { outline:2px solid var(--primary); outline-offset:-1px; border-color:var(--primary); }
  .edited { background:#fffbe9; border-color:#c79a1e; }
  .panel {
    background:var(--surface); border:1px solid var(--border); border-radius:9px;
    padding:16px 18px; margin-bottom:16px;
  }
  .kv { display:flex; flex-wrap:wrap; gap:0 28px; font-size:13.5px; }
  .kv div { margin-bottom:5px; }
  .kv b { color:var(--muted); font-weight:700; font-size:10.5px; text-transform:uppercase;
          letter-spacing:.06em; display:block; }
  .tabs { display:flex; gap:6px; margin:0 0 16px; flex-wrap:wrap; }
  .tab {
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    padding:7px 14px; border-radius:7px; font-size:13.5px;
  }
  .tab.on { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:600; }
  .empty { text-align:center; padding:52px 20px; color:var(--muted); }
  .empty .big { font-size:17px; color:var(--ink); font-weight:600; margin-bottom:7px; }
  .note { font-size:12.5px; color:var(--muted); margin-top:7px; }
  .money { font-variant-numeric:tabular-nums; }

  /* ---- the self-guided walkthrough ---- */
  .spot {
    position:absolute; z-index:60; pointer-events:none; border-radius:8px;
    border:3px solid var(--primary); box-shadow:0 0 0 9999px rgba(15,23,42,.55);
    transition:all .22s ease;
  }
  .tourcard {
    position:fixed; z-index:70; right:24px; bottom:24px; width:390px; max-width:calc(100vw - 32px);
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 14px 40px rgba(15,23,42,.3); padding:17px 19px;
  }
  .tourcard .tnum {
    font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--primary-dark); margin-bottom:5px;
  }
  .tourcard .ttitle { font-size:17px; font-weight:700; margin-bottom:6px; line-height:1.25; }
  .tourcard .tbody { font-size:14px; line-height:1.55; color:var(--ink); }
  .tourcard .tdo {
    margin-top:10px; background:var(--primary-bg); border-left:3px solid var(--primary);
    padding:8px 11px; border-radius:0 5px 5px 0; font-size:13.5px; font-weight:600;
  }
  .tourcard .tdo:empty { display:none; }
  .tourcard .tfoot { display:flex; gap:8px; margin-top:14px; align-items:center; }
  .tourcard #tquit { margin-left:auto; }
  body.touring .bar { z-index:10; }

  /* ---- the generated requisition, laid out to match their printed form ---- */
  .docwrap { background:#e9edf2; padding:14px; border-radius:8px; }
  .sheet {
    background:#fff; width:1056px; max-width:100%; margin:0 auto 16px; padding:20px 24px;
    font-family:'Times New Roman', Times, serif; font-size:11px; color:#000;
    box-shadow:0 1px 4px rgba(0,0,0,.14);
  }
  .sheet table { background:transparent; font-size:10.5px; font-family:inherit; }
  .sheet th, .sheet td { position:static; background:transparent; border:none; padding:1px 4px;
                         text-transform:none; letter-spacing:0; color:#000; }
  .g702head { display:flex; align-items:baseline; gap:26px; border-bottom:1.5px solid #000;
              padding-bottom:3px; margin-bottom:5px; }
  .g702head .t1 { font-size:15px; font-weight:700; letter-spacing:.01em; }
  .g702head .t2 { font-style:italic; font-size:10px; }
  .hdr, .hdr2 { width:100%; border-bottom:1.2px solid #000; margin-bottom:4px; }
  .hdr .k, .hdr2 .k { font-size:9.5px; white-space:nowrap; vertical-align:top; }
  .hdr .v, .hdr2 .v { font-size:10px; vertical-align:top; }
  .hdr .v.b, .hdr2 .v.b { font-weight:700; }
  .g702body { display:grid; grid-template-columns:1fr 1.05fr; gap:18px; margin:6px 0 8px; }
  .t3 { font-size:12.5px; font-weight:700; margin-bottom:4px; }
  .co { width:100%; border:1px solid #000; border-collapse:collapse; }
  .co td, .co th { border:1px solid #000; font-size:9.5px; padding:2px 4px; }
  .cohead { text-align:left; font-weight:700; }
  .coh { font-size:9px; text-align:center; }
  .coh2 { font-size:9px; }
  .cor { font-weight:700; text-align:right; }
  .cor2 { font-weight:700; }
  .co .amt { text-align:right; }
  .co tr.tall td { height:52px; }
  .cert { font-size:9px; line-height:1.35; margin:7px 0 0; text-align:justify; }
  .sig { margin-top:12px; font-size:10.5px; }
  .sigline { margin-top:14px; font-size:10.5px; }
  .rule { display:inline-block; border-bottom:1px solid #000; min-width:120px; height:11px; }
  .rule.short { min-width:58px; }
  .appnote { font-size:9.5px; margin-bottom:5px; }
  .nine { width:100%; }
  .nine .lbl { font-size:10px; white-space:nowrap; }
  .nine .lbl.ind { padding-left:14px; }
  .nine .sub { font-size:8.5px; padding-left:12px; }
  .nine .lead { border-bottom:1px dotted #777; width:99%; }
  .nine .dol { text-align:right; width:10px; }
  .nine .amt { text-align:right; white-space:nowrap; min-width:78px; }
  .nine .g702strong td { font-weight:700; border-top:1px solid #000; border-bottom:2px solid #000; }
  .notary { width:100%; margin-top:8px; font-size:9.5px; }
  .chk { width:100%; border:1px solid #000; border-collapse:collapse; margin-top:8px; }
  .chk th { border:1px solid #000; font-size:10px; font-weight:700; text-align:center; padding:2px; }
  .chk td { border:1px solid #000; vertical-align:top; padding:4px 6px; }
  .chkcol { width:33.3%; }
  .chknote { font-size:8px; line-height:1.3; }
  .chksub { font-weight:700; font-size:9.5px; text-decoration:underline; margin-bottom:3px; }
  .chkitem { font-size:9px; margin-top:3px; }
  .chkpair { font-size:9px; margin-bottom:5px; }
  .chkpair .rt { float:right; }
  .coding { width:100%; border-collapse:collapse; margin-top:6px; }
  .coding th, .coding td { border:1px solid #000; font-size:8.5px; text-align:center; }
  .coding tr.tall td { height:30px; }
  .g703head { display:flex; align-items:baseline; gap:20px; }
  .g703head .t1b { font-size:17px; font-weight:700; }
  .g703head .t2b { font-style:italic; font-size:11px; flex:1; text-align:center; }
  .g703head .t3b { font-size:8.5px; }
  .subhdr { width:100%; margin:3px 0 5px; border-top:1.2px solid #000; }
  .subhdr .note { font-size:8.5px; }
  .subhdr .k { text-align:right; font-size:10px; white-space:nowrap; }
  .subhdr .v { text-align:center; font-size:10px; font-weight:600; width:70px; }
  .subhdr .sc { font-size:10px; padding-top:6px; }
  .subhdr .scn { padding:0 18px; }
  table.g703 { width:100%; border-collapse:collapse; }
  table.g703 th, table.g703 td { border:1px solid #000; font-size:9px; padding:1px 3px; }
  table.g703 .ltr th { text-align:center; font-size:8px; }
  table.g703 .hd th { text-align:center; font-size:7.6px; line-height:1.15; vertical-align:top; }
  table.g703 .hd2 th { text-align:center; font-size:7.6px; line-height:1.15; }
  table.g703 .span { border-bottom:1px solid #000; }
  table.g703 .desc { font-size:9.5px; white-space:nowrap; }
  table.g703 .sec { font-weight:700; font-size:9.5px; padding-left:16px; }
  table.g703 .secrow td { border-left:1px solid #000; border-right:1px solid #000; }
  table.g703 .dol { width:8px; text-align:left; }
  table.g703 .amt { text-align:right; white-space:nowrap; }
  table.g703 .totrow td { font-weight:700; }
  table.g703 .tl { text-align:center; font-weight:700; }
  .foot { font-size:9px; margin:8px 0 0; }

  @media print {
    @page { size: letter landscape; margin: 10mm; }
    .bar, .tabs, .no-print, .panel, h1, .sub, .banner { display:none !important; }
    body { background:#fff; }
    .wrap { max-width:none; padding:0; }
    .docwrap { background:#fff; padding:0; }
    .sheet { width:auto; box-shadow:none; padding:0; margin:0; page-break-after:always; }
    .sheet:last-child { page-break-after:auto; }
  }
</style>
</head>

/* ---------- CRC32, needed for the zip entry headers ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const utf8 = (s) => new TextEncoder().encode(s);

/** Build a STORED-entry zip. Good enough for xlsx and needs no compressor. */
function zipStore(files) {
  const enc = files.map((f) => {
    const name = utf8(f.name);
    const data = typeof f.data === 'string' ? utf8(f.data) : f.data;
    return { name, data, crc: crc32(data) };
  });
  const chunks = [];
  const central = [];
  let offset = 0;
  const u16 = (n) => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = (n) => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];

  for (const e of enc) {
    const local = [].concat(
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(e.crc), u32(e.data.length), u32(e.data.length),
      u16(e.name.length), u16(0),
    );
    chunks.push(new Uint8Array(local), e.name, e.data);
    central.push([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(e.crc), u32(e.data.length), u32(e.data.length),
      u16(e.name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset),
    ));
    offset += local.length + e.name.length + e.data.length;
  }
  const cdStart = offset;
  let cdLen = 0;
  const cdChunks = [];
  central.forEach((c, i) => {
    const arr = new Uint8Array(c);
    cdChunks.push(arr, enc[i].name);
    cdLen += arr.length + enc[i].name.length;
  });
  const end = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(enc.length), u16(enc.length),
    u32(cdLen), u32(cdStart), u16(0),
  ));
  const all = chunks.concat(cdChunks, [end]);
  const total = all.reduce((a, c) => a + c.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  for (const c of all) { out.set(c, p); p += c.length; }
  return out;
}

/* ---------- sheet XML ---------- */
const xesc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const colName = (n) => {
  let s = '';
  n += 1;
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
  return s;
};

/**
 * A cell is { v, t, s } where t is 'n' or 's' and s is a style index:
 *   0 plain, 1 bold, 2 currency, 3 percent, 4 bold currency, 5 bold underlined, 6 title
 */
function sheetXml(rows, cols) {
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if (cols && cols.length) {
    x += '<cols>' + cols.map((w, i) =>
      '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>')
      .join('') + '</cols>';
  }
  x += '<sheetData>';
  rows.forEach((row, r) => {
    if (!row || !row.length) return;
    x += '<row r="' + (r + 1) + '">';
    row.forEach((cell, c) => {
      if (cell == null || cell.v == null || cell.v === '') return;
      const ref = colName(c) + (r + 1);
      const s = cell.s ? ' s="' + cell.s + '"' : '';
      if (cell.t === 'n') {
        x += '<c r="' + ref + '"' + s + '><v>' + cell.v + '</v></c>';
      } else {
        x += '<c r="' + ref + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">'
          + xesc(cell.v) + '</t></is></c>';
      }
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}

const STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'

function buildXlsx(sheets) {
  const names = sheets.map((s) => s.name);
  const files = [
    { name: '[Content_Types].xml',
      data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
        + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
        + '<Default Extension="xml" ContentType="application/xml"/>'
        + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
        + sheets.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1)
          + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
        + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
        + '</Types>' },
    { name: '_rels/.rels',
      data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
        + '</Relationships>' },
    { name: 'xl/workbook.xml',
      data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
        + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
        + names.map((n, i) => '<sheet name="' + xesc(n) + '" sheetId="' + (i + 1)
          + '" r:id="rId' + (i + 1) + '"/>').join('')
        + '</sheets></workbook>' },
    { name: 'xl/_rels/workbook.xml.rels',
      data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + names.map((n, i) => '<Relationship Id="rId' + (i + 1)
          + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet"'
          + ' Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('')
        + '<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
        + '</Relationships>' },
    { name: 'xl/styles.xml', data: STYLES_XML },
  ];
  sheets.forEach((s, i) => {
    files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml',
      data: sheetXml(s.rows, s.cols) });
  });
  return zipStore(files);
}

  ];

  const sheets = [{ name: 'G702 Application', rows: cover, cols: [46, 18] }];
  const pages = paginate(job, 28);
  const pts = pages.map((rows) => pageTotals(rows, job));
  const HEAD = [
    [sT('CONTINUATION SHEET', S_TITLE)],
    [sT('AIA DOCUMENT G703'), sT(''), sT('APPLICATION NO:', S_BOLD), sT(String(job.applicationNo))],
    [sT(job.subcontractor), sT(job.projectName, S_BOLD), sT('PERIOD TO:', S_BOLD),
      sT(job.periodTo)],

    [sT('ITEM NO.', S_BOLD), sT('DESCRIPTION OF WORK', S_BOLD), sT('SCHEDULED VALUE', S_BOLD),
      sT('FROM PREVIOUS APPLICATION', S_BOLD), sT('THIS PERIOD', S_BOLD),
      sT('MATERIALS PRESENTLY STORED', S_BOLD), sT('TOTAL COMPLETED AND STORED', S_BOLD),
      sT('%', S_BOLD), sT('BALANCE TO FINISH', S_BOLD), sT('RETAINAGE', S_BOLD)],
  ];
  pages.forEach((rows, i) => {
    const body = [];
    for (const r of rows) {
      if (r.heading) { body.push([sT(''), sT(r.heading, S_SECT)]); continue; }
      const g = G(r);
      body.push([sT(''), sT(r.description), sN(r.scheduled),
        r.prev ? sN(r.prev) : sT(''), r.thisPeriod ? sN(r.thisPeriod) : sT(''),
        r.stored ? sN(r.stored) : sT(''), g ? sN(g) : sT(''),
        r.scheduled ? sN(g / r.scheduled, S_PCT) : sT(''),
        I(r) ? sN(I(r)) : sT(''), J(r, job) ? sN(J(r, job)) : sT('')]);
    }
    const t = pts[i];
    body.push([]);
    body.push([sT(''), sT('Page ' + (i + 2) + ' Total', S_BOLD), sN(t.scheduled, S_BOLDCUR),
      sN(t.prev, S_BOLDCUR), sN(t.thisPeriod, S_BOLDCUR), sN(t.stored, S_BOLDCUR),
      sN(t.completed, S_BOLDCUR),
      sN(t.scheduled ? t.completed / t.scheduled : 0, S_PCT),
      sN(t.balance, S_BOLDCUR), sN(t.retainage, S_BOLDCUR)]);
    if (i === pages.length - 1) {
      body.push([sT(''), sT('GRAND TOTAL', S_BOLD), sN(x.scheduled, S_BOLDCUR),
        sN(x.prev, S_BOLDCUR), sN(x.thisPeriod, S_BOLDCUR), sN(x.stored, S_BOLDCUR),
        sN(x.completed, S_BOLDCUR),
        sN(x.scheduled ? x.completed / x.scheduled : 0, S_PCT),
        sN(x.balance, S_BOLDCUR), sN(x.retainage, S_BOLDCUR)]);
    }
    sheets.push({
      name: 'G703 Page ' + (i + 2),
      rows: HEAD.concat(body),
      cols: [8, 38, 15, 15, 14, 14, 16, 9, 15, 13],
    });
  });
  return buildXlsx(sheets);
}

function downloadWorkbook(job, x) {
  const bytes = requisitionWorkbook(job, x);
  const blob = new Blob([bytes], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = job.jobNo + '_' + job.projectName.replace(/[^A-Za-z0-9]+/g, '_')
    + '_REQ_' + job.applicationNo + '.xlsx';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---- the calculation engine, matching their form's own definitions ---- */
const G = (l) => l.prev + l.thisPeriod + l.stored;          // total completed and stored
const H = (l) => (l.scheduled ? G(l) / l.scheduled : 0);     // percent
const I = (l) => l.scheduled - G(l);                         // balance to finish
/**
 * Retainage, per G702 line 5: a percentage of COMPLETED WORK (columns D + E) plus a separate
 * percentage of STORED MATERIAL (column F). The first build applied one rate to column G, which
 * happens to give the same answer only while stored material is zero.
 */
const J = (l, job) => job.retainageWorkPct * (l.prev + l.thisPeriod)
  + job.retainageStoredPct * l.stored;

function totals(job) {
  const t = { scheduled:0, prev:0, thisPeriod:0, stored:0, completed:0,
    retWork:0, retStored:0, retainage:0, balance:0 };
  for (const l of job.lines) {
    t.scheduled += l.scheduled; t.prev += l.prev; t.thisPeriod += l.thisPeriod;
    t.stored += l.stored; t.completed += G(l); t.balance += I(l);
    t.retWork += job.retainageWorkPct * (l.prev + l.thisPeriod);
    t.retStored += job.retainageStoredPct * l.stored;
  }
  t.retainage = t.retWork + t.retStored;
  // Lines 1, 2 and 7 are facts about the contract and the prior certificate, not things we can
  // derive from this period's grid. They come off the cover sheet.
  t.contractSum = job.originalContract + job.netChangeOrders;
  t.earnedLessRet = t.completed - t.retainage;
  t.prevCertificates = job.previousCertificates;
  t.currentDue = t.earnedLessRet - t.prevCertificates;
  t.balancePlusRet = t.contractSum - t.earnedLessRet;
  return t;
}

/** Group the cost lines into continuation pages, repeating the section heading after a break. */
function paginate(job, perPage) {
  const pages = [];
  let cur = [];
  let section = null;
  for (const l of job.lines) {
    if (l.section !== section) {
      section = l.section;
      if (cur.length >= perPage - 2) { pages.push(cur); cur = []; }
      cur.push({ heading: section });
    }
    cur.push(l);
    if (cur.length >= perPage) { pages.push(cur); cur = []; cur.push({ heading: section }); }
  }
  if (cur.filter((r) => !r.heading).length) pages.push(cur);
  return pages;
}

function pageTotals(rows, job) {
  const t = { scheduled:0, prev:0, thisPeriod:0, stored:0, completed:0, balance:0, retainage:0 };
  for (const r of rows) {
    if (r.heading) continue;
    t.scheduled += r.scheduled; t.prev += r.prev; t.thisPeriod += r.thisPeriod;
    t.stored += r.stored; t.completed += G(r); t.balance += I(r); t.retainage += J(r, job);
  }
  return t;
}

function viewAiaDoc(job, x) {
  // 28 rows a page reproduces their own page counts exactly: Fairfield prints "of 5" and Porsche
  // "of 4", which is what their October requisitions say. 26 gave Fairfield an extra page.
  const pages = paginate(job, 28);
  const count = pages.length + 1;
  let h = '<div class="row no-print" style="margin-bottom:12px">'
    + '<button class="btn" onclick="window.print()">Print or save as PDF</button>'
    + '<button class="btn ghost" id="dlxlsx">Download the spreadsheet</button>'
    + '<span class="note" style="margin:0">Laid out to match the requisition they send today: '
    + 'landscape, the G702 cover then one continuation page per block, with the change order '
    + 'summary and the contractor checklist. This is the button Jamie described wanting.</span>'
    + '</div>'
    + '<div class="docwrap">' + g702Html(job, x);

  const pts = pages.map((rows) => pageTotals(rows, job));
  pages.forEach((rows, i) => {
    h += '<div class="sheet">' + g703Head(job, i + 2, count)
      + g703Rows(rows, job)
      + g703Total('Page ' + (i + 2) + ' Total', pts[i], job);
    if (i === pages.length - 1) {
      // The last sheet carries the recap, exactly as theirs does.
      for (let k = pages.length - 1; k >= 0; k--) {
        if (k === i) continue;
        h += g703Total('TOTAL PAGE ' + (k + 2), pts[k], job);
      }
      h += g703Total('GRAND TOTAL', {
        scheduled: x.scheduled, prev: x.prev, thisPeriod: x.thisPeriod, stored: x.stored,
        completed: x.completed, balance: x.balance, retainage: x.retainage,
      }, job);
    }
    h += G703_FOOT + '</div>';
  });
  return h + '</div>';
}

/**
 * Entry fields update the page by patching the cells that changed, NOT by re-rendering.
 *
 * Re-rendering on every edit looked fine until the prototype was driven by a browser: typing a
 * number and then clicking a button loses the click, because the field blurs, the page rebuilds,
 * and the button that was being clicked is destroyed between mousedown and mouseup. Jamie typing
 * a figure and pressing "Generate the AIA" would have hit exactly that. Patching also keeps the
 * cursor where it was and makes the row update as you type.
 */
function patchEntry(input) {
  const job = S.jobs.find((j) => j.jobNo === S.jobNo);
  if (!job) return;
  const line = job.lines.find((l) => l.id === input.dataset.id);
  if (!line) return;
  const v = parseFloat(input.value);
  line[input.dataset.f] = Number.isFinite(v) ? v : 0;
  input.classList.toggle('edited', (line.thisPeriod || 0) > 0 || (line.stored || 0) > 0);

  const set = (sel, text) => { const el = document.querySelector(sel); if (el) el.textContent = text; };
  const q = (attr) => '[data-' + attr + '="' + CSS.escape(line.id) + '"]';
  const g = G(line);
  set(q('g'), g ? money(g) : '');
  set(q('h'), line.scheduled ? pct(H(line)) : '');
  set(q('i'), I(line) ? money(I(line)) : '');
  set(q('j'), J(line, job) ? money(J(line, job)) : '');

  const x = totals(job);
  set('[data-t="prev"]', money(x.prev));
  set('[data-t="thisPeriod"]', money(x.thisPeriod));
  set('[data-t="stored"]', money(x.stored));
  set('[data-t="completed"]', money(x.completed));
  set('[data-t="pct"]', pct(x.scheduled ? x.completed / x.scheduled : 0));
  set('[data-t="balance"]', money(x.balance));
  set('[data-t="retainage"]', money(x.retainage));
  set('[data-s="completed"]', money(x.completed));
  set('[data-s="period"]', money(x.thisPeriod + x.stored));
  set('[data-s="retainage"]', money(x.retainage));
  set('[data-s="due"]', money(x.currentDue));
  save();
}

document.addEventListener('input', (e) => {
  if (e.target.dataset && e.target.dataset.f) patchEntry(e.target);
});

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'reset') { S = fresh(); return render(); }
  if (b.id === 'back') { S.jobNo = null; S.tab = 'entry'; return render(); }
  if (b.dataset.open) { S.jobNo = b.dataset.open; S.tab = 'entry'; return render(); }
  if (b.dataset.tab) { S.tab = b.dataset.tab; return render(); }
  if (b.dataset.tab2) { S.tab = b.dataset.tab2; return render(); }
  if (b.dataset.act) {
    const job = S.jobs.find((j) => j.jobNo === S.jobNo);
    job.status = b.dataset.act;
    return render();
  }
  if (b.id === 'dlxlsx') {
    const job = S.jobs.find((j) => j.jobNo === S.jobNo);
    downloadWorkbook(job, totals(job));
    return;
  }
  if (b.id === 'rollfwd') {
    // The roll-forward their spreadsheet does by hand: this period's total becomes next
    // period's "from previous", and the entry columns clear.
    for (const job of S.jobs) {
      for (const l of job.lines) { l.prev = G(l); l.thisPeriod = 0; l.stored = 0; }
      job.applicationNo += 1;
      job.status = 'period_open';
    }
    return render();
  }
});

/* --------------------------- the walkthrough ---------------------------
 * A guided tour rather than a manual, because the people who have to learn this describe
 * themselves as manual by nature and will not read a PDF. Each step puts the app into the state
 * it is talking about, spotlights the one control that matters, and says what to try. Nothing is
 * narrated that the screen is not showing.
 */
const TOUR = [
  { title: 'This replaces the spreadsheet you rebuild every month',
    body: 'You are signed in as Jamie, the accountant. Every job due to be billed this period is '
      + 'on one screen, with what each one is worth and what is owed right now.',
    target: '.cards',
    act: () => { S.role = 'acct'; S.jobNo = null; } },

  { title: 'Everyone sees the same jobs through their own door',
    body: 'There are three kinds of user: the project manager who says what got built, the '
      + 'accountant who bills it, and the owner who approves it. Change who you are signed in as '
      + 'using this box at any time.',
    target: '#role',
    act: () => { S.role = 'acct'; S.jobNo = null; } },

  { title: 'A project manager only sees their own jobs',
    body: 'Signed in as Jack Stanwood, the Porsche job has gone. He cannot see it, open it or '
      + 'bill it. Nobody has to remember to hide it from him.',
    target: '#app table',
    act: () => { S.role = 'pm'; S.jobNo = null; },
    doThis: 'Notice only Fairfield is listed now.' },

  { title: 'The project manager fills in two columns, and only two',
    body: 'This is the sheet that is printed blank and handwritten today. The description and the '
      + 'scheduled value cannot be changed here, which is exactly how it works on paper.',
    target: 'input[data-f="thisPeriod"]',
    act: () => { S.role = 'pm'; S.jobNo = '1807'; S.tab = 'entry'; },
    doThis: 'Type a number into the highlighted box. Everything to the right of it works itself out.' },

  { title: 'Stored materials have their own column',
    body: 'Material that is bought and sitting in the yard, not yet on site, is billed here rather '
      + 'than as completed work. The form keeps the two apart, and so does this.',
    target: 'input[data-f="stored"]',
    act: () => { S.role = 'pm'; S.jobNo = '1807'; S.tab = 'entry'; } },

  { title: 'The requisition is a button, not an afternoon',
    body: 'The G702 cover and every continuation page, built from the figures you just entered, '
      + 'laid out the way the general contractor already receives them.',
    target: '.docwrap',
    act: () => { S.role = 'acct'; S.jobNo = '1807'; S.tab = 'aia'; },
    doThis: 'Scroll down to see the continuation sheets, then use Print or save as PDF.' },

  { title: 'The owner approves and cannot change a figure',
    body: 'Signed in as Nick, there is nothing to type. This is the folder that walks the office '
      + 'today, except it leaves a record of who approved what and when.',
    target: '#app .panel:last-of-type',
    act: () => { S.role = 'own'; S.jobNo = '1807'; S.tab = 'entry'; } },

  { title: 'Retainage belongs to the contract',
    body: 'This job holds 5 percent. Fairfield holds none. Today that percentage is written into '
      + 'every row of the spreadsheet, which is why a cover sheet can end up disagreeing with its '
      + 'own continuation pages.',
    target: '#retrate',
    act: () => { S.role = 'acct'; S.jobNo = '1854'; S.tab = 'entry'; },
    doThis: 'Change it to 10% and watch the retainage column and the amount due move together.' },

  { title: 'Closing the month',
    body: 'This carries every line\'s total completed to date into next month\'s "from previous" '
      + 'column, clears the entry columns and moves the application number on. That column is the '
      + 'one retyped by hand today, with a note in the margin to remember to do it.',
    target: '#rollfwd',
    act: () => { S.role = 'acct'; S.jobNo = null; },
    doThis: 'Press Roll forward to November and then open a job to see what changed.' },

  { title: 'What this is, and what it is not yet',
    body: 'This is a working model of the screens and the arithmetic, running on your own October '
      + 'figures from Fairfield and Porsche Boston. Every number on the generated cover sheet '
      + 'matches the requisitions you actually sent. It does not yet have logins, a database or '
      + 'your other jobs in it. Press Start over at any time to put it back as you found it.',
    target: '#reset',
    act: () => { S.role = 'acct'; S.jobNo = null; } },
];

let tourAt = -1;

function tourShow() {
  const card = document.getElementById('tourcard');
  const spot = document.getElementById('spot');
  if (tourAt < 0 || tourAt >= TOUR.length) {
    card.hidden = true; spot.hidden = true;
    document.body.classList.remove('touring');
    return;
  }
  const step = TOUR[tourAt];
  document.body.classList.add('touring');
  if (step.act) step.act();
  render();

  card.hidden = false;
  card.querySelector('.tnum').textContent = 'Step ' + (tourAt + 1) + ' of ' + TOUR.length;
  card.querySelector('.ttitle').textContent = step.title;
  card.querySelector('.tbody').textContent = step.body;
  card.querySelector('.tdo').textContent = step.doThis || '';
  document.getElementById('tback').disabled = tourAt === 0;
  document.getElementById('tnext').textContent =
    tourAt === TOUR.length - 1 ? 'Finish' : 'Next';

  // Spotlight the control this step is about. If it is not on screen the step still reads fine,
  // so a missing target dims the page rather than throwing.
  const el = step.target ? document.querySelector(step.target) : null;
  if (!el) { spot.hidden = true; return; }
  el.scrollIntoView({ block: 'center', behavior: 'instant' });
  const r = el.getBoundingClientRect();
  spot.hidden = false;
  spot.style.top = (r.top + window.scrollY - 6) + 'px';
  spot.style.left = (r.left + window.scrollX - 6) + 'px';
  spot.style.width = (r.width + 12) + 'px';
  spot.style.height = (r.height + 12) + 'px';
}

document.getElementById('tour').addEventListener('click', () => { tourAt = 0; tourShow(); });
document.getElementById('tnext').addEventListener('click', () => { tourAt++; tourShow(); });
document.getElementById('tback').addEventListener('click', () => { tourAt--; tourShow(); });
document.getElementById('tquit').addEventListener('click', () => { tourAt = -1; tourShow(); });
window.addEventListener('resize', () => { if (tourAt >= 0) tourShow(); });

S = load();
render();
</script>
