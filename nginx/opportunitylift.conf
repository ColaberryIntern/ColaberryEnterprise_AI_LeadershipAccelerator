# opportunitylift.org — Career Pathways Network's public site.
#
# CPN's domain is opportunitylift.org, NOT cpn.org. The ecosystem seed originally named
# cpn.org, which the nonprofit does not own — it resolves to a different Cloudflare
# account. That was not cosmetic: SPF and DKIM can only be published for a domain you
# control, so mail as `@cpn.org` could never have authenticated.
#
# Like aiflotation.conf and unlike refactored.conf, there is NO `@legacy` fallback: this
# domain has never served anything, so a 404 honestly means "not built yet" rather than
# being masked by another site.
#
# TLS is terminated by Cloudflare, in CPN's OWN account — separate from both Colaberry's
# and AI Flotation's, because the nonprofit's independence is a donor and grant
# commitment. That is why this listens on 80 only and holds no certificate.

server {
    listen 80;
    server_name opportunitylift.org www.opportunitylift.org;

    root /usr/share/nginx/opportunitylift;
    index index.html;

    access_log /var/log/nginx/opportunitylift.access.log;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}

# links.opportunitylift.org — tracked-link redirects, resolved by the platform backend
# rather than served from disk. Its own server block so the public site and the redirect
# surface can never be confused for one another.
server {
    listen 80;
    server_name links.opportunitylift.org;

    access_log /var/log/nginx/opportunitylift-links.access.log;

    location / {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
