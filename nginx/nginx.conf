server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a TLS terminator, $scheme is http inside the container. Emit
    # path-relative redirects so 301s preserve the client's https scheme/host
    # (applies to the /sales-hub -> /knowledge redirect and trailing-slash redirects).
    absolute_redirect off;

    # Security headers. Any location block below that declares its own
    # add_header must re-include this file — nginx drops inherited add_headers
    # in blocks that set their own. See nginx/security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy ShipCES frontend preview (HTTPS → HTTP, avoids mixed content)
    location /preview/shipces/ {
        proxy_pass http://host.docker.internal:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        # Rewrite asset paths (NOT api paths — api.ts handles API prefixing
        # at runtime to avoid double-prefix: sub_filter + runtime both adding
        # /preview/shipces/ to API calls).
        sub_filter 'src="/assets/' 'src="/preview/shipces/assets/';
        sub_filter 'href="/assets/' 'href="/preview/shipces/assets/';
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
        # Allow iframe embedding from same origin
        proxy_hide_header X-Frame-Options;
    }

    # Proxy LandJet frontend preview (Next.js, HTTPS → HTTP)
    location /preview/landjet/ {
        proxy_pass http://host.docker.internal:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        # Rewrite Next.js asset + API paths so they route through the proxy
        sub_filter 'src="/_next/' 'src="/preview/landjet/_next/';
        sub_filter 'href="/_next/' 'href="/preview/landjet/_next/';
        sub_filter '"/api/' '"/preview/landjet/api/';
        sub_filter "'/api/" "'/preview/landjet/api/";
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
        proxy_hide_header X-Frame-Options;
    }

    # Open House live poll app (host-run service on :8090, see /opt/openhouse-live).
    # ufw allows 8090 only from 172.16.0.0/12, so the app is container-reachable
    # but not exposed to the public internet directly.
    location = /openhouse { return 301 /openhouse/; }
    # ^~ so the .png/.ico regex location below can't hijack /openhouse/logo.png
    location ^~ /openhouse/ {
        proxy_pass http://host.docker.internal:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        # BP list can be 500KB-1MB for projects with many processes
        proxy_buffer_size 16k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }

    # Dynamic preview proxy — backend resolves slug -> stack and forwards.
    # Static /preview/shipces/ and /preview/landjet/ blocks above are kept
    # for backward compat; they win on longest-prefix match. New stacks go
    # through this dynamic path via the preview_stacks table.
    location /preview/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_hide_header X-Frame-Options;
    }

    # Proxy health check to backend
    location /health {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OpenClaw tracked short URL redirects
    location /i/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # QR code scan tracking redirects
    location /qr/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with long cache
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Favicon and manifest
    location ~* \.(ico|png|webmanifest|xml|txt)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Prevent caching of index.html (SPA entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # Redirect the former /sales-hub/ path to the renamed /knowledge/ hub.
    # Preserves subpaths: /sales-hub/sales/ -> /knowledge/sales/, /sales-hub/kb.json -> /knowledge/kb.json.
    # ^~ takes precedence over the regex and SPA-fallback locations below.
    location = /sales-hub { return 301 /knowledge/; }
    location ^~ /sales-hub/ {
        rewrite ^/sales-hub/(.*)$ /knowledge/$1 permanent;
    }

    # Capstone Records — a student's shareable page at /p/<slug>.
    #
    # Default-noindex, and this is the AUTHORITATIVE control. `unlisted` is the
    # default visibility and the slug is built from the student's own name, so it
    # is readable by design and therefore guessable by design. The page is
    # something a student hands to one hiring manager; it is not something that
    # should surface when someone searches their name next to their employer's.
    #
    # The React page also injects a robots meta tag, but this is a SPA: a crawler
    # that does not execute JavaScript never sees that tag, and this header is
    # what actually holds. Do not rely on the meta tag alone.
    #
    # Blanket rather than per-record because nginx cannot know a record's
    # visibility without asking the API. Letting a deliberately `public` record be
    # indexed is a follow-up, and erring toward not-indexed is the safe direction
    # to be wrong in — the reverse is unrecoverable once a crawler has the page.
    #
    # ^~ so the .ico/.png/.txt regex location above cannot hijack a slug that
    # happens to end in one of those extensions.
    location ^~ /p/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
