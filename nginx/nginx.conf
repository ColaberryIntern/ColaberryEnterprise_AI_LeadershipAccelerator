server {
    # `default_server` is LOAD-BEARING, not decoration. nginx serves the first block it
    # loads to any Host that matches no server_name, and conf.d is included
    # ALPHABETICALLY. `server_name _` is not a catch-all — it is a name that never matches
    # a real Host header — so this block was only ever the default by being named
    # `default.conf` and sorting first.
    #
    # On 2026-08-31 adding `aiflotation.conf` broke that by sorting earlier: every
    # unmatched Host, including enterprise.colaberry.ai, started serving the AI Flotation
    # page and /api/ returned 404. Marking it explicitly means load order stops mattering
    # and no future conf file can take the default by being named "a…".
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a TLS terminator, $scheme is http inside the container. Emit
    # path-relative redirects so 301s preserve the client's https scheme/host
    # (applies to the /sales-hub -> /knowledge redirect and trailing-slash redirects).
    absolute_redirect off;

    # Security headers. Any location block below that declares its own
    # add_header must re-include this file — nginx drops inherited add_headers
    # in blocks that set their own. See nginx/security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy ShipCES frontend preview (HTTPS → HTTP, avoids mixed content)
    location /preview/shipces/ {
        proxy_pass http://host.docker.internal:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        # Rewrite asset paths (NOT api paths — api.ts handles API prefixing
        # at runtime to avoid double-prefix: sub_filter + runtime both adding
        # /preview/shipces/ to API calls).
        sub_filter 'src="/assets/' 'src="/preview/shipces/assets/';
        sub_filter 'href="/assets/' 'href="/preview/shipces/assets/';
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
        # Allow iframe embedding from same origin
        proxy_hide_header X-Frame-Options;
    }

    # Proxy LandJet frontend preview (Next.js, HTTPS → HTTP)
    location /preview/landjet/ {
        proxy_pass http://host.docker.internal:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        # Rewrite Next.js asset + API paths so they route through the proxy
        sub_filter 'src="/_next/' 'src="/preview/landjet/_next/';
        sub_filter 'href="/_next/' 'href="/preview/landjet/_next/';
        sub_filter '"/api/' '"/preview/landjet/api/';
        sub_filter "'/api/" "'/preview/landjet/api/";
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
        proxy_hide_header X-Frame-Options;
    }

    # Open House live poll app (host-run service on :8090, see /opt/openhouse-live).
    # ufw allows 8090 only from 172.16.0.0/12, so the app is container-reachable
    # but not exposed to the public internet directly.
    location = /openhouse { return 301 /openhouse/; }
    # ^~ so the .png/.ico regex location below can't hijack /openhouse/logo.png
    location ^~ /openhouse/ {
        proxy_pass http://host.docker.internal:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        # BP list can be 500KB-1MB for projects with many processes
        proxy_buffer_size 16k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }

    # Dynamic preview proxy — backend resolves slug -> stack and forwards.
    # Static /preview/shipces/ and /preview/landjet/ blocks above are kept
    # for backward compat; they win on longest-prefix match. New stacks go
    # through this dynamic path via the preview_stacks table.
    location /preview/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_hide_header X-Frame-Options;
    }

    # Proxy health check to backend
    location /health {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OpenClaw tracked short URL redirects
    location /i/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # QR code scan tracking redirects
    location /qr/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Marketing tracked-link redirects (backend/src/routes/trackedLinkRedirectRoutes.ts,
    # GET /r/:shortCode). Without this block the SPA catch-all serves index.html for every
    # short link and no click is ever recorded - found on the dev instance 2026-09-11.
    location /r/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hosted landing pages (backend/src/routes/publicLandingPageRoutes.ts,
    # GET /lp/:brand/:slug). Server-rendered HTML, the destination of social posts.
    #
    # WITHOUT THIS BLOCK THE ROUTE DOES NOT EXIST from outside. The SPA catch-all answers
    # index.html with a 200 for every landing page, so a campaign link looks like it works and
    # shows the app shell - the same failure the /r/ comment above records, and the state the
    # public host was actually in on 2026-10-02 after three PRs had shipped the renderer.
    #
    # `/lp/`, NOT `/p/`: `/p/` is already the public career portfolio (see its own block below,
    # which noindexes it). The first version of this feature used `/p/` and was therefore
    # unreachable, and its page-category rule was claiming portfolio views as landing pages.
    #
    # `^~` for the reason /m/ needs it - it stops the `\.(ico|png|...)$` and `\.(mp4|...)$`
    # regex locations below from hijacking a slug, and a slug is operator-chosen text.
    #
    # Only the CONTAINER nginx needs this. The host nginx in front of refactored.ai proxies
    # `location /` wholesale to :8888, so one routing change reaches both hostnames; a per-layer
    # setting such as client_max_body_size is the case that needs editing in both.
    location ^~ /lp/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media upload for social posts (backend/src/routes/admin/contentMediaRoutes.ts,
    # POST /api/admin/content/:id/media). nginx's default client_max_body_size is 1 MB and
    # nothing in this file raised it, so the first real PNG would have been a 413 with an
    # HTML body from the edge - multer's 10 MB / 200 MB caps never seen. A regex location
    # outranks the plain `/api/` prefix, so the raise applies to this one path and every
    # other API route keeps the default. 200m matches MAX_VIDEO_BYTES in mediaStore.ts.
    # Quoted because nginx reads a bare `{36}` as a block opener, not a quantifier.
    location ~ "^/api/admin/content/[0-9a-f-]{36}/media$" {
        client_max_body_size 200m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Scope document upload at step 1 of the project intake (backend/src/routes/sbpRoutes.ts,
    # POST /api/portal/sbp/intake/extract, L12.2). Same 1 MB trap as above: a real scope PDF
    # would 413 at the edge before multer's 25 MB cap is seen. Exact match, so only this path
    # is raised. 26m leaves room for the multipart envelope around a 25 MB file.
    location = /api/portal/sbp/intake/extract {
        client_max_body_size 26m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # ─────────────────────────────────────────────────────────────────────────────────
    # UPLOAD BODY-SIZE RAISES (LIB-5, 2026-11-19 / 11-21).
    #
    # nginx's default client_max_body_size is 1 MB and `location /api/` does not raise it,
    # so every route below refused a real file at the edge with an HTML 413 that multer
    # never saw and the uploader could not act on. Nineteen of them, found by the rewritten
    # guard in backend/src/__tests__/nginxUploadLimits.contract.test.ts.
    #
    # WHY EACH LIMIT IS THE MULTER CAP PLUS 1m, not the cap itself.
    # client_max_body_size is measured against the whole request body: the file, the
    # multipart boundaries, and any text fields sent with it. A limit set exactly equal to
    # multer's fileSize therefore refuses a file at the TOP of the range multer would have
    # accepted - and refuses it at the edge, as HTML, which is the failure this whole
    # exercise is about. The margin keeps the app's cap the binding one, so an oversized
    # file is refused BY THE APP with a JSON reason. Taken from the L12.2 intake block
    # above, whose author had already worked this out.
    #
    # An exact `location =` where the path is fixed - nginx's highest-priority match, and it
    # cannot drift. A regex with `[^/]+` and an anchor where there is an id segment; the gov
    # qualification block records what a too-narrow pattern costs. Each raise applies to one
    # path. Nothing widens `/api/`.
    # ─────────────────────────────────────────────────────────────────────────────────

    # Media library file upload (contentLibraryRoutes.ts). The LIB-3 defect: the
    # content-media block matches "^/api/admin/content/<uuid>/media$", and the library
    # upload carries no content id, so it fell through to `location /api/`. Uploading the
    # back catalogue is the POINT of the library. Cap MAX_VIDEO_BYTES = 200 MB.
    location = /api/admin/marketing/library/file {
        client_max_body_size 201m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Community room resource upload (communityRoomsRoutes.ts -> communityRoomsController).
    # STUDENT-FACING. Cap MAX_ROOM_RESOURCE_SIZE = 50 MB.
    location ~ "^/api/portal/community/rooms/[^/]+/resources/file$" {
        client_max_body_size 51m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }

    # Student work submission (participantRoutes.ts). Cap MAX_FILE_SIZE = 50 MB.
    location ~ "^/api/portal/submissions/[^/]+/upload$" {
        client_max_body_size 51m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }

    # NotebookLM export upload on a lesson (participantRoutes.ts). Cap 50 MB.
    location ~ "^/api/portal/curriculum/lessons/[^/]+/notebooklm-upload$" {
        client_max_body_size 51m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }

    # Certificate upload on a runtime card (participantRoutes.ts). Cap MAX_CERT_SIZE = 15 MB.
    # Distinct from the build-artifact block, which is its own 100m raise.
    location ~ "^/api/portal/runtime/cards/[^/]+/certificate$" {
        client_max_body_size 16m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Field guide upload on a runtime card (participantRoutes.ts). Cap
    # MAX_FIELD_GUIDE_SIZE = 5 MB - the smallest in the repo, and still five times the
    # default it was stuck behind.
    location ~ "^/api/portal/runtime/cards/[^/]+/field-guide$" {
        client_max_body_size 6m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Certification record upload (certificationRoutes.ts). Cap MAX_CERT_SIZE = 15 MB.
    location = /api/portal/certifications {
        client_max_body_size 16m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Signed internship document (participantRoutes.ts). Cap MAX_SIGNED_DOC_SIZE = 25 MB.
    location ~ "^/api/portal/internship/documents/[^/]+/signed$" {
        client_max_body_size 26m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Community media upload (participantRoutes.ts). Cap MAX_COMMUNITY_MEDIA_SIZE = 8 MB.
    # A phone photo clears 1 MB without trying, which is why this one bit quietly.
    location = /api/portal/community/upload {
        client_max_body_size 9m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Strategy-prep upload, the PUBLIC token flow (strategyPrepRoutes.ts). Cap 50 MB.
    # Unauthenticated by design - the token is the authorisation - so multer's cap and the
    # fileFilter remain the only gates, and both still apply.
    location ~ "^/api/strategy-prep/[^/]+/upload$" {
        client_max_body_size 51m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }

    # Staff-side submission upload (acceleratorRoutes.ts). Cap 50 MB.
    location ~ "^/api/admin/accelerator/submissions/[^/]+/upload$" {
        client_max_body_size 51m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }

    # Explorer knowledge document ingest (explorerKnowledgeRoutes.ts, a template-literal
    # path). Cap MAX_INGEST_BYTES = 20 MB.
    location = /api/admin/explorer-growth/knowledge/documents {
        client_max_body_size 21m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Solicitation .zip ingest for a delivery contract (factoryRoutes.ts). Cap 25 MB. A
    # Bonfire solicitation zip is routinely over 1 MB - the same failure the qualification
    # block was added for.
    location ~ "^/api/admin/factory/contract/[^/]+/ingest-proposal$" {
        client_max_body_size 26m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }

    # Company dossier document upload (govCompanyDossierRoutes.ts). Cap MAX_BYTES = 20 MB.
    # The GET on the same path is unaffected: a body limit only applies to a request that
    # carries a body.
    location = /api/admin/factory/dossier/documents {
        client_max_body_size 21m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Proposal source upload (govProposalSourceRoutes.ts, mounted on a BASE constant). Cap
    # MAX_BYTES = 20 MB. Anchored so the sibling .../sources/:id/approve is NOT raised - it
    # carries no file.
    location ~ "^/api/admin/gov-contracts/[^/]+/sources$" {
        client_max_body_size 21m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Signed form copy for a proposal package (govContractsRoutes.ts). Cap
    # MAX_SIGNED_DOC_SIZE = 25 MB. Two id segments, both a non-slash run, anchored so it
    # cannot swallow the rest of the package tree.
    location ~ "^/api/admin/gov-contracts/[^/]+/package/signatures/[^/]+$" {
        client_max_body_size 26m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Flotation intake document (flotationIntakeRoutes.ts). Cap MAX_INTAKE_DOC_SIZE = 15 MB.
    location = /api/admin/flotation/intake/document {
        client_max_body_size 16m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Comms Hub event photo (commsHubPhotoRoutes.ts). Shipped 2026-11-20, after the first
    # pass of this work, and caught by the rewritten guard rather than by a person. Cap is
    # MAX_IMAGE_BYTES + 1 = 10 MB, deliberately one byte over so the APP produces the
    # "over the limit" message rather than the edge.
    location ~ "^/api/admin/comms-hub/events/[^/]+/photos$" {
        client_max_body_size 11m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Comms Hub thumbnail upload (commsHubThumbnailRoutes.ts). Same 10 MB image cap. Only
    # the /upload path carries multer - the sibling /:thumbId/change does not, so it is not
    # raised and does not need to be.
    location ~ "^/api/admin/comms-hub/events/[^/]+/thumbnails/upload$" {
        client_max_body_size 11m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # A client's own research on the Enterprise intake (backend/src/routes/leadRoutes.ts,
    # POST /api/enterprise/intake/:token/files, v2 2026-11-21). Ali approved raising ONLY this
    # path to 25 MB: research decks and PDFs would 413 at the 1 MB default. The token is the
    # intake's UUID, so the regex is anchored and matches nothing else. 26m leaves room for the
    # multipart envelope; the backend refuses anything over 25 MB with a readable JSON 413.
    # Quoted because nginx reads a bare `{36}` as a block opener, not a quantifier.
    location ~ "^/api/enterprise/intake/[0-9a-f-]{36}/files$" {
        client_max_body_size 26m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # ZIP uploads for the government qualification workspace (backend/src/routes/admin/
    # govQualificationRoutes.ts: POST .../extract-requirements, .../review-documents, and
    # .../attest-zip). Same trap as the content-media path above: without this the default 1 MB
    # limit 413s a real Bonfire solicitation ZIP at the edge, before multer's 100 MB cap is ever
    # seen (extract seen live 2026-10-02; attest-zip seen live 2026-10-05 — it was added AFTER this
    # block and missed the list). The opportunity key is op:gov:<hex> OR gws:<uuid>, so match any
    # non-slash id segment. A regex location outranks the `/api/` prefix, so only these upload
    # paths are raised; every other API route keeps 1 MB. 100m matches the multer fileSize cap.
    location ~ "^/api/admin/factory/qualification/[^/]+/(extract-requirements|review-documents|attest-zip)$" {
        client_max_body_size 100m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Outside case-study intake (backend/src/routes/admin/caseStudyOutsideIntakeRoutes.ts,
    # POST /api/admin/factory/case-studies/external). Same 1 MB trap as the blocks above: a real
    # whitepaper deck is several MB, so without this every upload 413s at the edge. multer allows
    # 4 files x 50 MB (config/caseStudyExternalUpload.ts), hence 200m. Drive imports send only JSON.
    location = /api/admin/factory/case-studies/external {
        client_max_body_size 200m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Build-lab artifact upload (backend/src/routes/participantRoutes.ts,
    # POST /api/portal/runtime/cards/:cardId/build-artifact). The THIRD instance of the
    # same trap as the two blocks above, and the first one to hit students rather than
    # staff: Weeks 5 and 7 ask for a screen recording, multer caps at 100 MB to match
    # GitHub's file limit, and nginx's 1 MB default 413'd every one of them at the edge
    # before the backend saw a byte. Verified against the running container on
    # 2026-10-08 and again on 2026-10-12 — 900 KB reached auth, 2 MB did not.
    #
    # The HOST nginx (/etc/nginx/sites-enabled/refactored, not in this repo) already
    # allows 200m on its `location /`, so this container block is the only gate left.
    # Checked before editing rather than assumed; a raise here with the host still at
    # 1 MB would have looked fixed and changed nothing.
    #
    # A regex location outranks the plain `/api/` prefix, so only this path is raised
    # and every other API route keeps the 1 MB default. `[^/]+` for the card id because
    # it is not always a bare uuid. 100m matches the multer fileSize cap exactly: a
    # file between the two limits should be refused by the backend with a readable
    # error, never by nginx with an HTML 413 the student cannot interpret.
    location ~ "^/api/portal/runtime/cards/[^/]+/build-artifact$" {
        client_max_body_size 100m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Agent attachments (backend/src/routes/participantRoutes.ts,
    # POST /api/portal/agent-attachments) — what a student or an agent hands to Cory or
    # Reese. The FOURTH instance of the same trap, reported from the Gov Contracts build
    # on 2026-10-27: "the upload endpoint still refuses files over about 1 MB, though it
    # is documented as 10 MB". That is exactly multer's MAX_AGENT_ATTACHMENT_SIZE meeting
    # nginx's 1 MB default. The workaround in use was one image per post with the rest of
    # the evidence linked, for weeks, because the 413 is an HTML page from the edge that
    # never reaches the backend and says nothing useful.
    #
    # A regex location outranks the plain `/api/` prefix, so only this path is raised and
    # every other API route keeps the 1 MB default. 10m matches MAX_AGENT_ATTACHMENT_SIZE
    # exactly: a file between the two limits is then refused by the backend with a readable
    # message ("Attach an image (PNG, JPG, WEBP, GIF) or a PDF."), never by nginx.
    #
    # The route takes no path parameter, so the pattern is anchored at both ends rather
    # than using `[^/]+` like the blocks above.
    location ~ "^/api/portal/agent-attachments$" {
        client_max_body_size 10m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # A Career Prep "Try" answer (backend/src/controllers/careerPrepAttemptController.ts, POST
    # /api/portal/career-prep/sessions/<id>/attempts, Career Prep v27 CP4.4). Same 1 MB trap as the intro video
    # below; 100m matches PREP_ATTEMPT_MAX_BYTES and the Cloudflare edge limit. The upload is answered at once
    # (scoring runs in the background), so the default read timeout is enough.
    location ~ "^/api/portal/career-prep/sessions/[0-9a-fA-F-]+/attempts$" {
        client_max_body_size 100m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # A Hire candidate's intro video (backend/src/controllers/hireVideoController.ts, POST
    # /api/portal/career/portfolio-page/hire-video, kit §3.2). Same 1 MB trap as above. 100m
    # matches HIRE_VIDEO_MAX_BYTES and the Cloudflare edge limit, so an oversized file gets the
    # backend's readable 413, not an HTML one. The read timeout covers the transcode (capped at
    # 180s in hireVideoTranscode.ts) plus the poster. GET/PUT/DELETE on the same path are small
    # and pass through here harmlessly.
    location ~ "^/api/portal/career/portfolio-page/hire-video$" {
        client_max_body_size 100m;
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Signed media fetch for social posts (backend/src/routes/mediaFetchRoutes.ts,
    # GET /m/<brand>/<sha256>.<ext>?e=&s=). The consumer is a provider fetching an image at
    # publish time. `^~` is required, not decorative: the `\.(png|jpe?g|...)$` and
    # `\.(mp4|...)$` regex locations below would otherwise win on the extension and answer
    # with a static-file 404 - which is exactly what the public host did on the first deploy,
    # 2026-09-15, while the backend route answered correctly when reached directly.
    location ^~ /m/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bodies never flow here (GET only), but a 200 MB video does flow OUT. Do not buffer
        # it through nginx's temp files; stream it.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # Signed inline replay playback (backend/src/routes/broadcastMediaRoutes.ts,
    # GET /bm/broadcast/<occurrenceId>/<asset>?e=&s=). A <video> element cannot send a
    # Bearer header, so it authenticates by the HMAC in the URL.
    #
    # `^~` for exactly the reason the /m/ block above records, and this is not a guess:
    # `\.vtt$` and `\.(mp4|webm|m4a)$` below are REGEX locations, and in nginx a regex
    # location beats a prefix location unless the prefix carries `^~`. Without it,
    # /bm/broadcast/<uuid>/replay.mp4 is answered `try_files $uri =404` out of the static
    # root and handed `Cache-Control: public` plus `Access-Control-Allow-Origin: *` - the
    # opposite of the `private, max-age=60` the route sets - and the backend never sees the
    # request. The only difference between this block and the /m/ one is that this was found
    # before the first deploy instead of after it.
    #
    # Declares no add_header, so the server-level security headers are inherited (see the
    # include near the top of this file: a block that sets its own must re-include them).
    location ^~ /bm/ {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A class recording is measured in gigabytes and is delivered in ranges. Buffering
        # would spool each range through nginx's temp files before the player saw a byte, so
        # a seek would feel like a stall. Range and If-Range are forwarded by default; they
        # are deliberately not restated here, because a directive that changes nothing is a
        # directive the next reader has to verify.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # Static assets with long cache
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Favicon, manifest, and the shared brand images under /site-v2/.
    #
    # THE CORS HEADER IS FOR THE VIDEO POSTER, and it is not optional. The walkthrough
    # player carries `crossorigin="anonymous"` so a cross-origin caption track will load —
    # and that attribute applies to EVERY resource the media element fetches, the `poster`
    # included. With the header on the .vtt and the .mp4 but not on the poster image, the
    # poster is blocked, the element errors, and the TRACK never loads either: the symptom
    # shows up as missing captions while the actual failure is an image. That is what it
    # did on training.colaberry.com.
    #
    # `jpe?g` added for the same reason — a poster is as likely to be a jpg as a png, and
    # jpgs were falling through to the SPA fallback rather than matching here at all.
    location ~* \.(ico|png|jpe?g|webp|svg|webmanifest|xml|txt)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # WebVTT caption tracks, for the narrated walkthrough on a case-study record.
    #
    # THE MIME TYPE IS THE WHOLE POINT. nginx's bundled mime.types has no entry for .vtt,
    # so it fell back to `default_type` and served `application/octet-stream`. A `track`
    # element pointed at that is rejected by the browser and the captions silently never
    # appear — the file returns 200 the whole time, which is why this is worth pinning
    # rather than assuming. `add_header` here means security-headers.conf must be
    # re-included: nginx drops inherited add_headers in any block that sets its own.
    location ~* \.vtt$ {
        types { } default_type text/vtt;
        expires 7d;
        add_header Cache-Control "public";
        # A CROSS-ORIGIN `track` NEEDS CORS, and this file is loaded by two other brands.
        # The walkthrough player renders on training.colaberry.com and aiflotation.com,
        # which fetch this caption file from the platform origin. Without this header the
        # browser refuses the track: `HTMLTrackElement.readyState` goes to 3 (ERROR), the
        # cue list stays empty, and the video plays with no captions at all — while the
        # file itself returns a perfectly healthy 200 to anything that just checks status.
        # Safe to open: these are the published captions of a public case study.
        add_header Access-Control-Allow-Origin "*";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # The walkthrough video itself, for the same reason. `crossorigin="anonymous"` on the
    # player — required before a cross-origin track is honoured — turns the MEDIA fetch
    # into a CORS request too, so the mp4 has to allow it or the video stops loading on
    # the two other brands. The header and the attribute are one change, not two.
    location ~* \.(mp4|webm|m4a)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Prevent caching of index.html (SPA entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # Redirect the former /sales-hub/ path to the renamed /knowledge/ hub.
    # Preserves subpaths: /sales-hub/sales/ -> /knowledge/sales/, /sales-hub/kb.json -> /knowledge/kb.json.
    # ^~ takes precedence over the regex and SPA-fallback locations below.
    location = /sales-hub { return 301 /knowledge/; }
    location ^~ /sales-hub/ {
        rewrite ^/sales-hub/(.*)$ /knowledge/$1 permanent;
    }

    # Capstone Records — a student's shareable page at /p/<slug>.
    #
    # Default-noindex, and this is the AUTHORITATIVE control. `unlisted` is the
    # default visibility and the slug is built from the student's own name, so it
    # is readable by design and therefore guessable by design. The page is
    # something a student hands to one hiring manager; it is not something that
    # should surface when someone searches their name next to their employer's.
    #
    # The React page also injects a robots meta tag, but this is a SPA: a crawler
    # that does not execute JavaScript never sees that tag, and this header is
    # what actually holds. Do not rely on the meta tag alone.
    #
    # Blanket rather than per-record because nginx cannot know a record's
    # visibility without asking the API. Letting a deliberately `public` record be
    # indexed is a follow-up, and erring toward not-indexed is the safe direction
    # to be wrong in — the reverse is unrecoverable once a crawler has the page.
    #
    # ^~ so the .ico/.png/.txt regex location above cannot hijack a slug that
    # happens to end in one of those extensions.
    location ^~ /p/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;

        # Serve the SPA shell WITHOUT try_files' internal redirect.
        #
        # `try_files $uri $uri/ /index.html` was here first, and it silently
        # discarded the X-Robots-Tag above. try_files' fallback performs an
        # INTERNAL REDIRECT to /index.html, which re-runs location matching and
        # lands in `location = /index.html` — and that block declares its own
        # add_header directives, so nginx drops every inherited one, exactly as
        # the note at the top of this file warns. The header was present in the
        # config, the config was present in the container, and the response
        # still had no robots tag.
        #
        # Confirmed in production rather than reasoned about: the reply carried
        # Pragma and Expires, which ONLY the /index.html block sets, and carried
        # no X-Robots-Tag.
        #
        # `rewrite ... break` stops rewrite processing and serves the file from
        # THIS location, so these headers survive. Nothing real lives under /p/
        # — every asset is served from /static/ — so rewriting the whole prefix
        # to the shell costs nothing.
        rewrite ^ /index.html break;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
