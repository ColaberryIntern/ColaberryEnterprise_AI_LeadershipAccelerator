# refactored-preview.colaberry.ai — the redirect, where it can actually be tested.
#
# WHY THIS HOSTNAME STILL EXISTS NOW THAT THERE IS NOTHING TO PREVIEW. It used to serve
# the ported marketing pages so they could be compared against the live site before a
# cutover. The 2026-09-07 decision retired the old portal instead of redesigning it, so
# there is no rebuild to look at — but the redirect itself still needs somewhere to be
# verified, and refactored.ai is not available for that. Its DNS still points at the
# legacy AWS load balancer and moving it needs credentials for an AWS account nobody has
# confirmed holding.
#
# This hostname IS ours: colaberry.ai sits behind Cloudflare, which terminates TLS and
# talks to this server over port 80 like every other name in this directory. So the exact
# redirect that refactored.ai will perform can be exercised here today, before any DNS
# moves. Keeping the two blocks identical in behaviour is the entire point — a cutover
# verified on a hostname that behaves differently is not verified at all.

server {
    # Named explicitly, and never `default_server`; nginx.conf owns that.
    listen 80;
    server_name refactored-preview.colaberry.ai;

    access_log /var/log/nginx/refactored-preview.access.log;

    # Kept from the preview-of-a-site era and still correct: this hostname must never be
    # indexed. It now redirects to a page that SHOULD rank, and letting a crawler discover
    # the accelerator through a colaberry.ai staging name is how the destination ends up
    # with a duplicate entry point competing against its own canonical URL.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Served before the catch-all below, so crawlers get the exclusion rather than being
    # bounced to the destination and never reading it.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Identical to nginx/refactored.conf, deliberately — same code, same destination, same
    # query-string handling. See that file for why every path lands on `/`.
    location / {
        return 301 https://enterprise.colaberry.ai/$is_args$args;
    }
}
