# refactored-preview.colaberry.ai — where the rebuilt Refactored.ai site can be seen.
#
# WHY A COLABERRY SUBDOMAIN AND NOT refactored.ai ITSELF. This container terminates no
# TLS. Every hostname it serves listens on port 80 because Cloudflare sits in front and
# handles HTTPS. `colaberry.ai` is behind Cloudflare, so this hostname works today with no
# certificate work at all.
#
# `refactored.ai` is the one Colaberry domain NOT behind Cloudflare — Route 53 straight to
# AWS. Pointing it here would refuse every HTTPS request. That is why the production plan
# for refactored.ai puts the built site in S3 behind CloudFront with an ACM certificate,
# rather than sending its traffic to this box. See
# docs/architecture/multi-tenancy/REFACTORED_CUTOVER.md.
#
# So this hostname is not a staging copy of a site served elsewhere. It is the ONLY place
# the new site is served from until that AWS work is done, which is exactly why it must
# not be indexed: two hostnames serving the same content is the standard way to lose the
# real domain's ranking to its own preview.

server {
    # Named explicitly, never `default_server`. nginx.conf owns that, and a brand config
    # that relies on being first silently captures unrelated traffic when include order
    # changes.
    listen 80;
    server_name refactored-preview.colaberry.ai;

    root /usr/share/nginx/refactored;
    index index.html;

    access_log /var/log/nginx/refactored-preview.access.log;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Served before the catch-all so crawlers read the exclusion rather than a page.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Every page is a directory with an index.html, so `$uri/` resolves them. The `=404`
    # is deliberate: a missing page here must look missing. Falling back to index.html
    # would render the homepage under a wrong URL and hide a broken link from the very
    # review this hostname exists to support.
    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprinted by the build (`?v=<hash>`), so a long cache is safe: changing a file
    # changes its URL. `try_files` performs an internal redirect that would DISCARD an
    # add_header set in an outer block, which is why these live in the location that
    # actually serves the response.
    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
