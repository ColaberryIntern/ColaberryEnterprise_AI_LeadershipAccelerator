# Preview of the rebuilt refactored.ai, on a subdomain we already control.
#
# WHY A SUBDOMAIN AND NOT A /preview/ PATH. The ported pages use root-relative links
# (`/individuals/`, `/assets/track-v2.js`) because they are a faithful copy of a site that
# lives at a domain root. Served under `/preview/refactored/`, every one of those links
# would resolve to the platform's own root instead — the page would render and every link
# would be wrong. The existing shipces preview papers over this with `sub_filter` rewriting,
# which works for one app's asset paths but not for a whole site's navigation.
#
# A subdomain costs one DNS record and makes the problem disappear: the site is at a root,
# so its links are correct without rewriting anything.
#
# TLS comes free here because colaberry.ai is already behind Cloudflare, which terminates
# HTTPS and talks to this server over port 80 — the same arrangement every other hostname
# in this file uses. That is deliberately NOT how the real cutover will work; refactored.ai
# is on Route 53 with no Cloudflare in front, which is the open decision recorded in
# docs/architecture/multi-tenancy/REFACTORED_CUTOVER.md.
#
# This block is a PREVIEW ONLY. It serves the rebuilt pages and nothing else — no proxy
# fallback to the legacy origin, so a 404 here means "not yet rebuilt" rather than quietly
# showing the old site and hiding what is missing.

server {
    listen 80;
    server_name refactored-preview.colaberry.ai;

    root /usr/share/nginx/refactored-preview;
    index index.html;

    access_log /var/log/nginx/refactored-preview.access.log;

    # Not indexed: this is a staging copy of a live site, and two hostnames serving the
    # same content is the classic way to lose the original's search ranking to its own
    # preview.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # `$uri.html` so /individuals resolves to individuals.html, matching how the real site
    # serves /individuals/ — the ported pages keep their original link structure.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }
}
