# hire.refactored.ai - the case-study-gated talent directory.
#
# HOW TLS WORKS FOR THIS HOSTNAME. refactored.ai is on Route 53, not Cloudflare, and this
# container terminates no TLS. The HOST nginx in front of it does, exactly as it already
# does for www.refactored.ai: /etc/nginx/sites-enabled/hire-refactored on the box holds a
# Let's Encrypt certificate (certbot --dns-route53) and proxies to 127.0.0.1:8888 with
# `Host` passed through, so the request lands on THIS server block. Ali chose this
# 2026-11-06 ("use something that is easy to setup from there"). That host file is not in
# this repository, like the www.refactored.ai one.
#
# ALWAYS LIVE. People, portfolios and case studies are created and withdrawn in the admin,
# not by a deploy, so none of their paths exist as files. Everything under /talent/ and
# /case-studies/ that is not a real file falls through to ONE shell, which reads the slug
# from the path and asks the platform API. An unknown slug and an unlisted one get the
# same not-found page, so a person's name cannot be probed.
#
# THE OLD SITE'S API IS RETIRED, LOUDLY. The legacy app.colaberry estate may still call
# https://hire.refactored.ai/ws-post-job and friends (research brief S12). Those callers
# get a fast 410 JSON instead of this site's HTML - an HTML shell answering an API client
# with 200 would look like success. /api/ is answered the same way: this host serves no
# API; the shells call the platform's API on its own origin.

server {
    listen 80;
    server_name hire.refactored.ai;

    root /usr/share/nginx/hire-refactored;
    index index.html;

    access_log /var/log/nginx/hire-refactored.access.log;

    # Server-level headers. Re-included in every location below that sets its own
    # add_header, because nginx does not inherit add_header into such a location.
    include /etc/nginx/security-headers.conf;

    location ~ ^/ws- {
        include /etc/nginx/security-headers.conf;
        default_type application/json;
        return 410 '{"error":"retired"}';
    }

    location ^~ /api/ {
        include /etc/nginx/security-headers.conf;
        default_type application/json;
        return 410 '{"error":"retired"}';
    }

    # Anything that is not a page gets the site's own not-found page, never nginx's.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # The bare collections are not pages. With `$uri/` in try_files they matched the
    # directory, found no index and answered a plain 403 (production verification,
    # 2026-11-09); they now send the reader to that section of the directory.
    location = /talent/ {
        return 302 "/#talent";
    }
    location = /case-studies/ {
        return 302 "/#published";
    }

    # /talent/<slug>/ -> the portfolio shell. The shell itself carries
    # <meta name="robots" content="noindex"> until the API says the person is public.
    # No `$uri/`: the only directory under here is the shell's own.
    location ^~ /talent/ {
        try_files $uri /talent/record/index.html;
    }

    # /case-studies/<slug>/ -> the case-study shell (always opened in a new tab).
    location ^~ /case-studies/ {
        try_files $uri /case-studies/record/index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
