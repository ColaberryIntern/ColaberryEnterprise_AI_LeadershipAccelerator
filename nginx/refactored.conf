# refactored.ai — front door served here, everything else proxied to the legacy origin.
#
# NOT YET DEPLOYED. This is the configuration the cutover would use; it is committed for
# review before any DNS moves. See docs/architecture/multi-tenancy/REFACTORED_CUTOVER.md.
#
# WHY A PROXY RATHER THAN A CLEAN TAKEOVER. refactored.ai is not a marketing site with the
# app hosted elsewhere — the entire learning platform is on this one hostname. /signin,
# /signup, /dashboard, 193 /course/ pages and 1,715 /learn/ pages all return 200 there
# today. Pointing DNS here and serving only the rebuilt marketing pages would 404 every
# student login and all 1,908 content pages. So this serves the pages we have rebuilt and
# passes everything else through untouched. Each page moves from "proxied" to "ours" as it
# is redesigned, and rollback at any point is one line rather than a DNS propagation wait.

# NO `upstream` BLOCK, AND NO IP ADDRESS — both would be wrong here.
#
# The origin is not an EC2 instance. `refactored.ai` and `www` are Route 53 ALIAS records
# to a Network Load Balancer:
#
#     refactored-nlb-prod-2edb9df08b1ba450.elb.us-west-2.amazonaws.com
#
# 54.218.30.47 is merely what that NLB resolves to right now. **NLB addresses rotate**, so
# an earlier version of this file that hardcoded the IP would have passed every test and
# then failed silently, weeks later, the first time AWS moved it. That is the worst kind of
# bug: it works when you check it.
#
# nginx resolves names in `proxy_pass` ONCE at startup when the name is a literal, which
# would reintroduce the same staleness. Assigning the hostname to a variable forces
# resolution at request time, honouring the resolver TTL below.
#
# Proxying by NAME is also safe here, unlike proxying to `refactored.ai` itself: the NLB
# hostname always means the load balancer, whereas `refactored.ai` would resolve to *us*
# after the cutover and loop until nginx ran out of workers.

server {
    listen 80;
    server_name refactored.ai www.refactored.ai;

    # Both hostnames are served, not redirected. They are separate A records serving the
    # page independently today, and `brand_domains` now carries a row for each, so traffic
    # on either attributes to the refactored brand rather than silently resolving to none.

    root /usr/share/nginx/refactored;
    index index.html;

    access_log /var/log/nginx/refactored.access.log;
    error_log  /var/log/nginx/refactored.error.log;

    # Rebuilt pages, served from disk. Anything not found here falls through to @legacy.
    #
    # `try_files` performs an INTERNAL REDIRECT into the fallback, which discards
    # `add_header` directives set in this block. Any header that must survive belongs in
    # the location that finally serves the response, not here.
    location / {
        try_files $uri $uri/ $uri.html @legacy;
    }

    # The tracker ships with the app build.
    location /assets/ {
        try_files $uri @legacy;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Everything we have not rebuilt: the whole learning platform, the login, the course
    # catalogue. Passed through so that taking over the front door costs nothing.
    location @legacy {
        # Public resolver with a short TTL, so a rotated NLB address is picked up within
        # 30 seconds rather than at the next nginx restart.
        resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
        resolver_timeout 5s;

        # The variable is what forces per-request resolution; a literal hostname here
        # would be resolved once at startup and then cached for the process lifetime.
        set $refactored_legacy refactored-nlb-prod-2edb9df08b1ba450.elb.us-west-2.amazonaws.com;
        proxy_pass https://$refactored_legacy;

        # The origin serves by name and its certificate is issued for the public
        # hostname, so both the Host header and the TLS SNI name must say who we are
        # asking for. The NLB terminates TLS with an ACM certificate for the public
        # names, NOT for its own elb.amazonaws.com hostname — so without proxy_ssl_name
        # the handshake would be verified against the wrong name and fail.
        proxy_set_header Host              www.refactored.ai;
        proxy_ssl_name                     www.refactored.ai;
        proxy_ssl_server_name              on;
        proxy_ssl_verify                   on;
        proxy_ssl_trusted_certificate      /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Bounded, so a slow origin degrades this hostname rather than exhausting workers.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # The origin sets its own redirects and cookies against its own hostname; since we
        # present the same hostname to it, they pass through correctly without rewriting.
        proxy_redirect off;
    }

    # Do not let the legacy origin's 404 page be cached as though it were ours.
    location = /50x.html { internal; }
}
