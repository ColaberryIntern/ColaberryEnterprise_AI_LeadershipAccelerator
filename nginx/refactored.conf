# refactored.ai — retired. Every request redirects to the Enterprise accelerator.
#
# NOT YET IN EFFECT. This block only runs once refactored.ai's DNS points here, and it
# does not today: the apex and `www` are Route 53 ALIAS records to an AWS Network Load
# Balancer that still serves the legacy learning platform. Moving them needs credentials
# for that AWS account, which nobody has confirmed holding. Until then this file is the
# committed intent, and `refactored-preview.colaberry.ai` is where the behaviour can
# actually be observed — that hostname IS ours, and it runs the identical redirect.
#
# WHY A REDIRECT AND NOT A SITE. An earlier revision of this file proxied everything it
# had not rebuilt to the legacy origin, so the front door could be taken over one page at
# a time without 404ing students. That design was correct for "keep the platform alive
# while we redesign it". The decision on 2026-09-07 was the opposite one: retire the old
# portal outright and send its traffic to the accelerator. A proxy that keeps the legacy
# platform reachable is the wrong shape for that, so it is gone rather than left dormant.
#
# WHAT THIS DELIBERATELY BREAKS. The legacy platform's Auth0 sign-in, the student
# dashboard, and roughly 1,900 `/course/` and `/learn/` pages all answer on this hostname
# today. After the DNS move they stop answering. That is the intended outcome, not an
# oversight — but it is the reason this file is worth reading before it ships.
#
# WHY EVERY PATH LANDS ON `/` AND NOT ITS COUNTERPART. enterprise.colaberry.ai is a
# single-page React app with a catch-all route, so EVERY path there returns 200 whether or
# not it exists. `/individuals`, `/organizations` and `/enterprise` all answered 200 when
# checked on 2026-09-07 and none of them is a real route — they were the catch-all. A
# path-preserving map would therefore have looked correct in testing and delivered every
# visitor to a not-found component. Sending everyone to the root is the honest mapping
# until someone chooses real destinations per audience.

server {
    # Both hostnames, named explicitly. Never `default_server` — nginx.conf owns that, and
    # a brand config that relies on being first silently captures unrelated traffic when
    # the include order changes.
    listen 80;
    server_name refactored.ai www.refactored.ai;

    access_log /var/log/nginx/refactored.access.log;
    error_log  /var/log/nginx/refactored.error.log;

    # `$is_args$args` keeps the query string, so a campaign's `?utm_source=…` survives the
    # hop and the visit still attributes. Dropping it would make every redirected arrival
    # look like direct traffic.
    #
    # 301 rather than 302: this is permanent, and a permanent code is what gets search
    # engines to transfer the old hostname's authority instead of indexing both forever.
    location / {
        return 301 https://enterprise.colaberry.ai/$is_args$args;
    }
}
