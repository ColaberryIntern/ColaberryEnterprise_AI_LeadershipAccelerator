# aiflotation.com — AI Flotation's public site.
#
# SIMPLER THAN refactored.conf ON PURPOSE. There is no legacy origin to proxy to: this
# domain was registered 2026-08-31 and has never served anything. So there is no fallback
# and no `@legacy` block — a 404 here means "not built yet", which is the honest answer,
# rather than being quietly masked by someone else's site.
#
# TLS is terminated by Cloudflare (the zone is proxied, in AI Flotation's OWN Cloudflare
# account — deliberately not Colaberry's, to keep the entity boundary clean). That is why
# this listens on 80 only and holds no certificate, unlike refactored.conf which had to
# terminate TLS itself because refactored.ai stayed on Route 53.

server {
    listen 80;
    server_name aiflotation.com www.aiflotation.com;

    root /usr/share/nginx/aiflotation;
    index index.html;

    access_log /var/log/nginx/aiflotation.access.log;

    # Directory-style URLs, matching how the pages are laid out. `$uri.html` is kept for
    # flat pages so a future page can be added either way without a config change.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}

# links.aiflotation.com — tracked-link redirects.
#
# Declared in brand_domains as this brand's `tracking` hostname but never existed in DNS
# until today. Tracked links are minted and resolved by the platform backend (the same
# code behind /i/ and /qr/ on the main site), so this hostname is proxied there rather
# than served from disk. Kept as its own server block so the marketing site and the
# redirect surface can never be confused for one another.
server {
    listen 80;
    server_name links.aiflotation.com;

    access_log /var/log/nginx/aiflotation-links.access.log;

    location / {
        proxy_pass http://accelerator-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
