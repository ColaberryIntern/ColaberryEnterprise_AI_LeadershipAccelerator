# Security headers, kept in one file because nginx does NOT inherit add_header.
#
# Per the nginx docs, add_header directives are inherited from the previous
# configuration level "if and only if there are no add_header directives defined
# on the current level." So any location block that sets its own header (for
# example Cache-Control) silently discards every security header declared on the
# server block. That is not an error and nothing logs it.
#
# This bit us for real: the 2026-07-09 Lighthouse audit on BC #9946499832 flagged
# 0 of 6 security headers. They were added at server level on 2026-08-03 and
# deployed, and the audit still failed, because `location /` sets Cache-Control
# and therefore dropped all of them for every page request.
#
# Rule: any location block that declares its own add_header MUST also include
# this file. Adding a bare add_header to a location without this include silently
# strips the site's security headers for that route.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
# script-src must list every host the app actually loads scripts from, or the
# page silently breaks. Current set: d3 (index.html), unpkg + jsdelivr + cdnjs
# (curriculum *.card.html component previews), googletagmanager (analytics.ts
# injects it at runtime). 'unsafe-eval' is required by @babel/standalone, which
# the card previews use to compile JSX in the browser.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://d3js.org https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' data: blob:; worker-src 'self' blob:; frame-ancestors 'self'" always;
