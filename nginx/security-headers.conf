# Security headers — included, not inherited.
#
# nginx's add_header directives are inherited from an outer block ONLY if the
# inner block declares no add_header of its own. Several location blocks here
# set their own cache-control headers, which silently discards every
# server-level security header for those routes — including `location /`, the
# SPA fallback that serves the entire site. That is why enterprise.colaberry.ai
# served none of these headers despite them being configured at the server
# level since before the 2026-07-09 launch-readiness audit.
#
# Keeping them in one file and `include`-ing it into every block that declares
# its own add_header is the standard fix: one source of truth, re-stated where
# nginx requires it. If you add a location that sets any add_header, include
# this file there too.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

# script-src must list every host the app actually loads scripts from, or the
# page silently breaks. Current set: d3 (index.html), unpkg + jsdelivr + cdnjs
# (curriculum *.card.html component previews), googletagmanager (analytics.ts
# injects it at runtime). 'unsafe-eval' is required by @babel/standalone, which
# the card previews use to compile JSX in the browser.
#
# frame-src must list every video provider <VideoEmbed> can render (see
# frontend/src/utils/videoEmbed.ts parseVideoUrl) or every video card on the
# timeline renders as a blocked, empty frame. YouTube is served from
# youtube-nocookie.com by parseVideoUrl; youtube.com is listed too because
# authored/legacy embeds and card body_html still point at it.
#
# media-src must be declared explicitly: <audio>/<video> fall back to
# default-src ('self') when it is absent, which blocks the Buzzsprout podcast
# episodes and every direct-file (.mp4/.mp3) video card.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://d3js.org https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' data: blob: https:; frame-src 'self' data: blob: https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com https://www.loom.com https://fast.wistia.net https://www.cameratag.com https://www.buzzsprout.com https://docs.google.com https://drive.google.com; worker-src 'self' blob:; frame-ancestors 'self'" always;
